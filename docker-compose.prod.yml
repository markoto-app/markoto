# Production stack.
# Traefik with Let's Encrypt TLS, all app images pulled from GHCR, external S3.
# Run: docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
#
# See docs/DEPLOY.md for DNS and TLS prerequisites.
#
# Policy: every `${VAR}` substitution below uses `:?` so a missing .env
# entry crashes `docker compose up` instead of silently booting with an
# empty value or a hidden default. The single source of truth is .env.
#
# Common service shape lives in docker-compose.base.yml (see header).
# This file overrides image tags (build → registry), hardens posture
# (expose-only, mem_limit), wires the `web`/`internal` networks, adds
# Traefik with Let's Encrypt + the security-headers middleware, and
# attaches Postgres TLS env vars + the SENTRY/OAuth secret pass-through.

include:
  - docker-compose.base.yml

networks:
  web:
    name: web
  internal:
    name: internal

services:
  traefik:
    image: traefik:v3@sha256:c8a121e4bb1347e8fd52657fab12f2cb70b68f8a018895e2068f92c9e519b9c2
    restart: unless-stopped
    command:
      - "--api.dashboard=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=web"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL:?ACME_EMAIL required}"
      - "--certificatesresolvers.le.acme.storage=/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/acme.json:/acme.json
    networks:
      - web

  postgres:
    expose:
      - "5432"
    networks:
      - internal

  valkey:
    # `expose:` keeps Valkey on the docker `internal` network only — no
    # host port. The threat model in docs/SECURITY-HARDENING.md
    # explicitly treats the docker bridge as the trust boundary;
    # publishing 6379 to the VPS host would let any process on the box
    # hit Valkey even if firewalled at the network edge. Verify
    # post-deploy:
    #   ss -ltnp | grep :6379  # expect: nothing on the host
    expose:
      - "6379"
    networks:
      - internal

  app:
    image: ${REGISTRY:?REGISTRY required}/markoto-app:${IMAGE_TAG:?IMAGE_TAG required}
    restart: unless-stopped
    # SIGTERM handler needs time to drain HTTP and close the pg pool.
    stop_grace_period: 30s
    # The Nuxt SSR + Nitro process is the busiest service. 2 GB covers SSR
    # render peaks + the pg pool + in-flight AI loops with headroom; a cap
    # means a leak or a pathological request restarts the app alone rather
    # than OOMing sync/postgres/renderer alongside it.
    mem_limit: 2g
    environment:
      - NUXT_SESSION_PASSWORD=${NUXT_SESSION_PASSWORD:?NUXT_SESSION_PASSWORD required}
      - NUXT_OAUTH_GITHUB_CLIENT_ID=${NUXT_OAUTH_GITHUB_CLIENT_ID}
      - NUXT_OAUTH_GITHUB_CLIENT_SECRET=${NUXT_OAUTH_GITHUB_CLIENT_SECRET}
      - NUXT_OAUTH_GOOGLE_CLIENT_ID=${NUXT_OAUTH_GOOGLE_CLIENT_ID}
      - NUXT_OAUTH_GOOGLE_CLIENT_SECRET=${NUXT_OAUTH_GOOGLE_CLIENT_SECRET}
      - NUXT_S3_ENDPOINT=${NUXT_S3_ENDPOINT:?NUXT_S3_ENDPOINT required}
      - NUXT_S3_ACCESS_KEY=${NUXT_S3_ACCESS_KEY:?NUXT_S3_ACCESS_KEY required}
      - NUXT_S3_SECRET_KEY=${NUXT_S3_SECRET_KEY:?NUXT_S3_SECRET_KEY required}
      - NUXT_S3_BUCKET=${NUXT_S3_BUCKET:?NUXT_S3_BUCKET required}
      - NUXT_JWT_SECRET=${NUXT_JWT_SECRET:?NUXT_JWT_SECRET required}
      # Optional, only set during rotation — see docs/SECRETS-ROTATION.md.
      - NUXT_JWT_SECRET_PREVIOUS=${NUXT_JWT_SECRET_PREVIOUS}
      - NUXT_INTERNAL_API_SECRET=${NUXT_INTERNAL_API_SECRET:?NUXT_INTERNAL_API_SECRET required}
      - NUXT_INTERNAL_API_SECRET_PREVIOUS=${NUXT_INTERNAL_API_SECRET_PREVIOUS}
      # Sentry (sentry.io). Server pulls from SENTRY_DSN with fallback
      # to NUXT_PUBLIC_SENTRY_DSN per sentry.server.config.ts.
      - NUXT_PUBLIC_SENTRY_DSN=${NUXT_PUBLIC_SENTRY_DSN}
      - SENTRY_DSN=${SENTRY_DSN}
      # Phase 5: every AI surface routes through LiteLLM. Distinct
      # dictation-JWT secret falls back to NUXT_JWT_SECRET when empty.
      - NUXT_AI_DICTATE_JWT_SECRET=${NUXT_AI_DICTATE_JWT_SECRET}
      # AI grounding provider keys read directly by the app process (NOT via
      # LiteLLM): Staan backs web_search, Jina Reader backs fetch_url. Enable
      # Staan EU-only routing in the dashboard — no per-request parameter.
      # Platform-paid web tools. Optional: without a key the matching tool
      # (web_search / fetch_url) is simply not offered to the AI and
      # /api/ai/availability reports webTools.{search,fetch}=false.
      - STAAN_API_KEY=${STAAN_API_KEY:-}
      - JINA_AI_API_KEY=${JINA_AI_API_KEY:-}
      # Per-user web-tool allowance (calls/hour, calls/day; 0 = unlimited,
      # empty = default 30 / 100). Shared by the editor AI and MCP.
      - NUXT_WEB_TOOLS_HOURLY_LIMIT=${NUXT_WEB_TOOLS_HOURLY_LIMIT:-}
      - NUXT_WEB_TOOLS_DAILY_LIMIT=${NUXT_WEB_TOOLS_DAILY_LIMIT:-}
      # Bring-your-own-key AI (WP4). No defaults here: the hosted SaaS sets
      # no instance AI defaults (users bring their own key) and renders the
      # provider allowlist into .env (infra/render-env.sh). Self-hosters set
      # NUXT_AI_DEFAULT_* in .env. See server/utils/aiProviders/config.ts.
      # MISTRAL_API_KEY reaches the app only for live dictation on a
      # platform-alias transcription default.
      - NUXT_AI_DEFAULT_CHAT_MODEL=${NUXT_AI_DEFAULT_CHAT_MODEL:-}
      - NUXT_AI_DEFAULT_CHAT_BASE_URL=${NUXT_AI_DEFAULT_CHAT_BASE_URL:-}
      - NUXT_AI_DEFAULT_CHAT_API_KEY=${NUXT_AI_DEFAULT_CHAT_API_KEY:-}
      - NUXT_AI_DEFAULT_CHAT_VISION=${NUXT_AI_DEFAULT_CHAT_VISION:-}
      - NUXT_AI_DEFAULT_IMAGE_MODEL=${NUXT_AI_DEFAULT_IMAGE_MODEL:-}
      - NUXT_AI_DEFAULT_IMAGE_BASE_URL=${NUXT_AI_DEFAULT_IMAGE_BASE_URL:-}
      - NUXT_AI_DEFAULT_IMAGE_API_KEY=${NUXT_AI_DEFAULT_IMAGE_API_KEY:-}
      - NUXT_AI_DEFAULT_TRANSCRIBE_MODEL=${NUXT_AI_DEFAULT_TRANSCRIBE_MODEL:-}
      - NUXT_AI_DEFAULT_TRANSCRIBE_BASE_URL=${NUXT_AI_DEFAULT_TRANSCRIBE_BASE_URL:-}
      - NUXT_AI_DEFAULT_TRANSCRIBE_API_KEY=${NUXT_AI_DEFAULT_TRANSCRIBE_API_KEY:-}
      # Hosted shape: the provider allowlist is mandatory (the app also
      # refuses to boot with legal surfaces on and an empty list). Rendered
      # by infra/render-env.sh / infra/templates/env.j2.
      - NUXT_AI_BYOK_ALLOWED_BASE_URLS=${NUXT_AI_BYOK_ALLOWED_BASE_URLS:?NUXT_AI_BYOK_ALLOWED_BASE_URLS required (BYOK provider allowlist)}
      - NUXT_AI_BYOK_ALLOW_PRIVATE_URLS=${NUXT_AI_BYOK_ALLOW_PRIVATE_URLS:-false}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      # LiteLLM proxy. server/plugins/01-validate-secrets.ts requires the
      # LiteLLM pair unconditionally, so the app crash-loops at boot without
      # these. The URL targets the in-network proxy; the master key matches
      # the one mounted into the litellm container from .env.
      - NUXT_LITELLM_URL=http://litellm:4000
      # Embeddings (self-hosters can override; hosted keeps these defaults,
      # which equal the nuxt.config.ts defaults). docs/AI-MODELS.md#embeddings
      - NUXT_LITELLM_EMBEDDINGS_MODEL=${NUXT_LITELLM_EMBEDDINGS_MODEL:-jina-embeddings-v5-text-nano}
      - NUXT_LITELLM_EMBEDDINGS_DIMS=${NUXT_LITELLM_EMBEDDINGS_DIMS:-768}
      - NUXT_LITELLM_EMBEDDINGS_SEND_DIMENSIONS=${NUXT_LITELLM_EMBEDDINGS_SEND_DIMENSIONS:-auto}
      - NUXT_LITELLM_EMBEDDINGS_TASK_HINTS=${NUXT_LITELLM_EMBEDDINGS_TASK_HINTS:-auto}
      - NUXT_LITELLM_EMBEDDINGS_UPSTREAM_MODEL=${EMBEDDINGS_UPSTREAM_MODEL:-}
      - NUXT_LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY required}
      # Billing mode (shared/config/billingMode.ts). Default: billing OFF —
      # no Stripe calls, Stripe vars not required, everyone on the free tier.
      # NUXT_PLANS_COMING_SOON=true is the hosted free-only SaaS (pricing
      # page "coming soon" + waitlist); leave it false when self-hosting.
      - NUXT_BILLING_ENABLED=${NUXT_BILLING_ENABLED:-false}
      - NUXT_PLANS_COMING_SOON=${NUXT_PLANS_COMING_SOON:-false}
      # Legal surfaces (shared/config/instance.ts): onboarding gate, consent
      # banner, DPA step, /legal/* pages. This file is the HOSTED stack, so
      # they default ON here (the code default is off, for self-hosters —
      # see docker-compose.selfhost.yml).
      - NUXT_LEGAL_SURFACES_ENABLED=${NUXT_LEGAL_SURFACES_ENABLED:-true}
      # Number of trusted reverse proxies in front of the app (Traefik = 1).
      # See shared/utils/clientIp.ts.
      - NUXT_TRUSTED_PROXY_HOPS=${NUXT_TRUSTED_PROXY_HOPS:-1}
      # Stripe — only read (and only required at boot, in production) when
      # NUXT_BILLING_ENABLED=true.
      - NUXT_STRIPE_SECRET_KEY=${NUXT_STRIPE_SECRET_KEY:-}
      - NUXT_STRIPE_WEBHOOK_SECRET=${NUXT_STRIPE_WEBHOOK_SECRET:-}
      - NUXT_STRIPE_PRICE_PRO=${NUXT_STRIPE_PRICE_PRO:-}
      - NUXT_STRIPE_PRICE_MAX=${NUXT_STRIPE_PRICE_MAX:-}
      - NUXT_STRIPE_PRICE_ULTRA=${NUXT_STRIPE_PRICE_ULTRA:-}
      # Optional — enables Stripe Tax on Checkout once the dashboard side is configured.
      - NUXT_STRIPE_AUTOMATIC_TAX=${NUXT_STRIPE_AUTOMATIC_TAX:-}
      # Transactional email (Resend). Empty key = stub mode (logged, not
      # sent) — sendEmail.ts auto-enables real delivery when the key is
      # present; NUXT_EMAIL_FROM must be a verified-domain address.
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - NUXT_EMAIL_FROM=${NUXT_EMAIL_FROM:-}
      # Public origin for absolute links in emails (waitlist confirm /
      # unsubscribe). Pinned to DOMAIN so links never follow a spoofed Host.
      - NUXT_SITE_URL=https://${DOMAIN:?DOMAIN required}
      # Free-tier limit overrides (shared/config/tiers.ts#resolveTiersFromEnv).
      # Empty = committed default. With billing off these ARE every account's
      # limits — raise them here (e.g. TIER_FREE_LITELLM_BUDGET_USD=20).
      - TIER_FREE_LITELLM_BUDGET_USD=${TIER_FREE_LITELLM_BUDGET_USD:-}
      - TIER_FREE_WORKSPACES_OWNED=${TIER_FREE_WORKSPACES_OWNED:-}
      - TIER_FREE_KNOWLEDGE_FILES=${TIER_FREE_KNOWLEDGE_FILES:-}
      - TIER_FREE_KNOWLEDGE_BYTES_PER_WORKSPACE=${TIER_FREE_KNOWLEDGE_BYTES_PER_WORKSPACE:-}
      - TIER_FREE_KNOWLEDGE_BYTES_PER_USER=${TIER_FREE_KNOWLEDGE_BYTES_PER_USER:-}
      - TIER_FREE_IMAGE_BYTES_PER_USER=${TIER_FREE_IMAGE_BYTES_PER_USER:-}
      # Days an unreferenced doc image is kept before the image GC deletes
      # it. Empty = 30, 0 = GC off.
      - NUXT_IMAGE_GC_RETENTION_DAYS=${NUXT_IMAGE_GC_RETENTION_DAYS:-}
      - NUXT_PUBLIC_SYNC_URL=wss://sync.${DOMAIN:?DOMAIN required}
      - NUXT_SYNC_INTERNAL_URL=http://sync:4001
      - NUXT_MARKITDOWN_URL=http://markitdown:8080
      - NUXT_RENDERER_INTERNAL_URL=http://renderer:9000
      # Mirrored into the print-page CSP (server/utils/renderCsp.ts); the renderer reads the same variable.
      - RENDERER_ALLOWED_ORIGINS=${RENDERER_ALLOWED_ORIGINS:-}
      # Postgres + Valkey atomic parts. HOST/PORT default to the in-stack
      # container; a managed-Postgres deployment overrides them via .env
      # (POSTGRES_HOST=<cluster-host> POSTGRES_PORT=<port> + the TLS vars
      # below). The Nuxt app composes the URL via
      # shared/utils/connectionStrings.ts. NOTE: in managed mode the
      # in-stack postgres container still runs (compose `include:` can't
      # drop a service) — it sits idle and keeps the depends_on
      # healthcheck satisfied; accepted overhead.
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - VALKEY_PASSWORD=${VALKEY_PASSWORD}
      - VALKEY_DB=${VALKEY_DB:?VALKEY_DB required}
      # Postgres TLS posture — see docs/DEPLOY.md and shared/utils/postgresSsl.ts.
      # Empty PGSSLROOTCERT is fine: prod default is rejectUnauthorized
      # against the system CA bundle. Set it to a bind-mounted PEM path
      # (e.g. /run/secrets/managed_pg_ca.pem) for cert-pin verification.
      - NODE_ENV=production
      - PGSSLROOTCERT=${PGSSLROOTCERT:-}
      - PGSSL=${PGSSL:-}
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=le"
      - "traefik.http.services.app.loadbalancer.server.port=3000"
      - "traefik.http.services.app.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.app.loadbalancer.healthcheck.interval=10s"
      # Bumped from 3s → 10s when /api/health became a deep probe.
      # Cache hits return in microseconds; cache misses fan out 5
      # parallel 1-second probes, so worst case is ~1s. 10s is generous
      # headroom.
      - "traefik.http.services.app.loadbalancer.healthcheck.timeout=10s"
      # ─── Security headers + CSP (see docs/SECURITY-HARDENING.md) ───
      # Applied to every response from the app router. Traefik's
      # `headers` middleware has named fields for HSTS / CSP / referrer /
      # frame-deny / nosniff; everything else lands in
      # `customResponseHeaders`. Strings with commas / parens / spaces
      # are quoted to survive Compose's CSV-style label parsing.
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      # CSP rationale per directive in docs/SECURITY-HARDENING.md.
      # 'unsafe-inline' on script-src/style-src is unfortunate but
      # required for Vite/Nuxt SSR hydration scripts and Nuxt UI's
      # injected style block. 'unsafe-eval' is needed by Vue runtime
      # compilation paths and mermaid. cdn.jsdelivr.net carries paged.js,
      # KaTeX, hljs themes, and mermaid ESM. fonts.* serves the 20-font
      # Google Fonts picker. wss://sync.${DOMAIN} is Hocuspocus.
      # connect-src includes *.ingest.sentry.io for browser error
      # reporting; api.stripe.com + js.stripe.com are listed pre-emptively
      # for the not-yet-shipped checkout integration (AGENTS.md §7).
      - "traefik.http.middlewares.security-headers.headers.contentSecurityPolicy=default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://js.stripe.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data: blob: https://${DOMAIN} https://*.${DOMAIN} ${NUXT_S3_ENDPOINT}; connect-src 'self' https://${DOMAIN} wss://sync.${DOMAIN} https://api.stripe.com https://*.ingest.sentry.io ${NUXT_S3_ENDPOINT}; frame-src 'self' https://js.stripe.com https://hooks.stripe.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - "traefik.http.middlewares.security-headers.headers.customResponseHeaders.Cross-Origin-Opener-Policy=same-origin"
      - "traefik.http.middlewares.security-headers.headers.customResponseHeaders.Cross-Origin-Resource-Policy=same-site"
      - "traefik.http.middlewares.security-headers.headers.customResponseHeaders.Permissions-Policy=camera=(), microphone=(self), geolocation=(), payment=(self)"
      - "traefik.http.routers.app.middlewares=security-headers"
      # /api/import (anonymous document import, 50 MB file cap) gets its own
      # router with a request-body limit, so an oversized or endless upload
      # is cut off at the edge instead of streaming into the app. 51 MiB =
      # the app's MAX_BODY (file + multipart framing). Longer rule = higher
      # priority than the catch-all `app` router.
      - "traefik.http.routers.app-import.rule=Host(`${DOMAIN}`) && Path(`/api/import`)"
      - "traefik.http.routers.app-import.entrypoints=websecure"
      - "traefik.http.routers.app-import.tls.certresolver=le"
      - "traefik.http.routers.app-import.service=app"
      - "traefik.http.routers.app-import.middlewares=import-body-limit,security-headers"
      - "traefik.http.middlewares.import-body-limit.buffering.maxRequestBodyBytes=53477376"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      # Phase 5: every AI surface routes through LiteLLM. Gate app
      # startup on the proxy being healthy so a cold deploy doesn't
      # 502 user AI calls in the window between app-up and proxy-up.
      litellm:
        condition: service_healthy
    # Managed-Postgres CA (render-env points PGSSLROOTCERT here). The dir
    # is auto-created empty when unused — the mount is inert in in-stack
    # mode.
    volumes:
      - /opt/markoto/secrets:/opt/markoto/secrets:ro
    networks:
      web: {}
      internal:
        # Chromium (renderer) can't use the service name `app`: it's an
        # HSTS-preloaded TLD, so http://app:3000 is upgraded to https and
        # fails with ERR_SSL_PROTOCOL_ERROR. The renderer uses this alias.
        aliases:
          - markoto-app

  # LiteLLM + its DB-init one-shot come from docker-compose.base.yml via
  # `include:`. Compose REPLACES `networks:` wholesale on merge, and base
  # leaves them on the default network — but prod's postgres is on `internal`
  # only, so without this override litellm-db-init can't reach postgres and
  # litellm never becomes healthy (which gates `app` startup). Mirror the
  # same override docker-compose.local.yml uses.
  litellm:
    networks:
      - internal
    environment:
      # Managed-Postgres override of base's hardcoded @postgres:5432.
      # sslmode=require (encrypted, no CA pin) is enough for the proxy's
      # own bookkeeping DB — the primary data path (app + sync) pins the
      # CA via PGSSLROOTCERT.
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/litellm?sslmode=${POSTGRES_SSLMODE:-disable}
  litellm-db-init:
    networks:
      - internal
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      # libpq TLS: require in managed mode, disable in-stack.
      - PGSSLMODE=${POSTGRES_SSLMODE:-disable}
    # Base hardcodes `-h postgres`; command REPLACES wholesale on compose
    # merge, so this override is the full parameterized equivalent. On a
    # managed cluster the POSTGRES_USER needs CREATEDB rights (OVH's
    # default admin user has them).
    command:
      - |
        psql -h "$$POSTGRES_HOST" -p "$$POSTGRES_PORT" -U "$$POSTGRES_USER" -d postgres -tAc \
          "SELECT 1 FROM pg_database WHERE datname='litellm'" \
          | grep -q 1 || \
          psql -h "$$POSTGRES_HOST" -p "$$POSTGRES_PORT" -U "$$POSTGRES_USER" -d postgres -c "CREATE DATABASE litellm;"

  sync:
    image: ${REGISTRY}/markoto-sync:${IMAGE_TAG}
    environment:
      - JWT_SECRET=${NUXT_JWT_SECRET}
      - JWT_SECRET_PREVIOUS=${NUXT_JWT_SECRET_PREVIOUS}
      - INTERNAL_API_SECRET=${NUXT_INTERNAL_API_SECRET}
      - INTERNAL_API_SECRET_PREVIOUS=${NUXT_INTERNAL_API_SECRET_PREVIOUS}
      - VALKEY_DB=${VALKEY_DB:?VALKEY_DB required}
      - SENTRY_DSN=${SENTRY_DSN}
      - APP_URL=http://app:3000
      # Postgres TLS posture — same as the app container. y-postgresql's
      # internal pool inherits the ssl config we pass via PoolConfig.
      - NODE_ENV=production
      - PGSSLROOTCERT=${PGSSLROOTCERT:-}
      - PGSSL=${PGSSL:-}
      # Managed-Postgres override of base's hardcoded service name.
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    volumes:
      - /opt/markoto/secrets:/opt/markoto/secrets:ro
    expose:
      - "4001"
    labels:
      - "traefik.enable=true"
      # Sticky sessions: route all WS connections for a given client
      # cookie to the same sync-server instance. This keeps a single
      # client's awareness/edit stream pinned, but doesn't fully
      # serialize cross-instance flushes for the same docId (two
      # different clients on the same doc CAN land on different
      # instances). The residual cross-instance race on
      # `sync:prev-text:{docId}` is documented in
      # `sync-server/AGENTS.md`; worst case is one duplicate activity
      # row per cross-container concurrency event — not corrupting,
      # just noisy.
      - "traefik.http.services.sync.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.sync.loadbalancer.sticky.cookie.name=sync_sticky"
      - "traefik.http.services.sync.loadbalancer.sticky.cookie.httpOnly=true"
      - "traefik.http.services.sync.loadbalancer.sticky.cookie.secure=true"
      - "traefik.http.routers.sync.rule=Host(`sync.${DOMAIN}`)"
      - "traefik.http.routers.sync.entrypoints=websecure"
      - "traefik.http.routers.sync.tls.certresolver=le"
      - "traefik.http.services.sync.loadbalancer.server.port=4001"
      - "traefik.http.services.sync.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.sync.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.sync.loadbalancer.healthcheck.timeout=3s"
      # Security headers for the sync subdomain. CSP is intentionally
      # omitted: this endpoint serves the Hocuspocus WebSocket upgrade
      # handshake + a /health JSON probe, never HTML, so a CSP policy
      # has nothing to constrain. HSTS / nosniff / frame-deny / referrer
      # still apply — keep parity with the app domain.
      - "traefik.http.middlewares.sync-security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.sync-security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.sync-security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.sync-security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.sync-security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.sync-security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.sync-security-headers.headers.customResponseHeaders.Cross-Origin-Opener-Policy=same-origin"
      - "traefik.http.middlewares.sync-security-headers.headers.customResponseHeaders.Cross-Origin-Resource-Policy=same-site"
      - "traefik.http.routers.sync.middlewares=sync-security-headers"
    networks:
      - web
      - internal

  markitdown:
    image: ${REGISTRY}/markoto-markitdown:${IMAGE_TAG}
    expose:
      - "8080"
    networks:
      - internal

  # Backend PDF + PNG renderer — Playwright + Chromium navigates back to the
  # app's /_internal/render/:docId page (gated by INTERNAL_API_SECRET-signed
  # render tokens). Internal-network-only; never reachable from outside.
  renderer:
    image: ${REGISTRY}/markoto-renderer:${IMAGE_TAG}
    environment:
      # Not http://app:3000 — see the `markoto-app` alias on the app service.
      - APP_URL=http://markoto-app:3000
      - S3_ENDPOINT=${NUXT_S3_ENDPOINT}
      # Network allowlist (renderer/src/allowlist.ts): app origin, the S3
      # endpoint above and the pinned CDNs. Anything else is aborted.
      - RENDERER_ALLOWED_ORIGINS=${RENDERER_ALLOWED_ORIGINS:-}
    expose:
      - "9000"
    networks:
      - internal

  backup:
    image: ${REGISTRY}/markoto-backup:${IMAGE_TAG}
    volumes:
      - /opt/markoto/secrets:/opt/markoto/secrets:ro
    environment:
      # Managed-Postgres overrides (base hardcodes the in-stack host).
      # pg_dump is libpq — PGSSLMODE/PGSSLROOTCERT are honored natively.
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - PGSSLMODE=${POSTGRES_SSLMODE:-disable}
      - PGSSLROOTCERT=${PGSSLROOTCERT:-}
      - S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-${NUXT_S3_ENDPOINT}}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:?BACKUP_INTERVAL_SECONDS required}
      - BACKUP_RETENTION_COUNT=${BACKUP_RETENTION_COUNT:?BACKUP_RETENTION_COUNT required}
      # Symmetric AES-256 passphrase for client-side backup encryption.
      # Without this the sidecar refuses to start. Rotation invalidates
      # older backups for restore — schedule rotations against the
      # retention window. See docs/DEPLOY.md §6.
      - BACKUP_GPG_PASSPHRASE=${BACKUP_GPG_PASSPHRASE:?BACKUP_GPG_PASSPHRASE required}
    networks:
      - internal
