# Production stack.
# Traefik with Let's Encrypt TLS, all app images pulled from GHCR, external S3.
# Run: docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
#
# See docs/DEPLOY.md for DNS and TLS prerequisites.
#
# Policy: every `${VAR}` substitution below uses `:?` so a missing .env
# entry crashes `docker compose up` instead of silently booting with an
# empty value or a hidden default. The single source of truth is .env.

networks:
  web:
    name: web
  internal:
    name: internal

services:
  traefik:
    image: traefik:v3@sha256:5ae9c349154d5298a5d61a7b25e5f3a9f53314f1515e87632120b95051c7917c
    restart: unless-stopped
    command:
      - "--api.dashboard=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=web"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL:?ACME_EMAIL required}"
      - "--certificatesresolvers.le.acme.storage=/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/acme.json:/acme.json
    networks:
      - web

  postgres:
    # pgvector/pgvector is Postgres 16 with the `vector` extension
    # pre-built. Required for the workspace knowledge base's
    # embedding-column + HNSW index. See docker-compose.dev.yml.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    expose:
      - "5432"
    networks:
      - internal

  valkey:
    image: valkey/valkey:8-alpine@sha256:1cb6b20b70d927560cc4cc5397b5f045e74aa603ff7696274778880bb6fadc75
    restart: unless-stopped
    # Password-protected. AOF with fsync-every-second gives durability
    # adequate for rate-limit + session-lock keyspace.
    # maxmemory caps container RAM; allkeys-lru keeps hot keys under pressure.
    command:
      - "valkey-server"
      - "--requirepass"
      - "${VALKEY_PASSWORD:?VALKEY_PASSWORD required}"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    expose:
      - "6379"
    volumes:
      - valkey_data:/data
    networks:
      - internal

  app:
    image: ${REGISTRY:?REGISTRY required}/md-online-app:${IMAGE_TAG:?IMAGE_TAG required}
    restart: unless-stopped
    # SIGTERM handler needs time to drain HTTP and close the pg pool.
    stop_grace_period: 30s
    environment:
      - NUXT_SESSION_PASSWORD=${NUXT_SESSION_PASSWORD:?NUXT_SESSION_PASSWORD required}
      - NUXT_OAUTH_GITHUB_CLIENT_ID=${NUXT_OAUTH_GITHUB_CLIENT_ID}
      - NUXT_OAUTH_GITHUB_CLIENT_SECRET=${NUXT_OAUTH_GITHUB_CLIENT_SECRET}
      - NUXT_OAUTH_GOOGLE_CLIENT_ID=${NUXT_OAUTH_GOOGLE_CLIENT_ID}
      - NUXT_OAUTH_GOOGLE_CLIENT_SECRET=${NUXT_OAUTH_GOOGLE_CLIENT_SECRET}
      - NUXT_S3_ENDPOINT=${NUXT_S3_ENDPOINT:?NUXT_S3_ENDPOINT required}
      - NUXT_S3_ACCESS_KEY=${NUXT_S3_ACCESS_KEY:?NUXT_S3_ACCESS_KEY required}
      - NUXT_S3_SECRET_KEY=${NUXT_S3_SECRET_KEY:?NUXT_S3_SECRET_KEY required}
      - NUXT_S3_BUCKET=${NUXT_S3_BUCKET:?NUXT_S3_BUCKET required}
      - NUXT_JWT_SECRET=${NUXT_JWT_SECRET:?NUXT_JWT_SECRET required}
      # Optional, only set during rotation — see docs/SECRETS-ROTATION.md.
      - NUXT_JWT_SECRET_PREVIOUS=${NUXT_JWT_SECRET_PREVIOUS}
      - NUXT_INTERNAL_API_SECRET=${NUXT_INTERNAL_API_SECRET:?NUXT_INTERNAL_API_SECRET required}
      - NUXT_INTERNAL_API_SECRET_PREVIOUS=${NUXT_INTERNAL_API_SECRET_PREVIOUS}
      # Sentry (sentry.io). Server pulls from SENTRY_DSN with fallback
      # to NUXT_PUBLIC_SENTRY_DSN per sentry.server.config.ts.
      - NUXT_PUBLIC_SENTRY_DSN=${NUXT_PUBLIC_SENTRY_DSN}
      - SENTRY_DSN=${SENTRY_DSN}
      # Two Google API keys: Gemini (text + images + embeddings) and
      # Cloud STT (voice + dictation). Restricted independently in GCP.
      - NUXT_GOOGLE_GEMINI_API_KEY=${NUXT_GOOGLE_GEMINI_API_KEY:?NUXT_GOOGLE_GEMINI_API_KEY required}
      - NUXT_GOOGLE_SPEECH_TO_TEXT_API_KEY=${NUXT_GOOGLE_SPEECH_TO_TEXT_API_KEY:?NUXT_GOOGLE_SPEECH_TO_TEXT_API_KEY required}
      # Distinct dictation-JWT secret. Falls back to NUXT_JWT_SECRET in
      # the runtimeConfig when empty (see AGENTS.md §7).
      - NUXT_GOOGLE_DICTATE_JWT_SECRET=${NUXT_GOOGLE_DICTATE_JWT_SECRET}
      - NUXT_PUBLIC_SYNC_URL=wss://sync.${DOMAIN:?DOMAIN required}
      - NUXT_SYNC_INTERNAL_URL=http://sync:4001
      - NUXT_MARKITDOWN_URL=http://markitdown:8080
      # Postgres + Valkey atomic parts. *_HOST overridden to the docker
      # service name; .env owns user/password/db/port. The Nuxt app
      # composes the URL via shared/utils/connectionStrings.ts.
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - VALKEY_PASSWORD=${VALKEY_PASSWORD}
      - VALKEY_DB=${VALKEY_DB:?VALKEY_DB required}
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=le"
      - "traefik.http.services.app.loadbalancer.server.port=3000"
      - "traefik.http.services.app.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.app.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.app.loadbalancer.healthcheck.timeout=3s"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - web
      - internal

  sync:
    image: ${REGISTRY}/md-online-sync:${IMAGE_TAG}
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - PORT=4001
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - JWT_SECRET=${NUXT_JWT_SECRET}
      - JWT_SECRET_PREVIOUS=${NUXT_JWT_SECRET_PREVIOUS}
      - INTERNAL_API_SECRET=${NUXT_INTERNAL_API_SECRET}
      - INTERNAL_API_SECRET_PREVIOUS=${NUXT_INTERNAL_API_SECRET_PREVIOUS}
      - SENTRY_DSN=${SENTRY_DSN}
      - APP_URL=http://app:3000
    expose:
      - "4001"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sync.rule=Host(`sync.${DOMAIN}`)"
      - "traefik.http.routers.sync.entrypoints=websecure"
      - "traefik.http.routers.sync.tls.certresolver=le"
      - "traefik.http.services.sync.loadbalancer.server.port=4001"
      - "traefik.http.services.sync.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.sync.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.sync.loadbalancer.healthcheck.timeout=3s"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - web
      - internal

  markitdown:
    image: ${REGISTRY}/md-online-markitdown:${IMAGE_TAG}
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - internal

  backup:
    image: ${REGISTRY}/md-online-backup:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - S3_ENDPOINT=${NUXT_S3_ENDPOINT}
      - S3_ACCESS_KEY=${NUXT_S3_ACCESS_KEY}
      - S3_SECRET_KEY=${NUXT_S3_SECRET_KEY}
      - S3_BUCKET=${NUXT_S3_BUCKET}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:?BACKUP_INTERVAL_SECONDS required}
      - BACKUP_RETENTION_COUNT=${BACKUP_RETENTION_COUNT:?BACKUP_RETENTION_COUNT required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

volumes:
  pg_data:
  valkey_data:
