# Production stack.
# Traefik with Let's Encrypt TLS, all app images pulled from GHCR, external S3.
# Run: docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
#
# See docs/DEPLOY.md for DNS and TLS prerequisites.

x-glitchtip-env: &glitchtip-env
  DATABASE_URL: postgres://ypad:${POSTGRES_PASSWORD}@postgres:5432/glitchtip
  # Separate Valkey logical DB so GlitchTip's Celery queue doesn't
  # collide with our rate-limiter's keyspace on DB 0.
  VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/1
  SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
  GLITCHTIP_DOMAIN: https://telemetry.${DOMAIN}
  CSRF_TRUSTED_ORIGINS: https://telemetry.${DOMAIN}
  DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-errors@localhost}
  EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
  # After the first superuser is created via `./manage.py
  # createsuperuser`, pull up the drawbridge.
  ENABLE_USER_REGISTRATION: "False"
  ENABLE_ORGANIZATION_CREATION: "False"

networks:
  web:
    name: web
  internal:
    name: internal

services:
  traefik:
    image: traefik:v3@sha256:5ae9c349154d5298a5d61a7b25e5f3a9f53314f1515e87632120b95051c7917c
    restart: unless-stopped
    command:
      - "--api.dashboard=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=web"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/acme.json:/acme.json
    networks:
      - web

  postgres:
    # pgvector/pgvector is Postgres 16 with the `vector` extension
    # pre-built. Required for the workspace knowledge base's
    # embedding-column + HNSW index. See docker-compose.dev.yml.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=ypad
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ypad
    volumes:
      - pg_data:/var/lib/postgresql/data
      # One-shot init scripts — sourced on first volume bring-up. Creates
      # the glitchtip DB alongside ypad so GlitchTip gets its own database,
      # not a schema inside ours.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ypad -d ypad"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    expose:
      - "5432"
    networks:
      - internal

  valkey:
    image: valkey/valkey:8-alpine@sha256:1cb6b20b70d927560cc4cc5397b5f045e74aa603ff7696274778880bb6fadc75
    restart: unless-stopped
    # Password-protected. AOF with fsync-every-second gives durability
    # adequate for rate-limit + future GlitchTip broker use.
    # maxmemory caps container RAM; allkeys-lru keeps hot keys under pressure.
    command:
      - "valkey-server"
      - "--requirepass"
      - "${VALKEY_PASSWORD}"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    expose:
      - "6379"
    volumes:
      - valkey_data:/data
    networks:
      - internal

  app:
    image: ${REGISTRY:-ghcr.io/joelbarmettleruzh}/md-online-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # SIGTERM handler needs time to drain HTTP and close the pg pool.
    stop_grace_period: 30s
    environment:
      - NUXT_SESSION_PASSWORD=${SESSION_PASSWORD}
      - NUXT_OAUTH_GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - NUXT_OAUTH_GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - NUXT_OAUTH_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - NUXT_OAUTH_GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - NUXT_S3_ENDPOINT=${S3_ENDPOINT}
      - NUXT_S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - NUXT_S3_SECRET_KEY=${S3_SECRET_KEY}
      - NUXT_S3_BUCKET=${S3_BUCKET:-ypad}
      - NUXT_JWT_SECRET=${JWT_SECRET}
      # Optional, only set during rotation — see docs/SECRETS-ROTATION.md.
      # Nuxt runtimeConfig reads `jwtSecretPrevious` via NUXT_ prefix.
      - NUXT_JWT_SECRET_PREVIOUS=${JWT_SECRET_PREVIOUS:-}
      - NUXT_INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - NUXT_INTERNAL_API_SECRET_PREVIOUS=${INTERNAL_API_SECRET_PREVIOUS:-}
      # Sentry / GlitchTip. Browser uses the public host (front-end);
      # server-side uses the internal service name so events don't
      # round-trip through public DNS.
      - NUXT_PUBLIC_SENTRY_DSN=${NUXT_PUBLIC_SENTRY_DSN:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - NUXT_GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - NUXT_GOOGLE_MODEL=${GOOGLE_MODEL:-gemini-3.1-flash-lite-preview}
      - NUXT_GOOGLE_REWRITE_MODEL=${GOOGLE_REWRITE_MODEL:-gemini-2.5-flash-lite}
      - NUXT_PUBLIC_SYNC_URL=wss://sync.${DOMAIN}
      - NUXT_SYNC_INTERNAL_URL=http://sync:4001
      - NUXT_MARKITDOWN_URL=http://markitdown:8080
      - DATABASE_URL=postgres://ypad:${POSTGRES_PASSWORD}@postgres:5432/ypad
      - VALKEY_URL=redis://:${VALKEY_PASSWORD}@valkey:6379/0
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=le"
      - "traefik.http.services.app.loadbalancer.server.port=3000"
      - "traefik.http.services.app.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.app.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.app.loadbalancer.healthcheck.timeout=3s"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - web
      - internal

  sync:
    image: ${REGISTRY:-ghcr.io/joelbarmettleruzh}/md-online-sync:${IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - PORT=4001
      - DATABASE_URL=postgres://ypad:${POSTGRES_PASSWORD}@postgres:5432/ypad
      - JWT_SECRET=${JWT_SECRET}
      - JWT_SECRET_PREVIOUS=${JWT_SECRET_PREVIOUS:-}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - INTERNAL_API_SECRET_PREVIOUS=${INTERNAL_API_SECRET_PREVIOUS:-}
      # Sentry / GlitchTip — internal service URL, same as app container.
      - SENTRY_DSN=${SENTRY_DSN:-}
      - APP_URL=http://app:3000
    expose:
      - "4001"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sync.rule=Host(`sync.${DOMAIN}`)"
      - "traefik.http.routers.sync.entrypoints=websecure"
      - "traefik.http.routers.sync.tls.certresolver=le"
      - "traefik.http.services.sync.loadbalancer.server.port=4001"
      - "traefik.http.services.sync.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.sync.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.sync.loadbalancer.healthcheck.timeout=3s"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - web
      - internal

  markitdown:
    image: ${REGISTRY:-ghcr.io/joelbarmettleruzh}/md-online-markitdown:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - internal

  backup:
    image: ${REGISTRY:-ghcr.io/joelbarmettleruzh}/md-online-backup:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=ypad
      - POSTGRES_DB=ypad
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET:-ypad}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      - BACKUP_RETENTION_COUNT=${BACKUP_RETENTION_COUNT:-30}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # ──────────────────────────────────────────────────────────────────────
  # Observability: self-hosted GlitchTip (Sentry-protocol-compatible).
  # Admin access is via GlitchTip's own email/password login — registration
  # is off (ENABLE_USER_REGISTRATION=False), the admin is seeded at boot
  # by the glitchtip-init one-shot from DJANGO_SUPERUSER_* env vars.
  #
  # Web + worker split — the image dispatches on `SERVER_ROLE`
  # (web | worker | beat). Without the worker, events queue in Valkey
  # but never process. Shared env via the `x-glitchtip-env` anchor at
  # the bottom of this file.
  # ──────────────────────────────────────────────────────────────────────

  glitchtip-init:
    # One-shot: migrate + seed admin user. Idempotent on reruns —
    # createsuperuser errors if the user already exists; we swallow.
    # Change the admin password after first boot via the web UI or
    # `./manage.py changepassword` inside the glitchtip container;
    # the env var is a bootstrap, not a source of truth.
    image: glitchtip/glitchtip:v6
    restart: "no"
    environment:
      <<: *glitchtip-env
      DJANGO_SUPERUSER_EMAIL: ${GLITCHTIP_ADMIN_EMAIL}
      DJANGO_SUPERUSER_PASSWORD: ${GLITCHTIP_ADMIN_PASSWORD}
    command: >
      sh -c "
        ./manage.py migrate --no-input &&
        ./manage.py createsuperuser --no-input 2>/dev/null || true
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  glitchtip:
    # Pinning to the major. GlitchTip publishes no SHA digests; `:v6` is
    # the stable channel.
    image: glitchtip/glitchtip:v6
    restart: unless-stopped
    environment:
      <<: *glitchtip-env
      SERVER_ROLE: web
    volumes:
      - glitchtip_uploads:/code/uploads
    depends_on:
      glitchtip-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.glitchtip.rule=Host(`telemetry.${DOMAIN}`)"
      - "traefik.http.routers.glitchtip.entrypoints=websecure"
      - "traefik.http.routers.glitchtip.tls.certresolver=le"
      - "traefik.http.services.glitchtip.loadbalancer.server.port=8000"
    networks:
      - web
      - internal

  glitchtip-worker:
    image: glitchtip/glitchtip:v6
    restart: unless-stopped
    environment:
      <<: *glitchtip-env
      SERVER_ROLE: worker
    volumes:
      - glitchtip_uploads:/code/uploads
    depends_on:
      glitchtip-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    networks:
      - internal

volumes:
  pg_data:
  valkey_data:
  glitchtip_uploads:
