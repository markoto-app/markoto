# Self-hosted markoto — the whole stack on one machine.
#
#   ./install.sh            # first install: asks a few questions, writes .env, starts
#   docker compose up -d    # afterwards (the .env written by install.sh selects this file)
#
# Full guide: docs/SELF-HOSTING.md.
#
# Same images and code as the hosted service (GHCR, `${IMAGE_TAG}`); the
# differences are configuration only. Compared with docker-compose.prod.yml
# this file bundles what a self-hoster doesn't have:
#   - Postgres (pgvector image, persistent volume) — prod uses a managed cluster
#   - S3-compatible storage (SeaweedFS, persistent volume, bucket auto-created)
#   - one public origin: app, Hocuspocus (`/sync`) and the S3 bucket
#     (`/<bucket>/…`, for presigned browser uploads/downloads) all sit behind
#     ONE Traefik entrypoint — a single DNS name / port, no CORS
#
# Shapes (picked by COMPOSE_FILE in .env, written by install.sh):
#   docker-compose.selfhost.yml                         plain HTTP on ${MARKOTO_HTTP_PORT}
#                                                       (LAN, or behind your own TLS proxy)
#   + docker-compose.selfhost.tls.yml                   Let's Encrypt on 80/443 for ${MARKOTO_DOMAIN}
#   + docker-compose.selfhost.build.yml                 build images from this checkout instead of pulling
#   COMPOSE_PROFILES=backup                             daily encrypted pg_dump into the bucket
#
# Semantics reminder (see docker-compose.base.yml header): `command`,
# `volumes`, `depends_on` and `networks` REPLACE the base definition.
#
# Every host port is configurable; nothing but Traefik publishes a port.
#
# Networks are split by purpose so a compromised container reaches only
# what it needs (docs/SECURITY-HARDENING.md §C.3). `internal: true`
# networks have no route off the host. Who sits where:
#   edge             traefik, app, sync                    (published entrypoint)
#   docker-api       traefik, socket-proxy                 (read-only Docker API)
#   data             postgres, valkey + app, sync, litellm, db-init, backup
#   render           app <-> renderer
#   import           app <-> markitdown                    (markitdown has nothing else)
#   storage          seaweedfs + traefik, app, renderer, backup, s3-init
#                    (only the S3 port listens beyond seaweedfs' loopback)
#   egress           litellm, backup                       (AI providers, external backup S3)
#   renderer-egress  renderer alone                        (public URL for document images)
# The renderer and markitdown — the two services that parse untrusted
# input — can't reach Postgres, Valkey, LiteLLM or sync.

include:
  - docker-compose.base.yml

networks:
  # Explicit names (prefixed with the instance name) so Traefik can be told
  # which network to reach containers on, and two instances on one host
  # never share a network.
  edge:
    name: ${MARKOTO_INSTANCE:-markoto}-edge
  docker-api:
    name: ${MARKOTO_INSTANCE:-markoto}-docker-api
    internal: true
  data:
    name: ${MARKOTO_INSTANCE:-markoto}-data
    internal: true
  render:
    name: ${MARKOTO_INSTANCE:-markoto}-render
    internal: true
  import:
    name: ${MARKOTO_INSTANCE:-markoto}-import
    internal: true
  storage:
    name: ${MARKOTO_INSTANCE:-markoto}-storage
    internal: true
  egress:
    name: ${MARKOTO_INSTANCE:-markoto}-egress
  renderer-egress:
    name: ${MARKOTO_INSTANCE:-markoto}-renderer-egress

volumes:
  seaweed_data:

services:
  # Read-only Docker API for Traefik's docker provider: container list,
  # inspect and events only (every write endpoint and everything else
  # answers 403). Traefik never gets the socket itself, so a Traefik
  # compromise can't start containers, i.e. can't become root on the host.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    mem_limit: 64m
    environment:
      - CONTAINERS=1
      - EVENTS=1
      - PING=1
      - VERSION=1
      - POST=0
    volumes:
      # CONTAINER_SOCKET: the engine API socket (rootless Podman: $XDG_RUNTIME_DIR/podman/podman.sock). docs/CONTAINER-ENGINES.md.
      - ${CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    # Runs as root only to open the socket (root:docker 0660); no
    # capabilities, read-only (it renders its haproxy config into /tmp).
    read_only: true
    tmpfs:
      - /tmp:size=8m
      - /run:size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # SELinux hosts (Fedora/RHEL, Docker or Podman): a confined container
      # may not connect to the engine socket. Only this proxy touches it.
      - label=disable
    networks:
      - docker-api

  traefik:
    image: traefik:v3@sha256:c8a121e4bb1347e8fd52657fab12f2cb70b68f8a018895e2068f92c9e519b9c2
    restart: unless-stopped
    command:
      - "--api.dashboard=false"
      - "--global.sendAnonymousUsage=false"
      - "--ping=true"
      - "--entrypoints.web.address=:80"
      # Proxies whose X-Forwarded-* headers Traefik keeps (your own TLS
      # terminator in front of this stack). Everyone else's are stripped
      # and replaced, which is what makes NUXT_TRUSTED_PROXY_HOPS=1 safe.
      # The default trusts nothing reachable from outside.
      - "--entrypoints.web.forwardedHeaders.trustedIPs=${TRAEFIK_TRUSTED_IPS:-127.0.0.1/32}"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=${MARKOTO_INSTANCE:-markoto}-edge"
      # Only route THIS instance's containers, even if other stacks on the
      # host carry traefik.enable labels.
      - "--providers.docker.constraints=Label(`markoto.instance`,`${MARKOTO_INSTANCE:-markoto}`)"
    ports:
      - "${MARKOTO_HTTP_BIND:-0.0.0.0}:${MARKOTO_HTTP_PORT:-80}:80"
    # Root without capabilities: binding :80/:443 needs none (Docker sets
    # net.ipv4.ip_unprivileged_port_start=0 in the container), and the only
    # file it writes is acme.json on its own volume (TLS overlay).
    read_only: true
    # Docker sets this in every container's network namespace; Podman does
    # not. Without it Traefik (no capabilities) can't bind :80 / :443.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - socket-proxy
    networks:
      - edge
      - docker-api
      # Routes the bucket path to SeaweedFS (see its labels).
      - storage

  postgres:
    expose:
      - "5432"
    networks:
      - data

  valkey:
    expose:
      - "6379"
    networks:
      - data

  # install.sh generates POSTGRES_APP_* and POSTGRES_LITELLM_*, so the app
  # and LiteLLM each get a least-privilege role (infra/postgres/db-init.sh).
  db-init:
    networks:
      - data

  # LiteLLM boots with NO provider keys: every os.environ/ reference in
  # infra/litellm/config.yaml is defaulted to an empty-but-defined value in
  # docker-compose.base.yml (an undefined one crashes the proxy). Without
  # keys the bundled model aliases simply fail when called; users bring
  # their own key (Settings → AI provider) or the operator sets
  # NUXT_AI_DEFAULT_* below.
  litellm:
    # host.docker.internal → the docker host, for a local model server
    # (Ollama / vLLM) as instance default or BYOK target. Users can only
    # reach private addresses with NUXT_AI_BYOK_ALLOW_PRIVATE_URLS=true.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - data
      - egress

  # S3-compatible object storage for image uploads, knowledge files, PDF
  # renders, data exports and backups. Credentials come from .env; the
  # identity file is written at start-up (the base dev config hardcodes
  # throwaway keys).
  seaweedfs:
    image: chrislusf/seaweedfs@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
    restart: unless-stopped
    mem_limit: 1g
    environment:
      - S3_ACCESS_KEY=${NUXT_S3_ACCESS_KEY:?NUXT_S3_ACCESS_KEY required}
      - S3_SECRET_KEY=${NUXT_S3_SECRET_KEY:?NUXT_S3_SECRET_KEY required}
    entrypoint: ["/bin/sh", "-c"]
    # `-master.volumeSizeLimitMB=256`: see docker-compose.dev.yml — keeps
    # enough volume slots on small disks. The image's own entrypoint drops
    # to the `seaweed` user, hence the chown.
    #
    # Only the S3 API (SigV4-authenticated) listens on the network
    # (`-s3.ip.bind=0.0.0.0`). Master, volume and filer — which have no
    # authentication — bind and advertise 127.0.0.1, so they are reachable
    # from inside this container only; the Iceberg and Lance side ports are
    # off.
    command:
      - |
        printf '{"identities":[{"name":"markoto","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging","Lock"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        chown seaweed:seaweed /tmp/s3.json
        chmod 600 /tmp/s3.json
        exec /entrypoint.sh server -s3 -ip=127.0.0.1 -ip.bind=127.0.0.1 -s3.ip.bind=0.0.0.0 -s3.port.iceberg=0 -s3.port.lance=0 -dir=/data -s3.config=/tmp/s3.json -s3.port=8333 -master.volumeSizeLimitMB=256
    volumes:
      - seaweed_data:/data
    # The entrypoint starts as root to chown /data and the identity file,
    # then drops to `seaweed`: those are the only capabilities kept.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    expose:
      - "8333"
    labels:
      - "markoto.instance=${MARKOTO_INSTANCE:-markoto}"
      - "traefik.enable=true"
      # Traefik reaches SeaweedFS over the storage network (it isn't on edge).
      - "traefik.docker.network=${MARKOTO_INSTANCE:-markoto}-storage"
      # Browsers PUT/GET objects with presigned URLs signed for the public
      # origin (NUXT_S3_PUBLIC_ENDPOINT). Path-style URLs start with the
      # bucket name, so the bucket prefix is the route. Traefik keeps the
      # Host header, which the SigV4 signature covers.
      - "traefik.http.routers.markoto-s3.rule=PathPrefix(`/${NUXT_S3_BUCKET:-markoto-files}/`)"
      - "traefik.http.routers.markoto-s3.entrypoints=web"
      - "traefik.http.services.markoto-s3.loadbalancer.server.port=8333"
      # The bucket is served from the app's own origin, so its responses
      # must never be rendered as active content: no MIME sniffing, and a
      # sandbox CSP in case an object's type is wrong (uploads are typed
      # at upload and `/api/files` forces the image type on the way out).
      - "traefik.http.routers.markoto-s3.middlewares=markoto-s3-headers"
      - "traefik.http.middlewares.markoto-s3-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.markoto-s3-headers.headers.contentSecurityPolicy=sandbox; default-src 'none'; img-src 'self' data:"
    networks:
      - storage

  # One-shot: create the bucket (idempotent). Reuses the backup image,
  # which already ships the aws CLI.
  s3-init:
    image: ${REGISTRY:-ghcr.io/joelbarmettleruzh}/markoto-backup:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      - AWS_ACCESS_KEY_ID=${NUXT_S3_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${NUXT_S3_SECRET_KEY}
      - AWS_DEFAULT_REGION=us-east-1
      - S3_BUCKET=${NUXT_S3_BUCKET:-markoto-files}
      # A separate backup bucket on this SeaweedFS (BACKUP_S3_BUCKET set,
      # BACKUP_S3_ENDPOINT unset) is created too. With an external backup
      # endpoint the bucket is the operator's to create.
      - BACKUP_S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ensure_bucket() {
          i=0
          while [ "$$i" -lt 90 ]; do
            if aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket "$$1" >/dev/null 2>&1; then
              echo "[s3-init] bucket $$1 exists"; return 0
            fi
            if aws --endpoint-url http://seaweedfs:8333 s3api create-bucket --bucket "$$1" >/dev/null 2>&1; then
              echo "[s3-init] bucket $$1 created"; return 0
            fi
            i=$$((i + 1)); sleep 2
          done
          echo "[s3-init] SeaweedFS did not become ready" >&2; return 1
        }
        ensure_bucket "$$S3_BUCKET" || exit 1
        if [ -z "$$BACKUP_S3_ENDPOINT" ] && [ -n "$$BACKUP_S3_BUCKET" ] && [ "$$BACKUP_S3_BUCKET" != "$$S3_BUCKET" ]; then
          ensure_bucket "$$BACKUP_S3_BUCKET" || exit 1
        fi
    depends_on:
      seaweedfs:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - storage

  app:
    # Same as the image's HEALTHCHECK, declared here because Podman builds
    # OCI images, which drop HEALTHCHECK (docs/CONTAINER-ENGINES.md).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --tries=1 --timeout=5 http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    image: ${REGISTRY:-ghcr.io/joelbarmettleruzh}/markoto-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 2g
    environment:
      - NODE_ENV=production
      # ─── Public origin ───
      # MARKOTO_PUBLIC_URL: what users type (https://docs.example.com or
      # http://192.168.1.10:8080). Absolute links in emails, the OAuth
      # callback URLs and the browser-facing S3 endpoint all derive from it.
      - NUXT_SITE_URL=${MARKOTO_PUBLIC_URL:?MARKOTO_PUBLIC_URL required}
      - NUXT_PUBLIC_SYNC_URL=${MARKOTO_SYNC_URL:?MARKOTO_SYNC_URL required}
      # ─── Secrets (install.sh generates them) ───
      - NUXT_SESSION_PASSWORD=${NUXT_SESSION_PASSWORD:?NUXT_SESSION_PASSWORD required}
      - NUXT_JWT_SECRET=${NUXT_JWT_SECRET:?NUXT_JWT_SECRET required}
      - NUXT_JWT_SECRET_PREVIOUS=${NUXT_JWT_SECRET_PREVIOUS:-}
      - NUXT_INTERNAL_API_SECRET=${NUXT_INTERNAL_API_SECRET:?NUXT_INTERNAL_API_SECRET required}
      - NUXT_INTERNAL_API_SECRET_PREVIOUS=${NUXT_INTERNAL_API_SECRET_PREVIOUS:-}
      - NUXT_AI_DICTATE_JWT_SECRET=${NUXT_AI_DICTATE_JWT_SECRET:-}
      # Key of the self-hosted ALTCHA bot check (anonymous gate, below).
      # install.sh generates it; required only while the gate is on.
      - NUXT_ALTCHA_HMAC_KEY=${NUXT_ALTCHA_HMAC_KEY:-}
      # ─── Login (optional; without a pair the instance is anonymous-only) ───
      # Callback URLs to register with the provider: <public URL>/auth/github
      # and <public URL>/auth/google. Pinned here so they stay right behind
      # an extra proxy that rewrites X-Forwarded-Proto.
      - NUXT_OAUTH_GITHUB_CLIENT_ID=${NUXT_OAUTH_GITHUB_CLIENT_ID:-}
      - NUXT_OAUTH_GITHUB_CLIENT_SECRET=${NUXT_OAUTH_GITHUB_CLIENT_SECRET:-}
      - NUXT_OAUTH_GITHUB_REDIRECT_URL=${MARKOTO_PUBLIC_URL}/auth/github
      - NUXT_OAUTH_GOOGLE_CLIENT_ID=${NUXT_OAUTH_GOOGLE_CLIENT_ID:-}
      - NUXT_OAUTH_GOOGLE_CLIENT_SECRET=${NUXT_OAUTH_GOOGLE_CLIENT_SECRET:-}
      - NUXT_OAUTH_GOOGLE_REDIRECT_URL=${MARKOTO_PUBLIC_URL}/auth/google
      # Your own OpenID Connect provider (Authentik, Keycloak, Authelia,
      # Pocket ID, Zitadel, Dex, ...). Issuer + id + secret, all or none.
      # Redirect URI to register at the IdP: <public URL>/auth/oidc.
      - NUXT_OAUTH_OIDC_ISSUER=${NUXT_OAUTH_OIDC_ISSUER:-}
      - NUXT_OAUTH_OIDC_CLIENT_ID=${NUXT_OAUTH_OIDC_CLIENT_ID:-}
      - NUXT_OAUTH_OIDC_CLIENT_SECRET=${NUXT_OAUTH_OIDC_CLIENT_SECRET:-}
      - NUXT_OAUTH_OIDC_NAME=${NUXT_OAUTH_OIDC_NAME:-}
      - NUXT_OAUTH_OIDC_SCOPES=${NUXT_OAUTH_OIDC_SCOPES:-}
      - NUXT_OAUTH_OIDC_REDIRECT_URL=${MARKOTO_PUBLIC_URL}/auth/oidc
      # Emails promoted to instance admin on their first login (/admin/*).
      - NUXT_ADMIN_USER_EMAILS=${NUXT_ADMIN_USER_EMAILS:-}
      # ─── Storage (bundled SeaweedFS) ───
      - NUXT_S3_ENDPOINT=http://seaweedfs:8333
      - NUXT_S3_PUBLIC_ENDPOINT=${MARKOTO_PUBLIC_URL}
      - NUXT_S3_ACCESS_KEY=${NUXT_S3_ACCESS_KEY}
      - NUXT_S3_SECRET_KEY=${NUXT_S3_SECRET_KEY}
      - NUXT_S3_BUCKET=${NUXT_S3_BUCKET:-markoto-files}
      # ─── Internal services ───
      - NUXT_SYNC_INTERNAL_URL=http://sync:4001
      - NUXT_MARKITDOWN_URL=http://markitdown:8080
      - NUXT_RENDERER_INTERNAL_URL=http://renderer:9000
      # Mirrored into the print-page CSP (server/utils/csp.ts); the renderer reads the same variable.
      - RENDERER_ALLOWED_ORIGINS=${RENDERER_ALLOWED_ORIGINS:-}
      - NUXT_LITELLM_URL=http://litellm:4000
      - NUXT_LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY required}
      # The app encrypts each user's LiteLLM virtual-key token at rest with
      # this key (server/utils/litellm/userKeys.ts). Without it, creating
      # the key (first AI use, BYOK save, AI Points) fails with a 500.
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY:?LITELLM_SALT_KEY required}
      # LiteLLM's own role, for the spend-log sweep + admin spend query
      # (server/utils/litellm/litellmDb.ts); empty = the app role.
      - NUXT_LITELLM_DB_USER=${POSTGRES_LITELLM_USER:-}
      - NUXT_LITELLM_DB_PASSWORD=${POSTGRES_LITELLM_PASSWORD:-}
      # The app's own role (owner of the app database only) — db-init.
      - POSTGRES_USER=${POSTGRES_APP_USER:-${POSTGRES_USER}}
      - POSTGRES_PASSWORD=${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      # In-stack Postgres on the private docker network: no TLS.
      - PGSSL=disable
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - VALKEY_PASSWORD=${VALKEY_PASSWORD}
      - VALKEY_DB=${VALKEY_DB:-0}
      # Reverse proxies in front of the app: 1 = this Traefik. Behind your own
      # TLS proxy set 2 (and TRAEFIK_TRUSTED_IPS). shared/utils/clientIp.ts.
      - NUXT_TRUSTED_PROXY_HOPS=${NUXT_TRUSTED_PROXY_HOPS:-1}
      # ─── AI (all optional; docs/SELF-HOSTING.md#ai) ───
      # Instance defaults per capability; empty = users bring their own key.
      - NUXT_AI_DEFAULT_CHAT_MODEL=${NUXT_AI_DEFAULT_CHAT_MODEL:-}
      - NUXT_AI_DEFAULT_CHAT_BASE_URL=${NUXT_AI_DEFAULT_CHAT_BASE_URL:-}
      - NUXT_AI_DEFAULT_CHAT_API_KEY=${NUXT_AI_DEFAULT_CHAT_API_KEY:-}
      - NUXT_AI_DEFAULT_CHAT_VISION=${NUXT_AI_DEFAULT_CHAT_VISION:-}
      - NUXT_AI_DEFAULT_CHAT_STRONG_MODEL=${NUXT_AI_DEFAULT_CHAT_STRONG_MODEL:-}
      # Global monthly ceiling (USD) on platform-paid AI for all free-tier
      # users together (LiteLLM team budget); empty / 0 = none.
      - NUXT_FREE_TIER_TOTAL_BUDGET_USD=${NUXT_FREE_TIER_TOTAL_BUDGET_USD:-}
      - NUXT_AI_DEFAULT_IMAGE_MODEL=${NUXT_AI_DEFAULT_IMAGE_MODEL:-}
      - NUXT_AI_DEFAULT_IMAGE_BASE_URL=${NUXT_AI_DEFAULT_IMAGE_BASE_URL:-}
      - NUXT_AI_DEFAULT_IMAGE_API_KEY=${NUXT_AI_DEFAULT_IMAGE_API_KEY:-}
      - NUXT_AI_DEFAULT_TRANSCRIBE_MODEL=${NUXT_AI_DEFAULT_TRANSCRIBE_MODEL:-}
      - NUXT_AI_DEFAULT_TRANSCRIBE_BASE_URL=${NUXT_AI_DEFAULT_TRANSCRIBE_BASE_URL:-}
      - NUXT_AI_DEFAULT_TRANSCRIBE_API_KEY=${NUXT_AI_DEFAULT_TRANSCRIBE_API_KEY:-}
      - NUXT_AI_REALTIME_MODEL=${NUXT_AI_REALTIME_MODEL:-}
      - NUXT_AI_BYOK_ALLOWED_BASE_URLS=${NUXT_AI_BYOK_ALLOWED_BASE_URLS:-}
      - NUXT_AI_BYOK_ALLOW_PRIVATE_URLS=${NUXT_AI_BYOK_ALLOW_PRIVATE_URLS:-false}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      # Web tools for the AI: web_search (Staan) / fetch_url (Jina Reader).
      # Hidden from the AI without a key.
      - STAAN_API_KEY=${STAAN_API_KEY:-}
      - JINA_AI_API_KEY=${JINA_AI_API_KEY:-}
      - NUXT_WEB_TOOLS_HOURLY_LIMIT=${NUXT_WEB_TOOLS_HOURLY_LIMIT:-}
      - NUXT_WEB_TOOLS_DAILY_LIMIT=${NUXT_WEB_TOOLS_DAILY_LIMIT:-}
      # Knowledge-base embeddings (docs/AI-MODELS.md#embeddings). The Jina
      # default needs JINA_AI_API_KEY; otherwise point custom-embeddings at
      # any provider (EMBEDDINGS_UPSTREAM_* are read by the litellm service).
      - NUXT_LITELLM_EMBEDDINGS_MODEL=${NUXT_LITELLM_EMBEDDINGS_MODEL:-jina-embeddings-v5-text-nano}
      - NUXT_LITELLM_EMBEDDINGS_DIMS=${NUXT_LITELLM_EMBEDDINGS_DIMS:-768}
      - NUXT_LITELLM_EMBEDDINGS_SEND_DIMENSIONS=${NUXT_LITELLM_EMBEDDINGS_SEND_DIMENSIONS:-auto}
      - NUXT_LITELLM_EMBEDDINGS_TASK_HINTS=${NUXT_LITELLM_EMBEDDINGS_TASK_HINTS:-auto}
      - NUXT_LITELLM_EMBEDDINGS_UPSTREAM_MODEL=${EMBEDDINGS_UPSTREAM_MODEL:-}
      # ─── Limits ───
      # Billing is off, so everyone is on the free tier and TIER_FREE_* ARE
      # the limits. The hosted free tier is tight (1 workspace, 5 knowledge
      # files); a self-hosted instance defaults to roomier values.
      - NUXT_BILLING_ENABLED=false
      - NUXT_PLANS_COMING_SOON=false
      - TIER_FREE_LITELLM_BUDGET_USD=${TIER_FREE_LITELLM_BUDGET_USD:-}
      - TIER_FREE_WORKSPACES_OWNED=${TIER_FREE_WORKSPACES_OWNED:-50}
      - TIER_FREE_KNOWLEDGE_FILES=${TIER_FREE_KNOWLEDGE_FILES:-500}
      - TIER_FREE_KNOWLEDGE_BYTES_PER_WORKSPACE=${TIER_FREE_KNOWLEDGE_BYTES_PER_WORKSPACE:-1073741824}
      - TIER_FREE_KNOWLEDGE_BYTES_PER_USER=${TIER_FREE_KNOWLEDGE_BYTES_PER_USER:-10737418240}
      - TIER_FREE_IMAGE_BYTES_PER_USER=${TIER_FREE_IMAGE_BYTES_PER_USER:-10737418240}
      - TIER_FREE_MEMBERS_PER_WORKSPACE=${TIER_FREE_MEMBERS_PER_WORKSPACE:-}
      - TIER_FREE_HISTORY_DAYS=${TIER_FREE_HISTORY_DAYS:-}
      - TIER_FREE_SAVED_THEMES=${TIER_FREE_SAVED_THEMES:-}
      - TIER_FREE_IMPORT_MAX_BYTES=${TIER_FREE_IMPORT_MAX_BYTES:-}
      - TIER_FREE_WEB_TOOLS_PER_DAY=${TIER_FREE_WEB_TOOLS_PER_DAY:-}
      - TIER_FREE_MCP_TOOL_CALLS_PER_DAY=${TIER_FREE_MCP_TOOL_CALLS_PER_DAY:-}
      - TIER_FREE_FEATURE_CUSTOM_CSS=${TIER_FREE_FEATURE_CUSTOM_CSS:-}
      - TIER_FREE_FEATURE_MCP_WRITE=${TIER_FREE_FEATURE_MCP_WRITE:-}
      - TIER_FREE_FEATURE_AI_IMAGE=${TIER_FREE_FEATURE_AI_IMAGE:-}
      - TIER_FREE_FEATURE_AI_VOICE=${TIER_FREE_FEATURE_AI_VOICE:-}
      - TIER_FREE_FEATURE_AI_STRONG_MODEL=${TIER_FREE_FEATURE_AI_STRONG_MODEL:-}
      - TIER_FREE_FEATURE_SSO=${TIER_FREE_FEATURE_SSO:-}
      - TIER_FREE_FEATURE_AUDIT_LOG=${TIER_FREE_FEATURE_AUDIT_LOG:-}
      - TIER_FREE_FEATURE_GUESTS=${TIER_FREE_FEATURE_GUESTS:-}
      - TIER_FREE_FEATURE_BRAND_KIT=${TIER_FREE_FEATURE_BRAND_KIT:-}
      - TIER_FREE_FEATURE_SHARE_CONTROLS=${TIER_FREE_FEATURE_SHARE_CONTROLS:-}
      # Days an unreferenced doc image is kept before the image GC deletes
      # it. Empty = 30, 0 = GC off.
      - NUXT_IMAGE_GC_RETENTION_DAYS=${NUXT_IMAGE_GC_RETENTION_DAYS:-}
      - NUXT_AUDIT_LOG_RETENTION_DAYS=${NUXT_AUDIT_LOG_RETENTION_DAYS:-}
      - NUXT_ABUSE_REPORT_RETENTION_DAYS=${NUXT_ABUSE_REPORT_RETENTION_DAYS:-}
      - NUXT_INACTIVE_DOC_TTL_DAYS=${NUXT_INACTIVE_DOC_TTL_DAYS:-30}
      # ─── Operator surfaces (shared/config/instance.ts) ───
      # The bundled privacy policy / terms / DPA / imprint describe the
      # hosted markoto.app service. Off by default: no onboarding gate, no
      # cookie banner, no DPA step, no /legal/* pages. Turn on only with your
      # own NUXT_LEGAL_* identity and adapted content/legal/ texts.
      - NUXT_LEGAL_SURFACES_ENABLED=${NUXT_LEGAL_SURFACES_ENABLED:-false}
      # Anonymous gate: terms checkbox + invisible ALTCHA bot check before an
      # anonymous visitor creates a document; anonymous abuse reports.
      # Empty = follows NUXT_LEGAL_SURFACES_ENABLED. Set true to gate
      # anonymous use without the legal pages (needs NUXT_ALTCHA_HMAC_KEY).
      - NUXT_ANON_GATE_ENABLED=${NUXT_ANON_GATE_ENABLED:-}
      # ─── Search engines (shared/config/instance.ts) ───
      # The bundled /docs pages point their canonical link at markoto.app,
      # the original, so search engines don't rank copies against each
      # other. Set NUXT_DOCS_CANONICAL_BASE= (empty) to make your copy
      # self-canonical, or another https origin. Unset = markoto.app.
      - NUXT_DOCS_CANONICAL_BASE=${NUXT_DOCS_CANONICAL_BASE-https://markoto.app}
      # false = keep the whole instance out of search engines (robots.txt
      # Disallow: / + X-Robots-Tag: noindex). Empty = indexable.
      - NUXT_SITE_INDEXABLE=${NUXT_SITE_INDEXABLE:-}
      - NUXT_LEGAL_CONTROLLER_NAME=${NUXT_LEGAL_CONTROLLER_NAME:-}
      - NUXT_LEGAL_CONTROLLER_ADDRESS=${NUXT_LEGAL_CONTROLLER_ADDRESS:-}
      - NUXT_LEGAL_PRIVACY_CONTACT_EMAIL=${NUXT_LEGAL_PRIVACY_CONTACT_EMAIL:-}
      - NUXT_LEGAL_ABUSE_CONTACT_EMAIL=${NUXT_LEGAL_ABUSE_CONTACT_EMAIL:-}
      - NUXT_LEGAL_GOVERNING_LAW=${NUXT_LEGAL_GOVERNING_LAW:-}
      - NUXT_LEGAL_LEGAL_FORM=${NUXT_LEGAL_LEGAL_FORM:-}
      - NUXT_LEGAL_REGISTERED_OFFICE=${NUXT_LEGAL_REGISTERED_OFFICE:-}
      - NUXT_LEGAL_REPRESENTED_BY=${NUXT_LEGAL_REPRESENTED_BY:-}
      - NUXT_LEGAL_UID=${NUXT_LEGAL_UID:-}
      - NUXT_LEGAL_CH_ID=${NUXT_LEGAL_CH_ID:-}
      - NUXT_LEGAL_EHRA_ID=${NUXT_LEGAL_EHRA_ID:-}
      # ─── Email (optional) ───
      # Without RESEND_API_KEY emails are logged, not sent ([email-stub]);
      # every flow still completes.
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - NUXT_EMAIL_FROM=${NUXT_EMAIL_FROM:-}
      - NUXT_EMAIL_PROVIDER=${NUXT_EMAIL_PROVIDER:-}
      # ─── Telemetry (optional; nothing is sent without a DSN) ───
      - NUXT_PUBLIC_SENTRY_DSN=${NUXT_PUBLIC_SENTRY_DSN:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
    # The BYOK URL policy resolves provider hostnames in the app before
    # LiteLLM connects, so the app must resolve host.docker.internal too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Image user `bun`; nothing in /app is writable. Bun only needs /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "3000"
    labels:
      - "markoto.instance=${MARKOTO_INSTANCE:-markoto}"
      - "traefik.enable=true"
      - "traefik.http.routers.markoto-app.rule=PathPrefix(`/`)"
      - "traefik.http.routers.markoto-app.entrypoints=web"
      - "traefik.http.routers.markoto-app.middlewares=markoto-headers,markoto-compress"
      # Compress dynamic responses; precompressed static assets keep their
      # encoding, media/archives and text/event-stream (AI session stream)
      # are excluded. See docker-compose.prod.yml.
      - "traefik.http.middlewares.markoto-compress.compress=true"
      - "traefik.http.middlewares.markoto-compress.compress.excludedcontenttypes=text/event-stream,image/png,image/jpeg,image/webp,image/avif,image/gif,video/mp4,video/webm,font/woff2,application/zip,application/pdf,application/octet-stream"
      # /api/import (anonymous document import, 50 MB file cap) gets its own
      # router with a request-body limit (51 MiB = the app's MAX_BODY), so
      # an oversized or endless upload is cut off at the edge. Longer rule =
      # higher priority than the catch-all router above.
      - "traefik.http.routers.markoto-import.rule=Path(`/api/import`)"
      - "traefik.http.routers.markoto-import.entrypoints=web"
      - "traefik.http.routers.markoto-import.service=markoto-app"
      - "traefik.http.routers.markoto-import.middlewares=markoto-import-limit,markoto-headers"
      - "traefik.http.middlewares.markoto-import-limit.buffering.maxRequestBodyBytes=53477376"
      - "traefik.http.services.markoto-app.loadbalancer.server.port=3000"
      - "traefik.http.services.markoto-app.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.markoto-app.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.markoto-app.loadbalancer.healthcheck.timeout=10s"
      # Security headers (see docs/SECURITY-HARDENING.md for the rationale of
      # each directive). HSTS is ignored by browsers on plain http. The
      # Content-Security-Policy (per-response nonce) and
      # Cross-Origin-Resource-Policy come from the app itself
      # (server/plugins/csp.ts) — same policy as the hosted deployment.
      - "traefik.http.middlewares.markoto-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.markoto-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.markoto-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.markoto-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.markoto-headers.headers.customResponseHeaders.Cross-Origin-Opener-Policy=same-origin"
      - "traefik.http.middlewares.markoto-headers.headers.customResponseHeaders.Permissions-Policy=camera=(), microphone=(self), geolocation=(), payment=()"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      litellm:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully
    networks:
      edge: {}
      data: {}
      import: {}
      storage: {}
      render:
        # The renderer's Chromium can't use the service name: `app` is an
        # HSTS-preloaded TLD, so Chromium upgrades http://app:3000 to https
        # and fails with ERR_SSL_PROTOCOL_ERROR.
        aliases:
          - markoto-app

  sync:
    image: ${REGISTRY:-ghcr.io/joelbarmettleruzh}/markoto-sync:${IMAGE_TAG:-latest}
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${NUXT_JWT_SECRET}
      - JWT_SECRET_PREVIOUS=${NUXT_JWT_SECRET_PREVIOUS:-}
      - INTERNAL_API_SECRET=${NUXT_INTERNAL_API_SECRET}
      - INTERNAL_API_SECRET_PREVIOUS=${NUXT_INTERNAL_API_SECRET_PREVIOUS:-}
      - APP_URL=http://app:3000
      - PGSSL=disable
      - TRUSTED_PROXY_HOPS=${NUXT_TRUSTED_PROXY_HOPS:-1}
      - SENTRY_DSN=${SENTRY_DSN:-}
    expose:
      - "4001"
    labels:
      - "markoto.instance=${MARKOTO_INSTANCE:-markoto}"
      - "traefik.enable=true"
      # Hocuspocus accepts the WebSocket upgrade on any path; the browser
      # connects to ${MARKOTO_SYNC_URL} (= <public origin>/sync).
      - "traefik.http.routers.markoto-sync.rule=PathPrefix(`/sync`)"
      - "traefik.http.routers.markoto-sync.entrypoints=web"
      - "traefik.http.services.markoto-sync.loadbalancer.server.port=4001"
    networks:
      - edge
      - data

  markitdown:
    image: ${REGISTRY:-ghcr.io/joelbarmettleruzh}/markoto-markitdown:${IMAGE_TAG:-latest}
    expose:
      - "8080"
    networks:
      - import

  renderer:
    image: ${REGISTRY:-ghcr.io/joelbarmettleruzh}/markoto-renderer:${IMAGE_TAG:-latest}
    environment:
      # Not http://app:3000 — see the `markoto-app` alias on the app service.
      - APP_URL=http://markoto-app:3000
      - S3_ENDPOINT=http://seaweedfs:8333
      # The origin presigned document-image URLs point at (the app's
      # NUXT_S3_PUBLIC_ENDPOINT). The renderer's network allowlist admits
      # this origin, not the internal seaweedfs one. Extra origins:
      # RENDERER_ALLOWED_ORIGINS (comma-separated).
      - S3_PUBLIC_ENDPOINT=${MARKOTO_PUBLIC_URL}
      - RENDERER_ALLOWED_ORIGINS=${RENDERER_ALLOWED_ORIGINS:-}
      # SeaweedFS doesn't support SSE-S3 headers on these PUTs.
      - S3_SSE=none
    # The renderer's Chromium maps `localhost` to host.docker.internal
    # (renderer/src/render.ts), so a http://localhost:<port> public URL
    # still reaches Traefik's published port for document images.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "9000"
    networks:
      - render
      - storage
      - renderer-egress

  # Optional: COMPOSE_PROFILES=backup. Encrypted (gpg AES-256) pg_dump into
  # the bucket under backups/postgres/. It lands on the SAME disk as the
  # data — copy it off the machine (docs/SELF-HOSTING.md#backups).
  backup:
    image: ${REGISTRY:-ghcr.io/joelbarmettleruzh}/markoto-backup:${IMAGE_TAG:-latest}
    profiles: ["backup"]
    environment:
      # Same bucket and keys as the app unless BACKUP_S3_* point elsewhere
      # (a second bucket, or an external S3 provider — docs/SELF-HOSTING.md#backups).
      - S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-http://seaweedfs:8333}
      - S3_BUCKET=${BACKUP_S3_BUCKET:-${NUXT_S3_BUCKET:-markoto-files}}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      # SeaweedFS rejects the SSE-S3 header (InternalError) — see backup.sh.
      - S3_SSE=none
      - BACKUP_RETENTION_COUNT=${BACKUP_RETENTION_COUNT:-14}
      - BACKUP_GPG_PASSPHRASE=${BACKUP_GPG_PASSPHRASE:?BACKUP_GPG_PASSPHRASE required}
    # After the app is healthy: the first dump runs at start-up, and before
    # the app's migrations a fresh database is too small to be accepted.
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      app:
        condition: service_healthy
    networks:
      - data
      - storage
      # An external BACKUP_S3_ENDPOINT.
      - egress
