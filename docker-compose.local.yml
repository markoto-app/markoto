# Full-stack local run — Traefik with mkcert TLS, all images built from source.
# Domain: ypad.127.0.0.1.nip.io (nip.io wildcards resolve *.127.0.0.1.nip.io → 127.0.0.1).
# Run: docker compose -f docker-compose.local.yml up -d --build
#
# First-time setup: see docs/LOCAL.md.
#
# Access:
#   App:           https://ypad.127.0.0.1.nip.io
#   Sync:          wss://sync.ypad.127.0.0.1.nip.io
#   Traefik UI:    `docker compose -f docker-compose.local.yml exec traefik wget -qO- localhost:8080/api/rawdata`
#                  (dashboard isn't bound to host to avoid port clashes with
#                  other dev tools; run via exec when you need it)

x-glitchtip-env: &glitchtip-env
  DATABASE_URL: postgres://ypad:devpassword@postgres:5432/glitchtip
  VALKEY_URL: redis://valkey:6379/1
  SECRET_KEY: local-glitchtip-secret-not-for-prod-at-least-50-chars-xxxxx
  GLITCHTIP_DOMAIN: https://telemetry.ypad.127.0.0.1.nip.io
  CSRF_TRUSTED_ORIGINS: https://telemetry.ypad.127.0.0.1.nip.io
  DEFAULT_FROM_EMAIL: errors@localhost
  EMAIL_URL: consolemail://
  # Registration off — we seed the initial admin via the glitchtip-init
  # one-shot (DJANGO_SUPERUSER_* env). Keeps local ≈ prod.
  ENABLE_USER_REGISTRATION: "False"
  ENABLE_ORGANIZATION_CREATION: "False"

networks:
  web:
    name: web-local
  internal:
    name: internal-local

services:
  traefik:
    image: traefik:v3@sha256:5ae9c349154d5298a5d61a7b25e5f3a9f53314f1515e87632120b95051c7917c
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=web-local"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/local:/etc/traefik/dynamic:ro
    networks:
      - web

  postgres:
    # pgvector/pgvector is Postgres 16 with the `vector` extension
    # pre-built — see docker-compose.dev.yml for the swap rationale.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=ypad
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=ypad
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ypad -d ypad"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    expose:
      - "5432"
    networks:
      - internal

  valkey:
    image: valkey/valkey:8-alpine@sha256:1cb6b20b70d927560cc4cc5397b5f045e74aa603ff7696274778880bb6fadc75
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    expose:
      - "6379"
    volumes:
      - valkey_data:/data
    networks:
      - internal

  # Local GlitchTip for Sentry-SDK smoke testing. No oauth2-proxy here
  # (nothing is publicly exposed). Access directly at
  # https://telemetry.ypad.127.0.0.1.nip.io/ — covered by the mkcert
  # wildcard cert. Web + worker share config via the x-glitchtip-env
  # anchor at the bottom of this file.
  # One-shot: apply GlitchTip migrations, then seed the admin user from
  # DJANGO_SUPERUSER_* env vars. Idempotent — `createsuperuser --no-input`
  # errors on second run, we swallow that. To change the password later,
  # use the web UI or `./manage.py changepassword` inside the glitchtip
  # container; the env var is a bootstrap, not a source of truth.
  glitchtip-init:
    image: glitchtip/glitchtip:v6
    restart: "no"
    environment:
      <<: *glitchtip-env
      DJANGO_SUPERUSER_EMAIL: ${GLITCHTIP_ADMIN_EMAIL:-admin@localhost}
      DJANGO_SUPERUSER_PASSWORD: ${GLITCHTIP_ADMIN_PASSWORD:-local-admin-password-change-me}
    command: >
      sh -c "
        ./manage.py migrate --no-input &&
        ./manage.py createsuperuser --no-input 2>/dev/null || true
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  glitchtip:
    image: glitchtip/glitchtip:v6
    restart: unless-stopped
    environment:
      <<: *glitchtip-env
      SERVER_ROLE: web
    volumes:
      - glitchtip_uploads:/code/uploads
    depends_on:
      glitchtip-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.glitchtip.rule=Host(`telemetry.ypad.127.0.0.1.nip.io`)"
      - "traefik.http.routers.glitchtip.entrypoints=websecure"
      - "traefik.http.routers.glitchtip.tls=true"
      - "traefik.http.services.glitchtip.loadbalancer.server.port=8000"
    networks:
      - web
      - internal

  glitchtip-worker:
    image: glitchtip/glitchtip:v6
    restart: unless-stopped
    environment:
      <<: *glitchtip-env
      SERVER_ROLE: worker
    volumes:
      - glitchtip_uploads:/code/uploads
    depends_on:
      glitchtip-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    networks:
      - internal

  seaweedfs:
    image: chrislusf/seaweedfs@sha256:854479eebcbc0060d803edb27b3bd88a0552e23fde08a26a6482e59aff887a77
    restart: unless-stopped
    command: >
      server -s3
      -ip=seaweedfs -ip.bind=0.0.0.0
      -dir=/data -s3.config=/etc/seaweedfs/s3.json -s3.port=8333
    ports:
      - "8333:8333"
    volumes:
      - seaweed_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - internal

  app:
    build: .
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - NUXT_SESSION_PASSWORD=local-session-password-at-least-32-characters-long
      - NUXT_OAUTH_GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - NUXT_OAUTH_GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - NUXT_OAUTH_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - NUXT_OAUTH_GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - NUXT_S3_ENDPOINT=http://seaweedfs:8333
      - NUXT_S3_ACCESS_KEY=ypad-access-key
      - NUXT_S3_SECRET_KEY=ypad-secret-key
      - NUXT_S3_BUCKET=ypad
      - NUXT_JWT_SECRET=local-jwt-secret-change-me-64chars-for-real-deployments-only-xx
      - NUXT_INTERNAL_API_SECRET=local-internal-api-secret-change-me
      - NUXT_GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - NUXT_GOOGLE_MODEL=${GOOGLE_MODEL:-gemini-3.1-flash-lite-preview}
      - NUXT_GOOGLE_REWRITE_MODEL=${GOOGLE_REWRITE_MODEL:-gemini-2.5-flash-lite}
      - NUXT_PUBLIC_SYNC_URL=wss://sync.ypad.127.0.0.1.nip.io
      - NUXT_SYNC_INTERNAL_URL=http://sync:4001
      - NUXT_MARKITDOWN_URL=http://markitdown:8080
      - DATABASE_URL=postgres://ypad:devpassword@postgres:5432/ypad
      - VALKEY_URL=redis://valkey:6379/0
      # Sentry / GlitchTip. Browser → public HTTPS host. Server →
      # Docker internal DNS (skip Traefik + public round-trip). Same
      # pattern as prod.
      - NUXT_PUBLIC_SENTRY_DSN=${NUXT_PUBLIC_SENTRY_DSN:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`ypad.127.0.0.1.nip.io`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.services.app.loadbalancer.server.port=3000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - web
      - internal

  sync:
    build:
      context: .
      dockerfile: sync-server/Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - PORT=4001
      - DATABASE_URL=postgres://ypad:devpassword@postgres:5432/ypad
      - JWT_SECRET=local-jwt-secret-change-me-64chars-for-real-deployments-only-xx
      - INTERNAL_API_SECRET=local-internal-api-secret-change-me
      - SENTRY_DSN=${SENTRY_DSN:-}
      - APP_URL=http://app:3000
    expose:
      - "4001"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sync.rule=Host(`sync.ypad.127.0.0.1.nip.io`)"
      - "traefik.http.routers.sync.entrypoints=websecure"
      - "traefik.http.routers.sync.tls=true"
      - "traefik.http.services.sync.loadbalancer.server.port=4001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - web
      - internal

  markitdown:
    build: ./markitdown-server
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - internal

  backup:
    build: ./backup-server
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=ypad
      - POSTGRES_DB=ypad
      - PGPASSWORD=devpassword
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_ACCESS_KEY=ypad-access-key
      - S3_SECRET_KEY=ypad-secret-key
      - S3_BUCKET=ypad
      - BACKUP_INTERVAL_SECONDS=3600
      - BACKUP_RETENTION_COUNT=5
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    networks:
      - internal

volumes:
  pg_data:
  seaweed_data:
  valkey_data:
  glitchtip_uploads:
