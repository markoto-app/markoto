# Full-stack local run — Traefik with mkcert TLS, all images built from source.
# Domain: ypad.127.0.0.1.nip.io (nip.io wildcards resolve *.127.0.0.1.nip.io → 127.0.0.1).
# (The `ypad.` prefix is a leftover from the old project codename — purely a
#  local-dev hostname, not the brand. Renaming would force every dev to
#  regenerate certs, so we keep it.)
# Run: docker compose -f docker-compose.local.yml up -d --build
#
# First-time setup: see docs/LOCAL.md.
#
# Access:
#   App:           https://ypad.127.0.0.1.nip.io
#   Sync:          wss://sync.ypad.127.0.0.1.nip.io
#   Traefik UI:    `docker compose -f docker-compose.local.yml exec traefik wget -qO- localhost:8080/api/rawdata`
#                  (dashboard isn't bound to host to avoid port clashes with
#                  other dev tools; run via exec when you need it)
#
# Policy: secrets that are local-only (postgres pw, jwt, etc.) are
# inlined here so this file boots without a .env. Anything that varies
# per developer (Google API keys, OAuth client ids, Sentry DSN) reads
# from .env via `${VAR:?required}` so a missing entry crashes
# `docker compose up` instead of silently booting empty.
#
# Common service shape lives in docker-compose.base.yml (see header).
# This file adds Traefik (mkcert TLS), the Nuxt `app` service, and
# wires every backend service onto the `internal` docker network.

include:
  - docker-compose.base.yml

networks:
  web:
    name: web-local
  internal:
    name: internal-local

services:
  traefik:
    image: traefik:v3@sha256:5ae9c349154d5298a5d61a7b25e5f3a9f53314f1515e87632120b95051c7917c
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=web-local"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/local:/etc/traefik/dynamic:ro
    networks:
      - web

  postgres:
    expose:
      - "5432"
    networks:
      - internal

  valkey:
    # `expose:` only — Valkey stays on the docker `internal` network.
    # In local mode the app runs IN the `app` container and reaches
    # valkey via the docker service name; no host port is needed.
    expose:
      - "6379"
    networks:
      - internal

  # litellm + litellm-db-init are declared in docker-compose.base.yml
  # without `networks:`. Compose's `include:` merges the service block
  # verbatim, so without an override they'd land on the auto-created
  # `default` network and lose access to Postgres (which is `internal`-
  # only). Pin them onto `internal` here. Same fix is needed in prod.
  litellm:
    networks:
      - internal

  litellm-db-init:
    networks:
      - internal

  # Defined inline (not in base) — prod uses external S3 and `include:`
  # has no "drop service" mechanic. See header in docker-compose.base.yml.
  seaweedfs:
    image: chrislusf/seaweedfs@sha256:854479eebcbc0060d803edb27b3bd88a0552e23fde08a26a6482e59aff887a77
    restart: unless-stopped
    command: >
      server -s3
      -ip=seaweedfs -ip.bind=0.0.0.0
      -dir=/data -s3.config=/etc/seaweedfs/s3.json -s3.port=8333
    ports:
      - "8333:8333"
    volumes:
      - seaweed_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - internal

  app:
    build: .
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      # The bundled validator hardcodes the prod-only Stripe check
      # (process.env.NODE_ENV === 'production' is dead-code-eliminated at
      # build time, so flipping NODE_ENV at runtime is a no-op). Stub the
      # values so the check passes — local doesn't hit any Stripe code
      # path. Prod compose populates the real keys via .env.
      - NUXT_STRIPE_SECRET_KEY=sk_test_local_stub
      - NUXT_STRIPE_WEBHOOK_SECRET=whsec_local_stub
      - NUXT_SESSION_PASSWORD=local-session-password-at-least-32-characters-long
      - NUXT_OAUTH_GITHUB_CLIENT_ID=${NUXT_OAUTH_GITHUB_CLIENT_ID}
      - NUXT_OAUTH_GITHUB_CLIENT_SECRET=${NUXT_OAUTH_GITHUB_CLIENT_SECRET}
      - NUXT_OAUTH_GOOGLE_CLIENT_ID=${NUXT_OAUTH_GOOGLE_CLIENT_ID}
      - NUXT_OAUTH_GOOGLE_CLIENT_SECRET=${NUXT_OAUTH_GOOGLE_CLIENT_SECRET}
      - NUXT_S3_ENDPOINT=http://seaweedfs:8333
      - NUXT_S3_ACCESS_KEY=${NUXT_S3_ACCESS_KEY:?NUXT_S3_ACCESS_KEY required}
      - NUXT_S3_SECRET_KEY=${NUXT_S3_SECRET_KEY:?NUXT_S3_SECRET_KEY required}
      - NUXT_S3_BUCKET=${NUXT_S3_BUCKET:?NUXT_S3_BUCKET required}
      - NUXT_JWT_SECRET=local-jwt-secret-change-me-64chars-for-real-deployments-only-xx
      - NUXT_INTERNAL_API_SECRET=local-internal-api-secret-change-me
      - NUXT_AI_DICTATE_JWT_SECRET=${NUXT_AI_DICTATE_JWT_SECRET}
      - NUXT_PUBLIC_SYNC_URL=wss://sync.ypad.127.0.0.1.nip.io
      - NUXT_SYNC_INTERNAL_URL=http://sync:4001
      - NUXT_MARKITDOWN_URL=http://markitdown:8080
      - NUXT_RENDERER_INTERNAL_URL=http://renderer:9000
      # LiteLLM proxy. Required by server/plugins/01-validate-secrets.ts —
      # the app fails fast at boot without these. URL hits the in-network
      # service; master key matches the one mounted into the litellm
      # container (which reads LITELLM_MASTER_KEY from .env via base.yml).
      - NUXT_LITELLM_URL=http://litellm:4000
      - NUXT_LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY required}
      # Postgres + Valkey atomic parts. *_HOST overridden to the docker
      # service name; .env owns user/password/db/port. The Nuxt app
      # composes the URL via shared/utils/connectionStrings.ts.
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - VALKEY_PASSWORD=${VALKEY_PASSWORD}
      - VALKEY_DB=${VALKEY_DB}
      # Sentry (sentry.io). Empty in local stays silent.
      - NUXT_PUBLIC_SENTRY_DSN=${NUXT_PUBLIC_SENTRY_DSN}
      - SENTRY_DSN=${SENTRY_DSN}
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`ypad.127.0.0.1.nip.io`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.services.app.loadbalancer.server.port=3000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - web
      - internal

  sync:
    build:
      context: .
      dockerfile: sync-server/Dockerfile
    environment:
      - JWT_SECRET=local-jwt-secret-change-me-64chars-for-real-deployments-only-xx
      - INTERNAL_API_SECRET=local-internal-api-secret-change-me
      - SENTRY_DSN=${SENTRY_DSN}
      - APP_URL=http://app:3000
    expose:
      - "4001"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sync.rule=Host(`sync.ypad.127.0.0.1.nip.io`)"
      - "traefik.http.routers.sync.entrypoints=websecure"
      - "traefik.http.routers.sync.tls=true"
      - "traefik.http.services.sync.loadbalancer.server.port=4001"
    networks:
      - web
      - internal

  markitdown:
    build: ./markitdown-server
    expose:
      - "8080"
    networks:
      - internal

  # Backend PDF + PNG renderer — see docker-compose.base.yml for the
  # rationale. In local mode it sits on the internal network only; the
  # app reaches it via http://renderer:9000.
  renderer:
    build: ./renderer
    environment:
      # Hardcoded literal to mirror the app+sync hardcoded secrets in
      # this file — local boots without a populated .env.
      - INTERNAL_API_SECRET=local-internal-api-secret-change-me
      - APP_URL=http://app:3000
      - S3_ENDPOINT=http://seaweedfs:8333
    expose:
      - "9000"
    networks:
      - internal

  backup:
    build: ./backup-server
    environment:
      - S3_ENDPOINT=http://seaweedfs:8333
      - BACKUP_INTERVAL_SECONDS=3600
      - BACKUP_RETENTION_COUNT=5
      # Stub passphrase so the sidecar doesn't restart-loop. Local
      # backups encrypt against a throwaway key — never used for restore.
      # Prod compose requires a real value via `:?required`.
      - BACKUP_GPG_PASSPHRASE=local-backup-not-a-real-passphrase
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    networks:
      - internal

volumes:
  # Declared here (not in base) because seaweedfs is defined per-env —
  # see header in docker-compose.base.yml.
  seaweed_data:
