# Full-stack local run — Traefik with mkcert TLS, all images built from source.
# Domain: ypad.127.0.0.1.nip.io (nip.io wildcards resolve *.127.0.0.1.nip.io → 127.0.0.1).
# (The `ypad.` prefix is a leftover from the old project codename — purely a
#  local-dev hostname, not the brand. Renaming would force every dev to
#  regenerate certs, so we keep it.)
# Run: docker compose -f docker-compose.local.yml up -d --build
#
# First-time setup: see docs/LOCAL.md.
#
# Access:
#   App:           https://ypad.127.0.0.1.nip.io
#   Sync:          wss://sync.ypad.127.0.0.1.nip.io
#   Traefik UI:    `docker compose -f docker-compose.local.yml exec traefik wget -qO- localhost:8080/api/rawdata`
#                  (dashboard isn't bound to host to avoid port clashes with
#                  other dev tools; run via exec when you need it)
#
# Policy: secrets that are local-only (postgres pw, jwt, etc.) are
# inlined here so this file boots without a .env. Anything that varies
# per developer (Google API keys, OAuth client ids, Sentry DSN) reads
# from .env via `${VAR:?required}` so a missing entry crashes
# `docker compose up` instead of silently booting empty.
#
# Common service shape lives in docker-compose.base.yml (see header).
# This file adds Traefik (mkcert TLS), the Nuxt `app` service, and
# wires every backend service onto its purpose networks.

include:
  - docker-compose.base.yml

# Same purpose networks as docker-compose.prod.yml (see its header), plus
# `storage` for the bundled SeaweedFS. `storage` is not `internal: true`
# here only because SeaweedFS publishes 8333 on 127.0.0.1 for the browser.
networks:
  web:
    name: web-local
  docker-api:
    internal: true
  data:
    internal: true
  render:
    internal: true
  import:
    internal: true
  storage: {}
  egress: {}
  renderer-egress: {}

services:
  # Read-only Docker API for Traefik — see docker-compose.prod.yml.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    mem_limit: 64m
    environment:
      - CONTAINERS=1
      - EVENTS=1
      - PING=1
      - VERSION=1
      - POST=0
    volumes:
      # CONTAINER_SOCKET: the engine API socket (rootless Podman: $XDG_RUNTIME_DIR/podman/podman.sock). docs/CONTAINER-ENGINES.md.
      - ${CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m
      - /run:size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # SELinux hosts (Fedora/RHEL, Docker or Podman): a confined container
      # may not connect to the engine socket. Only this proxy touches it.
      - label=disable
    networks:
      - docker-api

  traefik:
    image: traefik:v3@sha256:c8a121e4bb1347e8fd52657fab12f2cb70b68f8a018895e2068f92c9e519b9c2
    restart: unless-stopped
    command:
      - "--global.sendAnonymousUsage=false"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=web-local"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    ports:
      # Loopback only: *.127.0.0.1.nip.io resolves to 127.0.0.1 anyway.
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./traefik/local:/etc/traefik/dynamic:ro,z
    read_only: true
    # Docker sets this in every container's network namespace; Podman does
    # not. Without it Traefik (no capabilities) can't bind :80 / :443.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - socket-proxy
    networks:
      - web
      - docker-api

  postgres:
    expose:
      - "5432"
    networks:
      - data

  valkey:
    # `expose:` only — Valkey stays on the internal `data` network.
    # In local mode the app runs IN the `app` container and reaches
    # valkey via the docker service name; no host port is needed.
    expose:
      - "6379"
    networks:
      - data

  # litellm + db-init are declared in docker-compose.base.yml without
  # `networks:`. Compose's `include:` merges the service block verbatim, so
  # without an override they'd land on the auto-created `default` network
  # and lose access to Postgres (which is `data`-only). Same in prod.
  litellm:
    networks:
      - data
      - egress

  db-init:
    networks:
      - data

  # Defined inline (not in base) — prod uses external S3 and `include:`
  # has no "drop service" mechanic. See header in docker-compose.base.yml.
  seaweedfs:
    image: chrislusf/seaweedfs@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
    restart: unless-stopped
    # `-master.volumeSizeLimitMB=256`: recent SeaweedFS derives how many
    # volumes a server may hold from free disk / volume size limit (default
    # 30 GB). On a small /data -- e.g. the tmpfs on a 16 GB CI runner -- that
    # leaves no free volume slot and every PUT fails with "No writable
    # volumes" (surfaced by the renderer as an S3 InternalError / "Renderer
    # 500"). Small volumes keep plenty of slots on any realistic disk.
    command: >
      server -s3
      -ip=seaweedfs -ip.bind=0.0.0.0
      -dir=/data -s3.config=/etc/seaweedfs/s3.json -s3.port=8333
      -master.volumeSizeLimitMB=256
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweed_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro,z
    # The image's entrypoint chowns /data as root, then drops to `seaweed`.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    networks:
      - storage

  app:
    # Same as the image's HEALTHCHECK, declared here because Podman builds
    # OCI images, which drop HEALTHCHECK (docs/CONTAINER-ENGINES.md).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --tries=1 --timeout=5 http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    build: .
    restart: unless-stopped
    stop_grace_period: 30s
    # Match prod's cap so the pre-push full-stack run behaves like prod.
    mem_limit: 2g
    environment:
      # Billing mode (shared/config/billingMode.ts). Off by default, like
      # prod: no Stripe vars needed (the boot-time Stripe check only runs
      # with NUXT_BILLING_ENABLED=true). Override from your shell/.env to
      # preview the hosted "coming soon" pricing page or the billing flow.
      - NUXT_BILLING_ENABLED=${NUXT_BILLING_ENABLED:-false}
      - NUXT_PLANS_COMING_SOON=${NUXT_PLANS_COMING_SOON:-false}
      # Legal surfaces default ON like prod (shared/config/instance.ts).
      - NUXT_LEGAL_SURFACES_ENABLED=${NUXT_LEGAL_SURFACES_ENABLED:-true}
      # Anonymous gate follows the legal surfaces (on here, like prod).
      - NUXT_ANON_GATE_ENABLED=${NUXT_ANON_GATE_ENABLED:-}
      - NUXT_ALTCHA_HMAC_KEY=local-altcha-hmac-key-change-me-at-least-32-chars
      # Required in production builds (email links are built from it only).
      - NUXT_SITE_URL=https://ypad.127.0.0.1.nip.io
      - NUXT_SESSION_PASSWORD=local-session-password-at-least-32-characters-long
      - NUXT_OAUTH_GITHUB_CLIENT_ID=${NUXT_OAUTH_GITHUB_CLIENT_ID}
      - NUXT_OAUTH_GITHUB_CLIENT_SECRET=${NUXT_OAUTH_GITHUB_CLIENT_SECRET}
      - NUXT_OAUTH_GOOGLE_CLIENT_ID=${NUXT_OAUTH_GOOGLE_CLIENT_ID}
      - NUXT_OAUTH_GOOGLE_CLIENT_SECRET=${NUXT_OAUTH_GOOGLE_CLIENT_SECRET}
      # Optional generic OIDC (self-host feature; the hosted prod compose
      # does not pass these). Issuer must be https in this production build.
      - NUXT_OAUTH_OIDC_ISSUER=${NUXT_OAUTH_OIDC_ISSUER:-}
      - NUXT_OAUTH_OIDC_CLIENT_ID=${NUXT_OAUTH_OIDC_CLIENT_ID:-}
      - NUXT_OAUTH_OIDC_CLIENT_SECRET=${NUXT_OAUTH_OIDC_CLIENT_SECRET:-}
      - NUXT_OAUTH_OIDC_NAME=${NUXT_OAUTH_OIDC_NAME:-}
      - NUXT_S3_ENDPOINT=http://seaweedfs:8333
      - NUXT_S3_ACCESS_KEY=${NUXT_S3_ACCESS_KEY:?NUXT_S3_ACCESS_KEY required}
      - NUXT_S3_SECRET_KEY=${NUXT_S3_SECRET_KEY:?NUXT_S3_SECRET_KEY required}
      - NUXT_S3_BUCKET=${NUXT_S3_BUCKET:?NUXT_S3_BUCKET required}
      - NUXT_JWT_SECRET=local-jwt-secret-change-me-64chars-for-real-deployments-only-xx
      - NUXT_INTERNAL_API_SECRET=local-internal-api-secret-change-me
      - NUXT_AI_DICTATE_JWT_SECRET=${NUXT_AI_DICTATE_JWT_SECRET}
      - NUXT_PUBLIC_SYNC_URL=wss://sync.ypad.127.0.0.1.nip.io
      - NUXT_SYNC_INTERNAL_URL=http://sync:4001
      - NUXT_MARKITDOWN_URL=http://markitdown:8080
      - NUXT_RENDERER_INTERNAL_URL=http://renderer:9000
      # LiteLLM proxy. Required by server/plugins/01-validate-secrets.ts —
      # the app fails fast at boot without these. URL hits the in-network
      # service; master key matches the one mounted into the litellm
      # container (which reads LITELLM_MASTER_KEY from .env via base.yml).
      - NUXT_LITELLM_URL=http://litellm:4000
      # Embeddings (see docker-compose.prod.yml / docs/AI-MODELS.md#embeddings).
      - NUXT_LITELLM_EMBEDDINGS_MODEL=${NUXT_LITELLM_EMBEDDINGS_MODEL:-jina-embeddings-v5-text-nano}
      - NUXT_LITELLM_EMBEDDINGS_DIMS=${NUXT_LITELLM_EMBEDDINGS_DIMS:-768}
      - NUXT_LITELLM_EMBEDDINGS_SEND_DIMENSIONS=${NUXT_LITELLM_EMBEDDINGS_SEND_DIMENSIONS:-auto}
      - NUXT_LITELLM_EMBEDDINGS_TASK_HINTS=${NUXT_LITELLM_EMBEDDINGS_TASK_HINTS:-auto}
      - NUXT_LITELLM_EMBEDDINGS_UPSTREAM_MODEL=${EMBEDDINGS_UPSTREAM_MODEL:-}
      - NUXT_LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY required}
      # The app encrypts each user's LiteLLM virtual-key token at rest with
      # this key (server/utils/litellm/userKeys.ts). Without it, creating
      # the key (first AI use, BYOK save, AI Points) fails with a 500.
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY:?LITELLM_SALT_KEY required}
      # AI grounding provider keys read directly by the app process (NOT via
      # LiteLLM): Staan backs web_search, Jina Reader backs fetch_url.
      # Platform-paid web tools. Optional: without a key the matching tool
      # (web_search / fetch_url) is simply not offered to the AI and
      # /api/ai/availability reports webTools.{search,fetch}=false.
      - STAAN_API_KEY=${STAAN_API_KEY:-}
      - JINA_AI_API_KEY=${JINA_AI_API_KEY:-}
      # Per-user web-tool allowance (calls/hour, calls/day; 0 = unlimited,
      # empty = default 30 / 100). Shared by the editor AI and MCP.
      - NUXT_WEB_TOOLS_HOURLY_LIMIT=${NUXT_WEB_TOOLS_HOURLY_LIMIT:-}
      - NUXT_WEB_TOOLS_DAILY_LIMIT=${NUXT_WEB_TOOLS_DAILY_LIMIT:-}
      # Bring-your-own-key AI (WP4) — instance defaults + URL policy. See
      # server/utils/aiProviders/config.ts. MISTRAL_API_KEY reaches the app
      # only for live dictation on a platform-alias transcription default.
      - NUXT_AI_DEFAULT_CHAT_MODEL=${NUXT_AI_DEFAULT_CHAT_MODEL:-}
      - NUXT_AI_DEFAULT_CHAT_BASE_URL=${NUXT_AI_DEFAULT_CHAT_BASE_URL:-}
      - NUXT_AI_DEFAULT_CHAT_API_KEY=${NUXT_AI_DEFAULT_CHAT_API_KEY:-}
      - NUXT_AI_DEFAULT_CHAT_VISION=${NUXT_AI_DEFAULT_CHAT_VISION:-}
      - NUXT_AI_DEFAULT_IMAGE_MODEL=${NUXT_AI_DEFAULT_IMAGE_MODEL:-}
      - NUXT_AI_DEFAULT_IMAGE_BASE_URL=${NUXT_AI_DEFAULT_IMAGE_BASE_URL:-}
      - NUXT_AI_DEFAULT_IMAGE_API_KEY=${NUXT_AI_DEFAULT_IMAGE_API_KEY:-}
      - NUXT_AI_DEFAULT_TRANSCRIBE_MODEL=${NUXT_AI_DEFAULT_TRANSCRIBE_MODEL:-}
      - NUXT_AI_DEFAULT_TRANSCRIBE_BASE_URL=${NUXT_AI_DEFAULT_TRANSCRIBE_BASE_URL:-}
      - NUXT_AI_DEFAULT_TRANSCRIBE_API_KEY=${NUXT_AI_DEFAULT_TRANSCRIBE_API_KEY:-}
      # Local mirrors the hosted shape (legal surfaces on), which requires a
      # provider allowlist; default to the hosted list.
      - NUXT_AI_BYOK_ALLOWED_BASE_URLS=${NUXT_AI_BYOK_ALLOWED_BASE_URLS:-https://api.mistral.ai/v1,https://api.openai.com/v1,https://openrouter.ai/api/v1,https://api.groq.com/openai/v1,https://api.together.xyz/v1,https://api.deepinfra.com/v1/openai,https://api.fireworks.ai/inference/v1,https://api.scaleway.ai/v1}
      - NUXT_AI_BYOK_ALLOW_PRIVATE_URLS=${NUXT_AI_BYOK_ALLOW_PRIVATE_URLS:-false}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      # Postgres + Valkey atomic parts. *_HOST overridden to the docker
      # service name; .env owns user/password/db/port. The Nuxt app
      # composes the URL via shared/utils/connectionStrings.ts.
      - NUXT_LITELLM_DB_USER=${POSTGRES_LITELLM_USER:-}
      - NUXT_LITELLM_DB_PASSWORD=${POSTGRES_LITELLM_PASSWORD:-}
      - POSTGRES_USER=${POSTGRES_APP_USER:-${POSTGRES_USER}}
      - POSTGRES_PASSWORD=${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - VALKEY_PASSWORD=${VALKEY_PASSWORD}
      - VALKEY_DB=${VALKEY_DB}
      # Sentry (sentry.io). Empty in local stays silent.
      - NUXT_PUBLIC_SENTRY_DSN=${NUXT_PUBLIC_SENTRY_DSN}
      - SENTRY_DSN=${SENTRY_DSN}
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`ypad.127.0.0.1.nip.io`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.services.app.loadbalancer.server.port=3000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      web: {}
      data: {}
      import: {}
      storage: {}
      render:
        # Chromium (renderer) can't use the service name `app`: it's an
        # HSTS-preloaded TLD, so http://app:3000 is upgraded to https and
        # fails with ERR_SSL_PROTOCOL_ERROR. The renderer uses this alias.
        aliases:
          - markoto-app

  sync:
    build:
      context: .
      dockerfile: sync-server/Dockerfile
    environment:
      - JWT_SECRET=local-jwt-secret-change-me-64chars-for-real-deployments-only-xx
      - INTERNAL_API_SECRET=local-internal-api-secret-change-me
      - SENTRY_DSN=${SENTRY_DSN}
      - APP_URL=http://app:3000
    expose:
      - "4001"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sync.rule=Host(`sync.ypad.127.0.0.1.nip.io`)"
      - "traefik.http.routers.sync.entrypoints=websecure"
      - "traefik.http.routers.sync.tls=true"
      - "traefik.http.services.sync.loadbalancer.server.port=4001"
    networks:
      - web
      - data

  markitdown:
    build: ./markitdown-server
    expose:
      - "8080"
    networks:
      - import

  # Backend PDF + PNG renderer — see docker-compose.base.yml for the
  # rationale. In local mode it sits on the render + storage networks only; the
  # app reaches it via http://renderer:9000.
  renderer:
    build: ./renderer
    environment:
      # Hardcoded literal to mirror the app+sync hardcoded secrets in
      # this file — local boots without a populated .env.
      - INTERNAL_API_SECRET=local-internal-api-secret-change-me
      # Not http://app:3000 — see the `markoto-app` alias on the app service.
      - APP_URL=http://markoto-app:3000
      - S3_ENDPOINT=http://seaweedfs:8333
      # SeaweedFS doesn't support SSE-S3 — omit the encryption header or
      # PDF/PNG render uploads fail with an opaque S3 InternalError.
      - S3_SSE=none
    expose:
      - "9000"
    networks:
      - render
      - storage
      - renderer-egress

  backup:
    build: ./backup-server
    environment:
      - S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-http://seaweedfs:8333}
      - BACKUP_INTERVAL_SECONDS=3600
      # SeaweedFS rejects the SSE-S3 header (InternalError) — see backup.sh.
      - S3_SSE=none
      - BACKUP_RETENTION_COUNT=5
      # Stub passphrase so the sidecar doesn't restart-loop. Local
      # backups encrypt against a throwaway key — never used for restore.
      # Prod compose requires a real value via `:?required`.
      - BACKUP_GPG_PASSPHRASE=local-backup-not-a-real-passphrase
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    networks:
      - data
      - storage

volumes:
  # Declared here (not in base) because seaweedfs is defined per-env —
  # see header in docker-compose.base.yml.
  seaweed_data:
