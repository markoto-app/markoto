---
# Idempotent app deploy. Pulls images per IMAGE_TAG, syncs compose files,
# renders .env, runs compose up -d, polls /api/health.
- name: Deploy markoto stack
  hosts: markoto
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
    # This environment's values and secrets (inventories/<env>/).
    - "{{ inventory_dir }}/env.yml"
    - "{{ inventory_dir }}/vault.yml"
  roles:
    - role: markoto
    - role: backup_timer
