---
# One-time setup of a fresh OVH VPS. Run as root (default OVH image user).
# Brings the host from "blank Debian 12" to "ready to accept deploys".
#
# Role order matters:
#   1. base — apt cache, ufw, fail2ban, journald, timezone, markoto user.
#      Keeps app-specific bits OS-hardening doesn't cover.
#   2. devsec.hardening.os_hardening — CIS-aligned sysctl/perms/PAM tuning.
#      Runs AFTER base (we need ufw on first; os_hardening doesn't touch ufw)
#      and BEFORE docker so the sysctl_overwrite for ip_forward=1 lands before
#      Docker probes the kernel.
#   3. geerlingguy.docker — Docker engine + compose plugin via apt repo.
#   4. ssh_hardening — our wrapper that refuses to lock you out if the markoto
#      user has no authorized_keys yet. Keep our version, not devsec's, until
#      we've port-tested the safe-not-lock-yourself-out check.
- name: Provision markoto VPS (one-time)
  hosts: markoto
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  roles:
    - role: base
    - role: devsec.hardening.os_hardening
      vars:
        # ─── Deviations from CIS defaults — document each. ───
        # Docker bridge networking REQUIRES IPv4 forwarding. CIS sets it to 0
        # (correct for non-routers); without this override Docker silently
        # falls back to host-mode and breaks compose networking.
        sysctl_overwrite:
          net.ipv4.ip_forward: 1
        # auditd is heavy (its own log volume, separate forwarding pipeline).
        # We capture audit signal via Sentry (app-level) + OVH/journald (host).
        # Reconsider when we have a SIEM that ingests auditd events.
        os_auditd_enabled: false
        # Single-user mode is part of the recovery path on OVH (rescue console
        # → mount → fix). Keep it available. Default is already false; pinned
        # explicitly so a future devsec bump can't flip it.
        os_security_init_single: false
        # Don't enforce /etc/issue banner — pure cosmetic, and we already gate
        # at the SSH layer.
        os_security_init_prompt: false
        # `os_ignore_users` defaults include `vagrant` + `kitchen`; add ours
        # so future password-ageing checks don't accidentally lock the daemon
        # service account out.
        os_ignore_users: [vagrant, kitchen, "{{ markoto_user }}"]
    - role: geerlingguy.docker
      vars:
        # We use the compose PLUGIN (`docker compose`), not the standalone
        # `docker-compose` CLI. The plugin ships in `docker-compose-plugin`
        # apt package and is what every `docker compose -f ...` call in
        # roles/markoto/ + the cron uses.
        docker_install_compose_plugin: true
        docker_install_compose: false
        docker_users:
          - "{{ markoto_user }}"
        # Match the daemon.json our hand-rolled role used to render. 50 MB ×
        # 5 = 250 MB max per container's log; live-restore lets us upgrade
        # the daemon without bouncing every container.
        docker_daemon_options:
          log-driver: "json-file"
          log-opts:
            max-size: "50m"
            max-file: "5"
          live-restore: true
    # ─── geerlingguy.security ───
    # Drives unattended-upgrades + reboot scheduling. We DISABLE its SSH +
    # fail2ban knobs because devsec.hardening + our ssh_hardening role +
    # base/fail2ban already cover those, and double-configuration would
    # fight on the file watch. The reboot window is 04:30 UTC — after the
    # 03:00 UTC backup-cron tick, before any reasonable peak-traffic
    # window.
    - role: geerlingguy.security
      vars:
        security_ssh_password_authentication: "no"
        security_ssh_permit_root_login: "no"
        security_ssh_usedns: "no"
        security_ssh_permit_empty_password: "no"
        security_ssh_challenge_response_auth: "no"
        security_ssh_gss_api_authentication: "no"
        security_ssh_x11_forwarding: "no"
        security_autoupdate_enabled: true
        security_autoupdate_reboot: "true"
        security_autoupdate_reboot_time: "04:30"
        # Mail is OFF — we use Apprise via the post-Invoke hook
        # (roles/base/templates/markoto-apt-hook.j2 calls markoto-notify).
        security_autoupdate_mail_to: ""
        security_autoupdate_mail_on_error: false
        # We already configure fail2ban in roles/base. Keep the security
        # role from re-templating it.
        security_fail2ban_enabled: false
    - role: ssh_hardening
