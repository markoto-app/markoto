---
# Restore drill: proves the most recent gpg-encrypted dump is not just
# decryptable but ACTUALLY RESTORABLE end-to-end:
#   1. Locate the most-recent backup in S3
#   2. Download + gpg-decrypt + gunzip + `psql` it into a THROWAWAY database
#      on the live Postgres instance (a real restore, not a `head` sniff)
#   3. Verify the restored schema has the tables we expect
#   4. Drop the throwaway database + clean up tmp files
#
# Run periodically (it's operator-invoked, not scheduled): the restore
# competes with prod for Postgres CPU/disk transiently, so pick a quiet
# window. A partial read of the dump could pass on a TRUNCATED file; a
# full psql restore is the only thing that proves the dump applies cleanly.
- name: Backup restore drill
  hosts: markoto
  become: true
  gather_facts: false
  vars:
    restore_db: markoto_restore_drill
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/all.vault.yml
  tasks:
    - name: Locate most-recent gpg backup in S3 (run inside backup container)
      ansible.builtin.shell: |
        set -euo pipefail
        cd {{ markoto_root }}
        docker compose exec -T backup sh -c '
          export AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY"
          export AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY"
          export AWS_DEFAULT_REGION="$S3_REGION"
          aws --endpoint-url "$S3_ENDPOINT" \
            s3 ls "s3://$S3_BUCKET/$S3_PREFIX/" \
            | awk "{print \$4}" | { grep -E "[.]sql[.]gz[.]gpg$" || true; } | sort | tail -1
        '
      register: latest_backup
      changed_when: false

    - name: Fail if no backup yet exists
      ansible.builtin.fail:
        msg: >-
          No backup found in the backup bucket/prefix (BACKUP_S3_BUCKET /
          BACKUP_S3_PREFIX; the app's bucket and backups/postgres when unset).
          Run the in-stack backup once before testing.
      when: latest_backup.stdout | trim | length == 0

    # Restore + verify inside a block so the throwaway DB is ALWAYS dropped,
    # even when the restore or verification step fails the play.
    - name: Restore drill (throwaway DB cleaned up in always)
      block:
        - name: Download + decrypt + restore into a throwaway database
          ansible.builtin.shell: |
            set -euo pipefail
            cd {{ markoto_root }}
            BACKUP_KEY="{{ latest_backup.stdout | trim }}"
            docker compose exec -T backup sh -c "
              set -e
              set -o pipefail
              export AWS_ACCESS_KEY_ID=\"\$S3_ACCESS_KEY\"
              export AWS_SECRET_ACCESS_KEY=\"\$S3_SECRET_KEY\"
              export AWS_DEFAULT_REGION=\"\$S3_REGION\"
              # Fresh throwaway DB (drop any leftover from a prior aborted drill).
              dropdb -h \"\$POSTGRES_HOST\" -U \"\$POSTGRES_USER\" --if-exists {{ restore_db }}
              createdb -h \"\$POSTGRES_HOST\" -U \"\$POSTGRES_USER\" {{ restore_db }}
              # Real restore: S3 -> gpg -> gunzip -> psql. --set ON_ERROR_STOP=1
              # makes psql exit non-zero on the FIRST bad statement, so a
              # truncated / corrupt dump fails the drill loudly (pipefail then
              # propagates it out of this sh -c).
              aws --endpoint-url \"\$S3_ENDPOINT\" \
                s3 cp \"s3://\$S3_BUCKET/\$S3_PREFIX/${BACKUP_KEY}\" /tmp/restore-test.gpg
              gpg --batch --quiet --pinentry-mode loopback \
                  --passphrase \"\$BACKUP_GPG_PASSPHRASE\" \
                  --decrypt /tmp/restore-test.gpg \
                | gunzip \
                | psql -h \"\$POSTGRES_HOST\" -U \"\$POSTGRES_USER\" -d {{ restore_db }} \
                       --set ON_ERROR_STOP=1 --quiet >/dev/null
              rm -f /tmp/restore-test.gpg
            "
          register: restore_apply
          changed_when: false

        - name: Verify the restored schema has the expected core tables
          ansible.builtin.shell: |
            set -euo pipefail
            cd {{ markoto_root }}
            docker compose exec -T backup sh -c "
              # Both must resolve to a real relation (non-empty output) or the
              # restore was structurally incomplete. Also print the table count
              # as a sanity signal.
              psql -h \"\$POSTGRES_HOST\" -U \"\$POSTGRES_USER\" -d {{ restore_db }} -tAc \
                \"SELECT to_regclass('public.users') IS NOT NULL
                     AND to_regclass('public.documents') IS NOT NULL,
                        (SELECT count(*) FROM information_schema.tables
                           WHERE table_schema='public')\"
            "
          register: restore_verify
          changed_when: false

        - name: Fail the drill if core tables are missing
          ansible.builtin.fail:
            msg: >-
              Restore verification FAILED: core tables (users/documents) not
              present in the restored database. Backup may be truncated or
              corrupt. Verify output: {{ restore_verify.stdout | trim }}
          when: not (restore_verify.stdout | trim | lower).startswith('t|')

        - name: Report restore drill result
          ansible.builtin.debug:
            msg: >-
              Restore drill PASSED: {{ latest_backup.stdout | trim }} applied
              cleanly into a throwaway DB; core tables present
              (verify = {{ restore_verify.stdout | trim }} as core-ok|table-count).
      always:
        - name: Drop the throwaway database
          ansible.builtin.shell: |
            set -euo pipefail
            cd {{ markoto_root }}
            docker compose exec -T backup sh -c "
              dropdb -h \"\$POSTGRES_HOST\" -U \"\$POSTGRES_USER\" --if-exists {{ restore_db }}
            "
          changed_when: false
