---
# Belt-and-braces cron. The in-stack `backup` sidecar is the primary path;
# this is the safety net for "the sidecar silently stopped working".
# Triggers a one-shot backup via the same container's backup.sh entry-point
# (/usr/local/bin/backup.sh, the path the image installs; CI asserts it
# resolves in the built image) at 03:00 UTC daily and writes a stdout/stderr
# log. backup.sh --once exits non-zero when the dump or upload failed, which
# is what raises the markoto-notify alert below. Failures append to
# /opt/markoto/backup-cron-failures.log so a daily `tail` shows alerts.

- name: Install daily backup-trigger cron
  ansible.builtin.cron:
    name: "markoto belt-and-braces backup trigger"
    user: root
    minute: "0"
    hour: "3"
    # On failure: append to failures log AND fire a markoto-notify ping.
    # `markoto-notify` is installed by roles/base; if Apprise isn't
    # configured the wrapper silently no-ops.
    # `--once` is load-bearing: /backup.sh's default mode ends in an
    # infinite interval loop (it's the sidecar's PID-1 entrypoint), so an
    # exec WITHOUT the flag never returns — the cron job would hang
    # forever and stack an orphaned loop process every night.
    job: >-
      cd {{ markoto_root }} &&
      docker compose -f docker-compose.prod.yml exec -T backup /usr/local/bin/backup.sh --once
      >> {{ markoto_root }}/backup-cron.log 2>&1
      || (
      ec=$?;
      ts=$(date -Is);
      echo "${ts} backup-cron FAIL exit=${ec}"
      >> {{ markoto_root }}/backup-cron-failures.log;
      /usr/local/bin/markoto-notify
      "Backup failed on $(hostname)"
      "backup-cron exited ${ec} at ${ts}. Tail of backup-cron.log:
      $(tail -n 20 {{ markoto_root }}/backup-cron.log)" || true
      )

- name: Ensure backup-cron log file exists with sane permissions
  ansible.builtin.file:
    path: "{{ markoto_root }}/{{ item }}"
    state: touch
    owner: root
    group: "{{ markoto_user }}"
    mode: "0640"
    modification_time: preserve
    access_time: preserve
  loop:
    - backup-cron.log
    - backup-cron-failures.log
