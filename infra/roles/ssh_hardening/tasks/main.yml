---
# Disable password auth + root login. We MUST verify pubkey works before
# kicking the previous SSH session: otherwise a typo locks us out of a
# fresh VPS. The handler-driven reload + meta:reset_connection at the end
# ensures the next play picks up a working connection.

- name: Sanity-check that the markoto user has at least one authorized_key
  ansible.builtin.stat:
    path: "/home/{{ markoto_user }}/.ssh/authorized_keys"
  register: ssh_hardening_authkeys_stat

- name: Refuse to harden sshd if no pubkey is installed for markoto
  ansible.builtin.fail:
    msg: >-
      No authorized_keys for {{ markoto_user }} found. Hardening sshd now would
      lock you out. Add a key via the base role (which reads
      ~/.ssh/id_ed25519.pub) or pass `-e markoto_pubkey=...` and re-run.
  when: >
    not ssh_hardening_authkeys_stat.stat.exists
    or ssh_hardening_authkeys_stat.stat.size == 0

- name: Disable password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*PasswordAuthentication\s+'
    line: 'PasswordAuthentication no'
    validate: 'sshd -t -f %s'
  notify: Reload sshd

- name: Disable root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*PermitRootLogin\s+'
    line: 'PermitRootLogin no'
    validate: 'sshd -t -f %s'
  notify: Reload sshd

- name: Ensure pubkey auth is on (default, but make it explicit)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*PubkeyAuthentication\s+'
    line: 'PubkeyAuthentication yes'
    validate: 'sshd -t -f %s'
  notify: Reload sshd

- name: Disable challenge-response auth
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*ChallengeResponseAuthentication\s+'
    line: 'ChallengeResponseAuthentication no'
    validate: 'sshd -t -f %s'
  notify: Reload sshd

# Force handlers now so sshd reload happens BEFORE we try to reconnect.
- name: Flush handlers (reload sshd before continuing)
  ansible.builtin.meta: flush_handlers

- name: Reset Ansible SSH connection (pick up new sshd config)
  ansible.builtin.meta: reset_connection
