---
# App-specific OS bits NOT covered by devsec.hardening.os_hardening.
# os_hardening already does: sysctl tuning, PAM/login restrictions, file perm
# audits, kernel module bans, suid/sgid review, package cleanup.
# We keep here: ufw rules, fail2ban jail config, journald sizing, timezone,
# the markoto service account (unprivileged, no sudo), and the LUKS sanity
# check. The container engine is roles/podman_host.

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install operational packages
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
      - gnupg
      - curl
      - htop
      - ncdu
      - jq
      - python3-requests
      # Lets Ansible hand module files to the unprivileged markoto user
      # (become_user) without making them world-readable.
      - acl
      - ca-certificates
      - unattended-upgrades
    state: present

- name: Set timezone to UTC
  community.general.timezone:
    name: "{{ host_timezone }}"

# Container logs land here too (journald log driver, per-user journal
# files of the markoto user, roles/podman_host): SystemMaxUse bounds both.
- name: Configure journald for persistent storage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/markoto.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (markoto/base role).
      [Journal]
      Storage=persistent
      SystemMaxUse=2G
      SystemMaxFileSize=200M
      Compress=yes
  notify: Restart journald

- name: Allow SSH through ufw
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow HTTP through ufw
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow HTTPS through ufw
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

# ansible-lint can't statically validate `policy:` when it comes from a loop var,
# but `direction`/`policy` is a tiny enum and the loop is intentional (one task,
# two rules). Spelling each out as two tasks would be needless duplication.
- name: Set ufw default policies (deny incoming, allow outgoing)
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - {direction: incoming, policy: deny}
    - {direction: outgoing, policy: allow}

- name: Enable ufw
  community.general.ufw:
    state: enabled
    logging: low

- name: Configure fail2ban sshd jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd-markoto.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (markoto/base role).
      [sshd]
      enabled = true
      port    = 22
      maxretry = 5
      findtime = 600
      bantime = 3600
  notify: Restart fail2ban

- name: Ensure fail2ban running
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

- name: Create markoto group
  ansible.builtin.group:
    name: "{{ markoto_user }}"
    state: present

# A normal (not system) account: useradd allocates its subordinate uid/gid
# range, and systemd gives it a user manager (lingering, roles/podman_host).
# No supplementary groups (`append: false` also takes a host provisioned
# by the Docker-era role out of `sudo` / `docker`), no password.
- name: Create markoto user (unprivileged, no sudo)
  ansible.builtin.user:
    name: "{{ markoto_user }}"
    group: "{{ markoto_user }}"
    groups: []
    append: false
    shell: /bin/bash
    create_home: true
    password_lock: true
    state: present

- name: Remove the Docker-era passwordless sudo grant of the markoto user
  ansible.builtin.file:
    path: /etc/sudoers.d/markoto
    state: absent

# The GitHub deploy key is markoto's only key (exclusive), restricted to a
# plain session: no port / agent / X11 forwarding, no pty. With it a
# workflow can drive the stack and nothing else on the host.
- name: Install the deploy key as the markoto user's only authorized key
  ansible.posix.authorized_key:
    user: "{{ markoto_user }}"
    state: present
    key: "{{ markoto_deploy_pubkey }}"
    key_options: restrict
    exclusive: true
  when: markoto_deploy_pubkey | default('') | length > 0

# Two shells, both with `set -o pipefail` (ansible-lint risky-shell-pipe).
# Both are read-only probes (changed_when: false). The second is failed_when:
# false because absent `lsblk` types aren't an error: we just print a warning.
- name: Detect root device for the LUKS check
  ansible.builtin.shell: |
    set -o pipefail
    awk '$2 == "/" {print $1}' /proc/mounts | head -1
  args:
    executable: /bin/bash
  register: base_root_device
  changed_when: false

- name: Inspect root device for LUKS crypt mapping
  ansible.builtin.shell: |
    set -o pipefail
    lsblk -no TYPE "{{ base_root_device.stdout }}" 2>/dev/null \
      | grep -q crypt && echo "encrypted" || echo "plain"
  args:
    executable: /bin/bash
  register: base_luks_status
  changed_when: false
  failed_when: false

- name: Warn if root volume is not LUKS-encrypted
  ansible.builtin.debug:
    msg: |
      WARNING: root volume {{ base_root_device.stdout }} is NOT LUKS-encrypted
      (status={{ base_luks_status.stdout }}). Some OVH plans don't expose
      volume-level LUKS. See the operator runbook, kept outside this repository. Local disk holds .env,
      valkey AOF, traefik acme.json. Decide whether provider-side
      encryption-at-rest is sufficient for your threat model.
  when: base_luks_status.stdout != 'encrypted'

# Apprise unified-notification wrapper. Single entry point used by:
#   - the apt post-Invoke hook below (root)
#   - roles/backup_timer failure path (the markoto user)
#
# Configuration lives in /etc/markoto/apprise.env (root:markoto 0640): it
# sources APPRISE_URLS from the vault. Same value as the GitHub Actions
# secret of the same name.

- name: Install python3-pip (host-side, for apprise)
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-venv
    state: present

# Debian enforces PEP 668 (system-wide pip refuses without
# --break-system-packages or a venv). A tiny venv is the cleanest path.
- name: Create /opt/markoto-tools venv for apprise
  ansible.builtin.command:
    cmd: python3 -m venv /opt/markoto-tools
    creates: /opt/markoto-tools/bin/python

- name: Install apprise into the venv
  ansible.builtin.pip:
    name: apprise==1.9.9
    state: present
    virtualenv: /opt/markoto-tools

- name: Ensure /etc/markoto config dir exists
  ansible.builtin.file:
    path: /etc/markoto
    state: directory
    owner: root
    group: "{{ markoto_user }}"
    mode: "0750"

- name: Render Apprise env file (sourced by markoto-notify)
  ansible.builtin.copy:
    dest: /etc/markoto/apprise.env
    owner: root
    group: "{{ markoto_user }}"
    mode: "0640"
    content: |
      # Managed by Ansible (markoto/base role).
      # Semicolon-separated Apprise URLs (e.g. tgram://bot/chat;mailto://...).
      APPRISE_URLS={{ apprise_urls | default('') }}
  no_log: true

- name: Drop /usr/local/bin/markoto-notify wrapper
  ansible.builtin.copy:
    dest: /usr/local/bin/markoto-notify
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      # Managed by Ansible (markoto/base role).
      # Usage: markoto-notify "<title>" "<body>"
      set -euo pipefail
      if [ "$#" -lt 2 ]; then
        echo "usage: markoto-notify <title> <body>" >&2
        exit 2
      fi
      # shellcheck disable=SC1091
      [ -r /etc/markoto/apprise.env ] && . /etc/markoto/apprise.env
      if [ -z "${APPRISE_URLS:-}" ]; then
        # No URLs configured: silently no-op so callers (cron, apt hooks)
        # don't fail.
        exit 0
      fi
      /opt/markoto-tools/bin/apprise -t "$1" -b "$2" -i markdown "${APPRISE_URLS}"

- name: Drop apt post-Invoke hook for unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99-markoto-notify
    owner: root
    group: root
    mode: "0644"
    content: |
      // Managed by Ansible (markoto/base role).
      // Fires after every apt invocation that touched packages, including
      // unattended-upgrades. The script tails the most recent
      // unattended-upgrades log and notifies via Apprise. Best-effort,
      // exits 0 even on internal failure so apt isn't disrupted.
      DPkg::Post-Invoke {
        "if [ -x /usr/local/bin/markoto-notify ] && [ -f /var/log/unattended-upgrades/unattended-upgrades.log ]; then \
           tail=$(tail -n 30 /var/log/unattended-upgrades/unattended-upgrades.log 2>/dev/null || true); \
           hostname=$(hostname); \
           [ -n \"$tail\" ] && /usr/local/bin/markoto-notify \"OS update on ${hostname}\" \
             \"Unattended-upgrades log tail:\n\n${tail}\" || true; \
         fi; true";
      };

# Disable the security role's mail path (we set _mail_to: "" in vars but
# also drop a config snippet to make sure no MTA install gets triggered).
- name: Pin Unattended-Upgrade::DevRelease=false
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52-markoto-no-devrelease
    owner: root
    group: root
    mode: "0644"
    content: |
      // Managed by Ansible (markoto/base role).
      Unattended-Upgrade::DevRelease "false";
