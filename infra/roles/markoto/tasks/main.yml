---
# Idempotent app deploy. Re-running:
#   - re-renders .env (atomic via template module)
#   - re-syncs compose files
#   - pulls images per IMAGE_TAG
#   - `up -d` is a no-op if nothing changed, otherwise rolls services
#   - polls /api/health
#   - appends to deploys.log

- name: Ensure markoto root + secrets dirs exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ markoto_user }}"
    group: "{{ markoto_user }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ markoto_root }}", mode: "0750"}
    - {path: "{{ markoto_root }}/secrets", mode: "0700"}
    - {path: "{{ markoto_root }}/traefik", mode: "0750"}

# Traefik refuses to start if acme.json is world-readable.
- name: Ensure traefik/acme.json exists with mode 0600
  ansible.builtin.copy:
    dest: "{{ markoto_root }}/traefik/acme.json"
    content: ""
    force: false
    owner: "{{ markoto_user }}"
    group: "{{ markoto_user }}"
    mode: "0600"

- name: Discover compose files in repo
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/.."
    patterns: "docker-compose.prod.yml,docker-compose.prod.*.yml"
    file_type: file
    recurse: false
  delegate_to: localhost
  become: false
  register: markoto_compose_files

- name: Sync the production compose file(s) to the VPS
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ markoto_root }}/{{ item.path | basename }}"
    owner: "{{ markoto_user }}"
    group: "{{ markoto_user }}"
    mode: "0640"
  loop: "{{ markoto_compose_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

# CA copy is best-effort: many OVH plans don't pin a CA, but if you DO drop
# the .pem at infra/files/ovh-pg-ca.pem we honour it. `failed_when: false`
# replaces the noisier `ignore_errors: true` so ansible-lint stays happy.
- name: Sync OVH managed-PG CA cert (if present in infra/files/)
  ansible.builtin.copy:
    src: "{{ ovh_pg_ca_local_path }}"
    dest: "{{ ovh_pg_ca_remote_path }}"
    owner: "{{ markoto_user }}"
    group: "{{ markoto_user }}"
    mode: "0600"
  when: ovh_pg_host | length > 0
  failed_when: false

- name: Render .env from template
  ansible.builtin.template:
    src: env.j2
    dest: "{{ markoto_root }}/.env"
    owner: "{{ markoto_user }}"
    group: "{{ markoto_user }}"
    mode: "0600"
  register: markoto_env_render

- name: Compose pull (refresh images per IMAGE_TAG)
  community.docker.docker_compose_v2_pull:
    project_src: "{{ markoto_root }}"
    files:
      - docker-compose.prod.yml
  environment:
    COMPOSE_FILE: docker-compose.prod.yml

- name: Compose up -d (apply current state)
  community.docker.docker_compose_v2:
    project_src: "{{ markoto_root }}"
    files:
      - docker-compose.prod.yml
    state: present
    pull: missing
    remove_orphans: true

- name: Wait for /api/health to return 200
  ansible.builtin.uri:
    url: "{{ health_endpoint }}"
    method: GET
    status_code: 200
    timeout: 10
    validate_certs: true
  register: markoto_health_probe
  retries: "{{ (health_timeout_seconds / 5) | int }}"
  delay: 5
  until: markoto_health_probe.status == 200
  # Soft-fail: print diagnostics on miss, don't crash whole play.
  failed_when: false

- name: Surface health-probe diagnostics on miss
  ansible.builtin.debug:
    msg: >-
      /api/health did not return 200 within {{ health_timeout_seconds }}s.
      Check `make logs` and `docker compose ps`. The probe is non-fatal so
      that re-runs against a partially-deployed stack still succeed.
  when: markoto_health_probe.status != 200

- name: Append deploy marker to deploys.log
  ansible.builtin.lineinfile:
    path: "{{ markoto_root }}/deploys.log"
    line: >-
      {{ ansible_date_time.iso8601 }}
      image_tag={{ image_tag }}
      health={{ markoto_health_probe.status | default('?') }}
    create: true
    owner: "{{ markoto_user }}"
    group: "{{ markoto_user }}"
    mode: "0640"

# Opportunistic boot diagnostic — read-only, soft-fail.
- name: Tail last 50 app log lines (boot-cleanly check)
  ansible.builtin.command: >-
    docker compose -f {{ markoto_root }}/docker-compose.prod.yml
    logs --tail=50 app
  register: markoto_app_logs
  changed_when: false
  failed_when: false

- name: Surface app-log tail (truncated)
  ansible.builtin.debug:
    msg: "{{ markoto_app_logs.stdout_lines[-15:] | default([]) }}"
  when: markoto_app_logs.stdout_lines is defined
