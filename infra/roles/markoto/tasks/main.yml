---
# Idempotent app deploy on the rootless Podman host (roles/podman_host).
# Re-running:
#   - re-renders .env (render-env.sh, written atomically by `copy`)
#   - re-syncs the compose files + the config they mount
#   - pulls images per IMAGE_TAG and runs `up -d` through markoto-compose,
#     as the markoto user (a no-op if nothing changed)
#   - polls /api/health, then prunes images no deploy needs any more
#   - appends to deploys.log and records .last-deploy (what deploy.yml's
#     automatic rollback returns to)

- name: Ensure markoto root + secrets dirs exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ markoto_user }}"
    group: "{{ markoto_user }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ markoto_root }}", mode: "0750"}
    # 0711: traversable, not listable. The containers (the backup sidecar
    # runs as uid 70) reach the public Postgres CA bundle inside it; every
    # file in here keeps its own restrictive mode.
    - {path: "{{ markoto_root }}/secrets", mode: "0711"}
    - {path: "{{ markoto_root }}/traefik", mode: "0750"}

# Traefik refuses to start if acme.json is world-readable.
- name: Ensure traefik/acme.json exists with mode 0600
  ansible.builtin.copy:
    dest: "{{ markoto_root }}/traefik/acme.json"
    content: ""
    force: false
    owner: "{{ markoto_user }}"
    group: "{{ markoto_user }}"
    mode: "0600"

- name: Read the markoto user's account
  ansible.builtin.getent:
    database: passwd
    key: "{{ markoto_user }}"

- name: Remember the markoto home
  ansible.builtin.set_fact:
    markoto_home: "{{ ansible_facts.getent_passwd[markoto_user][4] }}"

# Read access to the private GHCR images (only while they are private). The
# file is the Docker client config: Docker Compose sends its credentials
# with every pull, and Podman reads the same file as a fallback. Written
# only when a token is set; rotation = new token, re-run (or the next
# GitHub deploy, which writes the same file from GHCR_PULL_TOKEN).
- name: Ensure ~/.docker exists for markoto
  ansible.builtin.file:
    path: "{{ markoto_home }}/.docker"
    state: directory
    owner: "{{ markoto_user }}"
    group: "{{ markoto_user }}"
    mode: "0700"
  when: ghcr_pull_token | default('') | length > 0

- name: Store the GHCR pull credentials for markoto
  ansible.builtin.copy:
    dest: "{{ markoto_home }}/.docker/config.json"
    content: "{{ {'auths': {'ghcr.io': {'auth': markoto_ghcr_auth}}} | to_nice_json }}\n"
    owner: "{{ markoto_user }}"
    group: "{{ markoto_user }}"
    mode: "0600"
  vars:
    markoto_ghcr_auth: "{{ (ghcr_pull_user ~ ':' ~ ghcr_pull_token) | b64encode }}"
  no_log: true
  when:
    - ghcr_pull_token | default('') | length > 0
    - ghcr_pull_user | default('') | length > 0

# provision.yml (roles/podman_host) installs Podman, the pinned Compose and
# this wrapper; a host without it was never provisioned for Podman.
- name: Require the markoto-compose wrapper (provision.yml)
  ansible.builtin.stat:
    path: /usr/local/bin/markoto-compose
  register: markoto_wrapper

- name: Fail on a host that is not provisioned for rootless Podman
  ansible.builtin.fail:
    msg: >-
      /usr/local/bin/markoto-compose is missing: run `make provision`
      (playbooks/provision.yml) on this host first.
  when: not markoto_wrapper.stat.exists

# The host mirrors the repository layout below {{ markoto_root }}: the
# production stack (deploy/compose/compose.prod.yml + the compose.base.yml it
# `include:`s) and every config file it bind-mounts (deploy/config/), so
# the compose files' relative paths resolve the same way on both. The same
# set the GitHub deploy workflow syncs.
- name: Ensure the deploy/ dirs exist
  ansible.builtin.file:
    path: "{{ markoto_root }}/{{ item }}"
    state: directory
    owner: "{{ markoto_user }}"
    group: "{{ markoto_user }}"
    mode: "0755"
  # Each level listed on its own: a parent created implicitly would be
  # root-owned, and the deploy workflow's tar sync could not write into it.
  loop:
    - deploy
    - deploy/compose
    - deploy/config
    - deploy/config/litellm
    - deploy/config/postgres
    - deploy/config/postgres/init
    - deploy/config/renderer
    - deploy/config/edge
    - deploy/config/traefik

- name: Sync the production stack + its mounted config to the VPS
  ansible.builtin.copy:
    src: "{{ markoto_repo_root }}/{{ item }}"
    dest: "{{ markoto_root }}/{{ item }}"
    owner: "{{ markoto_user }}"
    group: "{{ markoto_user }}"
    mode: "0644"
  loop:
    - deploy/compose/compose.prod.yml
    - deploy/compose/compose.base.yml
    # The hosted stack runs on rootless Podman: the renderer's seccomp
    # transport (docs/contributing/CONTAINER-ENGINES.md).
    - deploy/compose/compose.podman.yml
    - deploy/config/litellm/config.yaml
    - deploy/config/litellm/custom_handlers.py
    - deploy/config/postgres/init/01-litellm-db.sql
    # Run by the db-init one-shot (deploy/compose/compose.base.yml).
    - deploy/config/postgres/db-init.sh
    # The renderer's seccomp profile: named by compose.prod.yml, replaced
    # by Podman's default profile through the overlay above.
    - deploy/config/renderer/seccomp.json
    # The public 80/443 relay (edge-proxy).
    - deploy/config/edge/haproxy.cfg
    # One-time switch of the ACME store to ECDSA certificates (run below).
    - deploy/config/traefik/acme-ec-migrate.sh

# CA copy is best-effort: many OVH plans don't pin a CA, but if you DO drop
# the .pem at infra/files/ovh-pg-ca.pem we honour it. `failed_when: false`
# (not `ignore_errors: true`) keeps ansible-lint happy.
- name: Sync OVH managed-PG CA cert (if present in infra/files/)
  ansible.builtin.copy:
    src: "{{ ovh_pg_ca_local_path }}"
    dest: "{{ ovh_pg_ca_remote_path }}"
    owner: "{{ markoto_user }}"
    group: "{{ markoto_user }}"
    # A CA certificate is public. Readable by the unprivileged backup user
    # (uid 70) so pg_dump can verify the managed Postgres.
    mode: "0644"
  when: ovh_pg_host | length > 0
  failed_when: false

# The template renders the legal surfaces on; the app would crash-loop
# without these, after the running stack was already replaced.
- name: Require the legal-page operator identity
  ansible.builtin.assert:
    that:
      - nuxt_legal_controller_address | default('') | trim | length > 0
      - nuxt_legal_represented_by | default('') | trim | length > 0
    fail_msg: >-
      Set nuxt_legal_controller_address and nuxt_legal_represented_by
      (group_vars/all.yml): the legal pages need a postal address and the
      authorised representative.

# One renderer for both deploy paths: infra/render-env.sh, run here on the
# control node with every input it lists (`--keys`) taken from the Ansible
# variable of the same name in lower case (group_vars + vault; unset = empty,
# so its own defaults and required checks apply exactly as in deploy.yml).
- name: List the .env inputs
  ansible.builtin.command:
    cmd: bash {{ markoto_repo_root }}/infra/render-env.sh --keys
  delegate_to: localhost
  become: false
  register: markoto_env_keys
  changed_when: false

- name: Render .env
  ansible.builtin.command:
    cmd: bash {{ markoto_repo_root }}/infra/render-env.sh
  delegate_to: localhost
  become: false
  environment: "{{ markoto_env_inputs }}"
  vars:
    markoto_env_inputs: >-
      {%- set inputs = {} -%}
      {%- for key in markoto_env_keys.stdout_lines -%}
      {%- set _ = inputs.update({key: lookup('vars', key | lower, default='') | string}) -%}
      {%- endfor -%}
      {{ inputs }}
  register: markoto_env_rendered
  changed_when: false
  no_log: true

- name: Write .env
  ansible.builtin.copy:
    content: "{{ markoto_env_rendered.stdout }}\n"
    dest: "{{ markoto_root }}/.env"
    owner: "{{ markoto_user }}"
    group: "{{ markoto_user }}"
    mode: "0600"
  no_log: true
  register: markoto_env_render

# LiteLLM loads its config only at boot, and its single-file bind mounts
# keep the old file after the copy above replaced it. The hash feeds a
# label on the litellm service, so a changed config recreates it on
# `compose up` (deploy/compose/compose.base.yml). markoto-compose computes
# the same value itself; passed explicitly so this play's intent is visible.
- name: Hash the LiteLLM config files
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      cat deploy/config/litellm/config.yaml deploy/config/litellm/custom_handlers.py
      | sha256sum | cut -c1-16
    chdir: "{{ markoto_root }}"
    executable: /bin/bash
  register: markoto_litellm_config_hash
  changed_when: false

- name: Read the tag of the last successful deploy
  ansible.builtin.slurp:
    src: "{{ markoto_root }}/.last-deploy"
  register: markoto_last_deploy
  failed_when: false

# Compose runs as markoto against its Podman socket, in markoto_root, whose
# .env names the stack (COMPOSE_FILE) and the Postgres profile.
- name: Compose pull (refresh images per IMAGE_TAG)
  ansible.builtin.command:
    cmd: /usr/local/bin/markoto-compose pull --quiet
  become: true
  become_user: "{{ markoto_user }}"
  changed_when: false

# Certificates issued with RSA keys keep them on every renewal (lego reuses
# the stored key): a store that still holds one is set aside once, with
# Traefik stopped, so it requests ECDSA certificates on its next start
# (deploy/config/traefik/acme-ec-migrate.sh). Exit 10 = non-ECDSA keys found.
- name: Check the ACME store for non-ECDSA certificates
  ansible.builtin.command:
    cmd: sh deploy/config/traefik/acme-ec-migrate.sh check traefik/acme.json
    chdir: "{{ markoto_root }}"
  become: true
  become_user: "{{ markoto_user }}"
  register: markoto_acme_check
  changed_when: false
  failed_when: markoto_acme_check.rc not in [0, 10]

- name: Stop Traefik before its store is set aside
  ansible.builtin.command:
    cmd: /usr/local/bin/markoto-compose rm -sf traefik
  become: true
  become_user: "{{ markoto_user }}"
  when: markoto_acme_check.rc == 10
  changed_when: true

- name: Set the RSA certificate store aside
  ansible.builtin.command:
    cmd: sh deploy/config/traefik/acme-ec-migrate.sh rotate traefik/acme.json
    chdir: "{{ markoto_root }}"
  become: true
  become_user: "{{ markoto_user }}"
  when: markoto_acme_check.rc == 10
  changed_when: true

- name: Compose up -d (apply current state)
  ansible.builtin.command:
    cmd: /usr/local/bin/markoto-compose up -d --remove-orphans
  become: true
  become_user: "{{ markoto_user }}"
  environment:
    LITELLM_CONFIG_HASH: "{{ markoto_litellm_config_hash.stdout }}"
  register: markoto_compose_up
  changed_when: >-
    ('Recreate' in markoto_compose_up.stderr)
    or ('Creat' in markoto_compose_up.stderr)
    or ('Started' in markoto_compose_up.stderr)

- name: Wait for /api/health to return 200
  ansible.builtin.uri:
    url: "{{ health_endpoint }}"
    method: GET
    status_code: 200
    timeout: 10
    validate_certs: true
  register: markoto_health_probe
  retries: "{{ (health_timeout_seconds / 5) | int }}"
  delay: 5
  until: markoto_health_probe.status == 200
  # Soft-fail: print diagnostics on miss, don't crash whole play.
  failed_when: false

- name: Surface health-probe diagnostics on miss
  ansible.builtin.debug:
    msg: >-
      /api/health did not return 200 within {{ health_timeout_seconds }}s.
      Check `make logs` and `markoto-compose ps` (as {{ markoto_user }}). The
      probe is non-fatal so that re-runs against a partially-deployed stack
      still succeed.
  when: markoto_health_probe.status != 200

- name: Record the deployed tag for the next rollback (.last-deploy)
  ansible.builtin.copy:
    dest: "{{ markoto_root }}/.last-deploy"
    content: "{{ image_tag }}\n"
    owner: "{{ markoto_user }}"
    group: "{{ markoto_user }}"
    mode: "0640"
  when: markoto_health_probe.status == 200

# Keep the running images and the previous release's (a rollback should not
# need a registry round trip); everything else of ours goes, plus dangling
# layers (e.g. a moved `latest`). Third-party images stay unless dangling.
- name: Prune images no deploy needs any more
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      podman images --format '{{ '{{' }}.Repository{{ '}}' }}:{{ '{{' }}.Tag{{ '}}' }}' \
        | awk -F: -v cur='{{ image_tag }}' -v prev='{{ markoto_prev_tag }}' \
            '/\/markoto-[a-z]+:[^:]+$/ && $NF != cur && $NF != prev' \
        | xargs -r podman rmi > /dev/null 2>&1 || true
      podman image prune -f > /dev/null
    executable: /bin/bash
  vars:
    markoto_prev_tag: "{{ (markoto_last_deploy.content | default('') | b64decode | trim) or 'none' }}"
  become: true
  become_user: "{{ markoto_user }}"
  environment:
    XDG_RUNTIME_DIR: /run/user/{{ ansible_facts.getent_passwd[markoto_user][1] }}
  when: markoto_health_probe.status == 200
  changed_when: false

- name: Append deploy marker to deploys.log
  ansible.builtin.lineinfile:
    path: "{{ markoto_root }}/deploys.log"
    line: >-
      {{ ansible_date_time.iso8601 }}
      image_tag={{ image_tag }}
      health={{ markoto_health_probe.status | default('?') }}
    create: true
    owner: "{{ markoto_user }}"
    group: "{{ markoto_user }}"
    mode: "0640"

# Opportunistic boot diagnostic: read-only, soft-fail.
- name: Tail last 50 app log lines (boot-cleanly check)
  ansible.builtin.command:
    cmd: /usr/local/bin/markoto-compose logs --tail=50 app
  become: true
  become_user: "{{ markoto_user }}"
  register: markoto_app_logs
  changed_when: false
  failed_when: false

- name: Surface app-log tail (truncated)
  ansible.builtin.debug:
    msg: "{{ markoto_app_logs.stdout_lines[-15:] | default([]) }}"
  when: markoto_app_logs.stdout_lines is defined
