[defaults]
# No default inventory: the Makefile passes -i inventories/$(ENV)/hosts.ini.
# Galaxy roles install to ./collections/ansible_roles by Makefile convention so
# the tree is self-contained (no implicit ~/.ansible/roles dependency in CI).
roles_path = roles:collections/ansible_roles
collections_path = collections
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
deprecation_warnings = False
interpreter_python = auto_silent
forks = 5
timeout = 30

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
