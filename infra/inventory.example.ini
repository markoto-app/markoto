# markoto Ansible inventory: copy to inventory.ini and fill in YOUR.VPS.IP.HERE.
#
# Target: a fresh Debian 13 (trixie) VPS. Ansible connects as the image's
# admin user (`debian` on OVH and the Debian cloud images: sudo without a
# password, root login disabled) and becomes root. The stack itself runs as
# the unprivileged `markoto` user that provision.yml creates (rootless
# Podman, no sudo); GitHub Actions deploys log in as that user.

[markoto]
markoto_prod ansible_host=YOUR.VPS.IP.HERE ansible_user=debian ansible_python_interpreter=/usr/bin/python3

[markoto:vars]
# Override on the CLI with `-e ansible_ssh_private_key_file=...` if your key
# isn't at the default ~/.ssh/id_ed25519 / id_rsa.
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts'
