# markoto Ansible inventory: copy to inventory.ini and fill in YOUR.VPS.IP.HERE.
#
# We provision as root (OVH images ship with root SSH + no sudo user). The
# `base` role creates an unprivileged `markoto` user; after `make provision`
# you can switch ansible_user to `markoto` if you prefer least-privilege re-runs
# (the playbooks still `become: true` for sudo).

[markoto]
markoto_prod ansible_host=YOUR.VPS.IP.HERE ansible_user=root ansible_python_interpreter=/usr/bin/python3

[markoto:vars]
# Override on the CLI with `-e ansible_ssh_private_key_file=...` if your key
# isn't at the default ~/.ssh/id_ed25519 / id_rsa.
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts'
