---
# Galaxy collections + roles needed by the markoto deploy.
# `make requirements` installs both via `ansible-galaxy install -r requirements.yml`.

collections:
  - name: community.general
    version: ">=8.0.0"
  - name: ansible.posix
    version: ">=1.5.4"
  # CIS-aligned OS hardening (sysctl, file perms, login restrictions, kernel
  # module bans). Pinned exact: every minor bump can shift the sysctl baseline,
  # which we'd rather audit than absorb silently.
  - name: devsec.hardening
    version: "10.5.2"

roles:
  # Geerling's security role wires unattended-upgrades + reboot windows on
  # Debian/Ubuntu. We disable its SSH bits (devsec.hardening + our
  # ssh_hardening role already cover those) and its fail2ban bits (we
  # template our own jail). Pinned exact: apt-touching roles drift.
  - name: geerlingguy.security
    version: "3.0.0"
