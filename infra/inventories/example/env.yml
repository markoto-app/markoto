---
# Non-secret values of ONE environment; they override group_vars/all.yml
# (loaded after it by every playbook). Secrets: vault.yml next to this file,
# from group_vars/all.vault.example.yml, encrypted with this environment's
# .vault-password.
domain: markoto.example.org
acme_email: ops@example.org
registry: ghcr.io/markoto-app
image_tag: latest
# Managed Postgres (prod): the cluster host. Empty = the bundled Postgres
# container (staging).
ovh_pg_host: ""
# Required only for `make deploy` (the GitHub workflow takes them from the
# Environment): published pages' own host and the legal-page identity.
nuxt_publish_pages_host: ""
nuxt_legal_controller_address: ""
nuxt_legal_represented_by: ""
