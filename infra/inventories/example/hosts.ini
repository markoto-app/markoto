# markoto Ansible inventory for ONE environment. Copy this directory:
#   cp -r inventories/example inventories/staging    (or prod)
# and fill in the host. Everything in inventories/<env>/ except this
# example is git-ignored: hosts.ini, env.yml, vault.yml, .vault-password.
#
# Target: a fresh Debian 13 (trixie) VPS. Ansible connects as the image's
# admin user (`debian` on OVH and the Debian cloud images: sudo without a
# password, root login disabled) and becomes root. The stack itself runs as
# the unprivileged `markoto` user that provision.yml creates (rootless
# Podman, no sudo); GitHub Actions deploys log in as that user.
#
# markoto_deploy_pubkey: public half of this environment's deploy key (the
# DEPLOY_SSH_KEY secret of its GitHub Environment), markoto's only key.
# Host variables here lose against group_vars/all.yml (a play vars_file):
# set only what that file does not define; other values go in env.yml.

[markoto]
markoto_host ansible_host=YOUR.VPS.IP.HERE ansible_user=debian ansible_python_interpreter=/usr/bin/python3 markoto_deploy_pubkey="ssh-ed25519 AAAA... markoto-deploy-<env>"

[markoto:vars]
# Your admin key for `debian`, if not the default ~/.ssh/id_ed25519:
# ansible_ssh_private_key_file=~/.ssh/markoto_<env>
ansible_ssh_common_args='-o StrictHostKeyChecking=yes'
