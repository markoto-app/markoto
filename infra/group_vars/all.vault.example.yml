---
# Vault template: copy to inventories/<env>/vault.yml, fill in, then:
#   ansible-vault encrypt inventories/<env>/vault.yml --vault-password-file=inventories/<env>/.vault-password
#
# Every value below is an input of infra/render-env.sh (which renders the
# .env file the compose stack reads): the variable name is the .env key in
# lower case (`bash infra/render-env.sh --keys` lists them all). Missing
# required values fail the playbook at render time, not at compose-up time.
#
# Generation hints inline. Re-read the operator runbook, kept outside this repository before rotating
# anything tagged "never-rotate" (the backup gpg passphrase in particular).

# ─── App secrets (≥32 chars; openssl rand -hex 32) ───
nuxt_session_password: "REPLACE_ME"        # openssl rand -base64 48
nuxt_jwt_secret: "REPLACE_ME"              # openssl rand -hex 64
nuxt_internal_api_secret: "REPLACE_ME"     # openssl rand -hex 32
# Encrypts stored provider keys / SSO secrets; never rotate without _previous.
nuxt_encryption_key: "REPLACE_ME"          # openssl rand -hex 32
nuxt_altcha_hmac_key: "REPLACE_ME"         # openssl rand -hex 32, anonymous gate (ALTCHA bot check)
nuxt_markitdown_api_secret: "REPLACE_ME"   # openssl rand -hex 32, app <-> markitdown converter

# Optional rotation slots: leave empty unless mid-rollover.
nuxt_jwt_secret_previous: ""
nuxt_internal_api_secret_previous: ""
nuxt_encryption_key_previous: ""

# ─── Postgres / Valkey credentials ───
postgres_password: "REPLACE_ME"            # ≥24 chars
valkey_password: "REPLACE_ME"              # ≥32 chars; openssl rand -hex 32

# ─── External S3 (OVH Object Storage / Infomaniak / R2 / etc.) ───
nuxt_s3_endpoint: "REPLACE_ME"             # e.g. https://s3.gra.io.cloud.ovh.net  # noqa: yaml[line-length]
nuxt_s3_access_key: "REPLACE_ME"
nuxt_s3_secret_key: "REPLACE_ME"
nuxt_s3_bucket: "REPLACE_ME"

# ─── Backup storage (optional; defaults to the nuxt_s3_* values above) ───
# Set these to a dedicated bucket with its own backup-only key
# (the operator runbook, kept outside this repository). Only the backup sidecar receives them.
# backup_s3_endpoint: "https://s3.example.com"
# backup_s3_bucket: "markoto-backups"
# backup_s3_access_key: "REPLACE_ME"
# backup_s3_secret_key: "REPLACE_ME"
# backup_s3_region: "us-east-1"
# backup_s3_prefix: "backups/postgres"

# ─── AI dictate JWT ───
# Optional dedicated dictation-JWT secret. Empty falls back to nuxt_jwt_secret.
nuxt_ai_dictate_jwt_secret: ""

# ─── LiteLLM proxy (self-hosted AI gateway) ───
litellm_master_key: "REPLACE_ME"           # openssl rand -hex 32, prefix "sk-" optional
litellm_salt_key: "REPLACE_ME"             # openssl rand -hex 32 (encrypts key tokens at rest, NEVER rotate casually)

# ─── AI provider keys (all EU-resident providers) ───
staan_api_key: "REPLACE_ME"                # staan.ai, web_search + fetch_url (enable EU-only routing in the dashboard)
mistral_api_key: "REPLACE_ME"              # mistral.ai, text + voice + knowledge-base embeddings
bfl_api_key: "REPLACE_ME"                  # blackforestlabs, image generation

# ─── Stripe billing: ONLY needed once nuxt_billing_enabled is true ───
# Billing is off by default (free-only + "paid plans coming soon"); leave
# these empty ("") until paid plans launch. Then: test keys for staging,
# live keys for prod.
nuxt_stripe_secret_key: ""                 # sk_live_… / sk_test_…
nuxt_stripe_webhook_secret: ""             # whsec_… from the deployed webhook endpoint (NOT `stripe listen`)
nuxt_stripe_price_ids: ""                  # optional: markoto_pro_month_eur=price_…,… (default: Stripe lookup keys)

# ─── OAuth (optional pairs: both-or-neither per provider) ───
nuxt_oauth_github_client_id: ""
nuxt_oauth_github_client_secret: ""
nuxt_oauth_google_client_id: ""
nuxt_oauth_google_client_secret: ""

# ─── Sentry (optional) ───
nuxt_public_sentry_dsn: ""
sentry_dsn: ""

# ─── Backup encryption (NEVER-ROTATE: see the operator runbook, kept outside this repository) ───
# openssl rand -base64 48
# Copy this value into your password manager BEFORE any rotation:
# rotating invalidates every backup taken under the old passphrase.
backup_gpg_passphrase: "REPLACE_ME"

# ─── GitHub Container Registry (private image pull) ───
# Optional: only while the images in ghcr.io/markoto-app are private. A
# fine-grained or classic PAT with `read:packages` ONLY (no write, no
# contents access). The markoto role writes it to the markoto user's
# ~/.docker/config.json (0600), which Docker Compose and Podman both read.
# Same values as the GHCR_PULL_USER variable / GHCR_PULL_TOKEN secret of the
# GitHub Environment. Empty = leave the host's registry login unchanged.
# Rotation: see the operator runbook, kept outside this repository.
ghcr_pull_user: ""                      # the GitHub user that issued the PAT
ghcr_pull_token: ""                     # PAT, scope: read:packages

# ─── Apprise unified notifications ───
# Semicolon-separated Apprise URLs. The base role drops these into
# /etc/markoto/apprise.env (mode 0600) and the markoto-notify wrapper
# uses them. Same value as the `APPRISE_URLS` GitHub secret.
# Examples (mix and match):
#   tgram://botToken/chatId
#   mailto://user:pass@smtp.example.com
#   slack://token@workspace/channel
apprise_urls: ""
