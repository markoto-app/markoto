---
# Non-secret defaults for the markoto stack. Override per-host in inventory or
# group_vars/<group>.yml. Every secret lives in group_vars/all.vault.yml
# (ansible-vault encrypted).

# ─── Domain + ACME ───
domain: example.com
acme_email: you@example.com

# ─── Image registry (GHCR) ───
registry: ghcr.io/markoto-app
image_tag: latest

# ─── Billing mode (see shared/config/billingMode.ts) ───
# The hosted deployment runs free-only with paid plans shown as "coming
# soon" + a waitlist. Set nuxt_billing_enabled: true (and the Stripe vars
# in all.vault.yml) to launch paid plans.
nuxt_billing_enabled: false
nuxt_plans_coming_soon: true

# ─── Legal pages (shared/legal/entity.ts) ───
# The rendered stack runs with the legal surfaces on, so these two are
# required (the app refuses to boot without them); every other
# nuxt_legal_* value (controller_name, privacy_contact_email,
# abuse_contact_email, governing_law, legal_form, registered_office, uid,
# ch_id, ehra_id) is optional and falls back to the code default.
nuxt_legal_controller_address: ""
nuxt_legal_represented_by: ""
# Comma-separated emails promoted to instance admin at their next sign-in.
nuxt_admin_user_emails: ""
# Hostname that serves published pages, separate from the app (e.g. pages.example.org). Required.
nuxt_publish_pages_host: ""

# ─── Backup sidecar tunables ───
backup_interval_seconds: 86400
backup_retention_count: 30

# ─── Postgres / S3 / OAuth knobs (non-secret) ───
postgres_user: markoto
postgres_db: markoto
postgres_host: "{{ ovh_pg_host | default('postgres') }}"
postgres_port: "{{ ovh_pg_port | default(5432) }}"

valkey_db: 0

s3_endpoint: "{{ ovh_s3_endpoint | default('') }}"
s3_bucket: "{{ ovh_s3_bucket | default('') }}"

# Set to a managed-PG hostname when using OVH/Aiven/etc. Empty string keeps
# the bundled in-stack postgres service active.
ovh_pg_host: ""
ovh_pg_port: 5432

# OVH managed PG CA: drop the .pem at infra/files/ovh-pg-ca.pem and the
# markoto role will copy it in + bind-mount it. Empty string disables.
ovh_pg_ca_local_path: "files/ovh-pg-ca.pem"
ovh_pg_ca_remote_path: /opt/markoto/secrets/ovh-pg-ca.pem

# Path on the VPS where the stack lives (owned by markoto_user).
markoto_root: /opt/markoto
# The unprivileged account that owns and runs the stack on rootless Podman
# (no sudo, no password; SSH only with the deploy key below). Ansible itself
# connects as the image's admin user (inventory ansible_user, `debian`).
markoto_user: markoto
# Public half of the GitHub deploy key (the DEPLOY_SSH_KEY secret of the
# staging / prod Environment). Installed as markoto_user's ONLY authorized
# key, with `restrict` (no forwarding, no pty). Empty = no SSH login for
# markoto_user (Ansible deploys still work through the admin user).
markoto_deploy_pubkey: ""

# ─── Container engine (roles/podman_host) ───
# Docker Compose, standalone binary, driving the user's Podman socket
# (Debian's docker-compose package is 2.x; the compose files need >= 5).
# Bump: new version + both checksums from the release's *.sha256 files.
compose_version: "5.7.0"
compose_sha256:
  x86_64: 7758048ad38e580f22559603312874fec8bb638d021a9e64182385fc17cc12a2
  aarch64: 15861535d14e26555736b49376c95e14bfd94285366c8446bfac7156a972e76f
# Lowest port an unprivileged process may bind on the host: edge-proxy
# (deploy/compose/compose.prod.yml) binds 80 and 443 as the rootless user.
unprivileged_port_start: 80
# Subordinate uid/gid range for markoto_user, used only when useradd did not
# allocate one (it normally does). Must not overlap another user's range.
markoto_subid_start: 2000000
markoto_subid_count: 65536

# Daily belt-and-braces backup (roles/backup_timer), systemd calendar
# syntax. 04:30 UTC is the unattended-upgrades reboot window, keep clear.
backup_timer_oncalendar: "*-*-* 03:00:00 UTC"
# Repo root on the control machine (playbooks live in infra/playbooks/), the
# source of the compose files + bind-mounted config the markoto role syncs.
markoto_repo_root: "{{ playbook_dir }}/../.."

# Healthcheck poll knobs.
health_endpoint: "https://{{ domain }}/api/health"
# 300 s, like deploy.yml: a cold LiteLLM boot runs its Prisma migrations
# before turning healthy, and `app` waits for it.
health_timeout_seconds: 300

# Timezone: UTC across the fleet keeps log correlation sane.
host_timezone: UTC
