# Test-only infrastructure. Mirrors docker-compose.dev.yml but on isolated
# ports and a disposable volume so the dev database is never touched.
#
# Two use cases share this compose file via `profiles`:
#
#   1) Integration tests (vitest) — postgres + valkey + seaweedfs + stripe-mock.
#      These services have NO profile, so they start by default with `up -d`.
#
#   2) Flow tests (Playwright) — also need sync (Hocuspocus) + markitdown.
#      These are gated behind `profiles: [flows]` so integration runs don't
#      pay the extra build/startup cost. Pull them in with `--profile flows`.
#
# Integration:
#   bun run test:integration:up      # postgres + valkey + seaweedfs + stripe-mock
#   bun run test:integration         # vitest run --project=integration
#   bun run test:integration:down
#
# Flows:
#   bun run flows:up                 # adds sync + markitdown to the above
#   bun run flows:test:ephemeral     # full lifecycle (up, dev server, run, down)
#   bun run flows:down
#
# Ports shifted from dev (5432/6379/8333/4001/8080) to (5433/6380/8334/4002/8081)
# so dev + test stacks can run simultaneously. Test DB name is ypad_test —
# integration tests refuse to run against any other name as a belt-and-braces
# guard against running TRUNCATEs on a dev database.

services:
  postgres-test:
    # pgvector/pgvector:pg16 mirrors dev/prod so schema migrations
    # (which enable the vector extension) apply cleanly here too.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=ypad
      - POSTGRES_PASSWORD=testpassword
      - POSTGRES_DB=ypad_test
    # tmpfs for the data dir: every container restart = clean slate. Tests
    # still TRUNCATE between cases for speed, but if a test suite crashes
    # mid-run a simple `down -v && up -d` gives you a pristine state.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ypad -d ypad_test"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
    ports:
      - "5433:5432"

  valkey-test:
    image: valkey/valkey:8-alpine@sha256:1cb6b20b70d927560cc4cc5397b5f045e74aa603ff7696274778880bb6fadc75
    restart: unless-stopped
    # No AOF — tests want a blank slate every boot.
    command: ["valkey-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    ports:
      - "6380:6379"

  seaweedfs-test:
    image: chrislusf/seaweedfs@sha256:854479eebcbc0060d803edb27b3bd88a0552e23fde08a26a6482e59aff887a77
    restart: unless-stopped
    command: >
      server -s3
      -ip=seaweedfs-test -ip.bind=0.0.0.0
      -dir=/data -s3.config=/etc/seaweedfs/s3.json -s3.port=8333
    ports:
      - "8334:8333"
    tmpfs:
      - /data
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Official Stripe mock server. Implements Stripe's full REST API
  # surface from their OpenAPI spec, so our code can use the real SDK
  # unchanged — it just talks to `stripe-mock:12111` instead of
  # `api.stripe.com`. The mock returns well-formed fixtures with stable
  # IDs; it does NOT emit webhooks (we test those via hand-crafted
  # fixtures + signed payloads directly against our webhook handler).
  stripe-mock:
    image: stripe/stripe-mock:latest
    restart: unless-stopped
    ports:
      - "12111:12111"
    # No healthcheck available (image has no shell + no curl); port
    # 12111 is up as soon as the process binds, which is near-instant.

  # ─── Flow-test extras (profile: flows) ─────────────────────────────
  # Sync server + markitdown converter, only spun up when running
  # Playwright flow tests. Integration tests don't need either:
  # vitest doesn't open WS connections to Hocuspocus, and document
  # imports are exercised at the API level with mocked responses.

  sync-test:
    build:
      context: .
      dockerfile: sync-server/Dockerfile
    profiles: ["flows"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - PORT=4001
      - DATABASE_URL=postgres://ypad:testpassword@postgres-test:5432/ypad_test
      - JWT_SECRET=test-jwt-secret-isolated-from-dev-and-prod-stacks-64char
      - INTERNAL_API_SECRET=test-internal-api-secret-isolated
      # Sync server reaches the Nuxt app on host for activity logging.
      # Flows run the app on host port 3001 (see flows-ephemeral.ts).
      - APP_URL=http://host.docker.internal:3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4002:4001"
    depends_on:
      postgres-test:
        condition: service_healthy
    healthcheck:
      # bun base image lacks curl; use bun's built-in fetch instead.
      test: ["CMD", "bun", "-e", "fetch('http://localhost:4001/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  markitdown-test:
    build: ./markitdown-server
    profiles: ["flows"]
    restart: unless-stopped
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s
