name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended questions or early ideas, [Discussions](https://github.com/joelbarmettlerUZH/markoto.app/discussions) is the better place. Use this form for a concrete proposal.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor and markdown
        - Preview, themes and PDF
        - Collaboration, comments and history
        - Workspaces and knowledge base
        - AI assistant
        - MCP server
        - Self-hosting and operations
        - Documentation
        - Other
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation where markoto falls short. The problem matters more than the proposed solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? Sketches, examples from other tools and markdown snippets are welcome.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
    validations:
      required: false
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would be willing to work on this (see CONTRIBUTING.md).
          required: false
