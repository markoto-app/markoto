name: sonar-baseline

# Main-branch SonarQube Cloud baseline. PR analysis lives inside
# ci.yml's `sonar` job (which reuses coverage from the existing test
# pipeline). This workflow only fires on push to main, where ci.yml
# does NOT run — without a main-branch scan, Sonar's "new code" period
# detection regresses to "everything is new" on every PR.
#
# Required GH secret: SONAR_TOKEN (see docs/GITHUB-CONFIG.md).

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sonar-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ci.yml's `lint-typecheck` job only runs on `pull_request` events — a
  # direct push to main (or a force-merge that bypasses PR review) lands
  # without ever exercising eslint or the typechecker. This main-branch
  # baseline workflow plugs that gap: we re-run the same gates here so a
  # push that introduces lint or type errors fails the workflow + fires
  # an Apprise notify, even if it never went through a PR.
  lint-typecheck:
    name: lint-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck

  sonar:
    name: sonar
    needs: lint-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # See ci.yml for the rationale — sync-server has its own deps that
      # vitest's coverage.all instruments at runtime.
      - name: Install sync-server dependencies
        run: bun install --frozen-lockfile
        working-directory: sync-server

      - name: Bring up test Postgres + Valkey
        run: bun run test:integration:up

      - name: Run coverage suite
        run: bun run test:coverage:fast

      - name: Tear down test stack
        if: always()
        run: bun run test:integration:down

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  notify-on-failure:
    name: notify-on-failure
    needs: [lint-typecheck, sonar]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Apprise
        run: pip install apprise

      - name: Send Apprise notification
        env:
          APPRISE_URLS: ${{ secrets.APPRISE_URLS }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${APPRISE_URLS:-}" ]; then
            echo "APPRISE_URLS secret not configured — skipping notification."
            exit 0
          fi
          apprise -t "Sonar baseline failed on main" \
                  -b "Commit \`${COMMIT_SHA}\`
          Run: ${RUN_URL}" \
                  -i markdown \
                  "${APPRISE_URLS}"
