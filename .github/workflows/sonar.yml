name: sonar

# SonarQube Cloud (formerly SonarCloud) static analysis.
#
# Runs on:
#   - pull_request   → branch + PR decoration. Sonar comments the PR.
#   - push to main   → updates the long-lived baseline used to compute
#                      "new code" deltas on subsequent PRs.
#
# Coverage source: `bun run test:coverage:fast` — unit + dom + nuxt +
# repos projects. Integration coverage is architecturally unrecoverable
# (subprocess invisible to c8 — see AGENTS.md §10), so we don't try.
# The repos project needs the test Postgres; we bring up the lean test
# stack (no flows profile) to keep this job under ~5 min.
#
# Project key + scan parameters live in sonar-project.properties.
# Required GH secret: SONAR_TOKEN (see docs/GITHUB-CONFIG.md).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: sonar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history → accurate blame + new-code period detection.
          # Sonar warns and falls back to "everything is new" without it.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bring up test Postgres + Valkey
        run: bun run test:integration:up

      - name: Run coverage suite
        run: bun run test:coverage:fast

      - name: Tear down test stack
        if: always()
        run: bun run test:integration:down

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
