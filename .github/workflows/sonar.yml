name: sonar-baseline

# Main-branch SonarQube Cloud baseline. PR analysis lives inside
# ci.yml's `sonar` job (which reuses coverage from the existing test
# pipeline). Without a periodic main-branch scan, Sonar's "new code"
# period detection regresses to "everything is new" on every PR.
#
# Runs on a WEEKLY cron (+ manual dispatch after a big merge batch), not
# on every main push — the ~10-min run (coverage suite + scan) on every
# merge was a real Actions-budget line item, and baseline freshness only
# affects the "new code" window, not correctness. main is strictly
# PR-only (repository ruleset), so ci.yml's lint/typecheck/migration
# gates have already run for every commit that can land here.
#
# Secrets: SONAR_TOKEN (repo-level, see docs/GITHUB-CONFIG.md for why) and
# APPRISE_URLS from the main-only `release` Environment (failure ping).

on:
  schedule:
    # Monday 05:20 UTC — before the work week starts.
    - cron: '20 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sonar-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: sonar
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_MODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # See ci.yml for the rationale — sync-server has its own deps that
      # vitest's coverage.all instruments at runtime.
      - name: Install sync-server dependencies
        run: bun install --frozen-lockfile
        working-directory: sync-server

      - name: Bring up test Postgres + Valkey
        run: bun run test:integration:up

      - name: Run coverage suite
        run: bun run test:coverage:fast

      - name: Tear down test stack
        if: always()
        run: bun run test:integration:down

      - name: Require SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error title=Missing secret::SONAR_TOKEN is not set (repo-level Actions secret, see docs/GITHUB-CONFIG.md)."
            exit 1
          fi

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  notify-on-failure:
    name: notify-on-failure
    needs: [sonar]
    if: failure()
    permissions: {}
    # Main-only Environment that holds APPRISE_URLS.
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Apprise
        run: pip install apprise==1.9.9

      - name: Send Apprise notification
        env:
          APPRISE_URLS: ${{ secrets.APPRISE_URLS }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${APPRISE_URLS:-}" ]; then
            echo "::warning title=Notification skipped::APPRISE_URLS is not set in the 'release' Environment (docs/GITHUB-CONFIG.md)."
            exit 0
          fi
          apprise -t "Sonar baseline failed on main" \
                  -b "Commit \`${COMMIT_SHA}\`
          Run: ${RUN_URL}" \
                  -i markdown \
                  "${APPRISE_URLS}"
