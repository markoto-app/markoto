name: staging-gate

# After a release builds images, deploy them to STAGING and run the PUBLIC
# smoke suite (tests/smoke) against the real deployment. This catches the
# class of prod-only drift the ephemeral flow gate structurally can't — Docker
# COPY gaps, insecure-context APIs, CSP, the mobile <dialog> collapse — every
# bug that shipped broken and was only found on staging.
#
# Flow:  merge of a release-labeled PR
#              → release.yml builds vX.Y.Z + latest images AND runs the full
#                flow suite incl. live-AI flows (provider keys live there —
#                the fast PR gate skips those, see ci.yml)
#              → THIS workflow verifies a release was actually published,
#                then deploys `latest` to staging (health-gated)
#              → resets the staging DB to a clean slate (public schema wiped,
#                drizzle migration ledger preserved) so runs don't bleed state
#              → smoke suite runs against https://staging.markoto.app
#              → red gate ⇒ nothing should be promoted to prod
#
# Prod promotion is intended to be AUTOMATIC off a green smoke run (retag the
# staging-verified image to prod + deploy + re-run smoke against prod with
# auto-rollback) — NOT a manual approval. That leg is left dormant until the
# prod VPS + a `prod` GitHub Environment exist; see the commented promote-prod
# job at the bottom. main stays strictly PR-only; this never pushes to main.

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy to staging'
        required: true
        default: latest
        type: string

permissions:
  contents: read
  # check-release reads the triggering release run's job list via the API
  # (GET /actions/runs/:id/jobs) — without actions:read the default token
  # gets "Resource not accessible by integration" (HTTP 403) and the gate
  # shows a red run instead of a clean skip on release:none merges.
  actions: read

concurrency:
  group: staging-gate
  cancel-in-progress: false

jobs:
  # A release run where the PR carried `release:none` (resolve-pr says
  # should_release=false) still CONCLUDES 'success' — every downstream job
  # just skips. Without this check, such merges would burn the full ~45-min
  # gate re-testing and re-deploying unchanged images. Query the triggering
  # run's jobs and only proceed when create-release actually succeeded.
  check-release:
    name: check a release was published
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      released: ${{ steps.probe.outputs.released }}
    steps:
      - name: Probe triggering release run for a published release
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          conclusion=$(gh api "/repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs" \
            --jq '.jobs[] | select(.name == "create-release") | .conclusion')
          echo "create-release concluded: ${conclusion:-<absent>}"
          if [ "$conclusion" = "success" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No release published by the triggering run (release:none merge) — gate skips."
          fi

  deploy-and-smoke:
    name: deploy-and-smoke (staging)
    # Gate: check-release verified the triggering run actually published a
    # release, which requires release.yml's run-flows job (the full suite
    # INCLUDING live-AI flows — the provider keys moved there) to have been
    # green on this exact commit. Re-running the same 40-min suite here
    # doubled the per-release Actions bill for zero extra signal, so the
    # gate now goes straight to deploy + the public smoke suite.
    needs: check-release
    if: needs.check-release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Binds the staging DEPLOY_HOST / DEPLOY_SSH_KEY secrets + DEPLOY_USER var.
    environment: staging
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'debian' }}
      TAG: ${{ inputs.tag || 'latest' }}
      STAGING_URL: https://staging.markoto.app
    steps:
      # Pin to the exact commit the triggering release was built from so
      # the compose files we sync below match the images we deploy. On
      # workflow_dispatch there is no triggering run — default-branch
      # HEAD is the right answer there.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # The host's compose files were otherwise only written at Ansible
      # provision time. Without this sync, a merged compose change (image
      # rename, new service, changed mount) NEVER reaches staging —
      # `pull && up -d` against the stale host copy silently no-ops and
      # the smoke suite "passes" against the previous release. Found the
      # hard way: the md-online-* → markoto-* image rename "deployed"
      # successfully twice while the app container kept serving the old
      # build. Synced set = the compose pair + every repo path the
      # compose files bind-mount (litellm config + handlers, postgres
      # init scripts).
      - name: Sync compose + mounted config to the host
        run: |
          set -euo pipefail
          # infra/postgres/init is deliberately NOT synced: the initdb
          # scripts only run on the FIRST boot of a fresh postgres data
          # dir (a provision-time concern), and the host copy is
          # root-owned from provisioning — the deploy user can't
          # overwrite it (tar: Permission denied). Changing an init
          # script requires an Ansible pass anyway.
          tar czf - \
            docker-compose.prod.yml \
            docker-compose.base.yml \
            infra/litellm/config.yaml \
            infra/litellm/custom_handlers.py \
            | ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" 'tar xzf - -C /opt/markoto'

      - name: Deploy tag to staging + health-check
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" TAG="$TAG" 'bash -se' <<'REMOTE'
          set -euo pipefail
          : "${TAG:?TAG must be set}"
          cd /opt/markoto
          export IMAGE_TAG="$TAG"
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          DOMAIN=$(awk -F= '/^DOMAIN=/{print $2}' .env | tr -d '"')
          [ -n "$DOMAIN" ] || { echo "DOMAIN not in .env"; exit 1; }
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 "https://${DOMAIN}/api/health" > /dev/null 2>&1; then
              echo "staging healthy on attempt $i"; ok=1; break
            fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo "staging health check failed after 90s"; exit 1; }
          REMOTE

      # Wipe staging to a clean slate so each smoke run starts from empty +
      # predictable state (no doc/rate-limit/sync-state bleed between runs).
      # Truncates the `public` schema only; the drizzle migration ledger lives
      # in a separate schema and is preserved. Guards on DOMAIN containing
      # "staging" — refuses to run against anything else.
      - name: Reset staging DB
        run: SSH_KEY="$HOME/.ssh/id_ed25519" ./scripts/reset-staging-db.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Smoke suite against staging
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.STAGING_URL }}
          CI: 'true'
        run: bun run smoke

      - name: Notify on failure
        if: failure()
        env:
          APPRISE_URLS: ${{ secrets.APPRISE_URLS }}
        run: |
          set -euo pipefail
          if [ -z "${APPRISE_URLS:-}" ]; then echo "no APPRISE_URLS configured"; exit 0; fi
          pip install apprise >/dev/null 2>&1 || true
          apprise -t "Staging gate FAILED (tag ${TAG})" \
                  -b "Deploy or smoke failed on staging — prod promotion is blocked. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                  "${APPRISE_URLS}" || true

  # ── promote-prod (DORMANT) ────────────────────────────────────────────────
  # Enable once the prod VPS + a `prod` GitHub Environment exist. Intended to
  # run AUTOMATICALLY on a green deploy-and-smoke — no manual approval:
  #
  #   promote-prod:
  #     name: promote-prod
  #     needs: deploy-and-smoke
  #     if: needs.deploy-and-smoke.result == 'success'
  #     runs-on: ubuntu-latest
  #     environment: prod          # DEPLOY_HOST/KEY + DEPLOY_USER for prod
  #     steps:
  #       - retag the staging-verified image → prod (or reuse the same tag)
  #       - ssh prod: IMAGE_TAG=<tag> compose pull && up  (health-gated,
  #         auto-rollback to previous tag on failure — same loop as deploy.yml)
  #       - re-run `bun run smoke` with PLAYWRIGHT_BASE_URL=https://<prod>
  #         → on failure, roll prod back and alert
  #
  # Rollback is CODE-only (flip the image tag); the DB is never restored. That
  # is safe because every migration is backward-compatible — enforced by the
  # migration-guard CI job (scripts/check-destructive-migrations.ts).
