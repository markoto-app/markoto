name: staging-gate

# After a release builds images, deploy them to STAGING and run the PUBLIC
# smoke suite (tests/smoke) against the real deployment. This catches the
# class of prod-only drift the ephemeral flow gate structurally can't: Docker
# COPY gaps, insecure-context APIs, CSP, the mobile <dialog> collapse: every
# bug that shipped broken and was only found on staging.
#
# Flow: release.yml builds the images and runs the full flow suite (incl.
# live-AI flows; provider keys live there). This workflow then verifies a
# release was published, deploys `latest` to staging via deploy.yml (renders
# .env from GitHub, health-gated, auto-rollback), clears the staging rate limits, and
# runs the smoke suite against https://staging.markoto.app. A red gate means
# nothing should be promoted to prod. It never pushes to main.

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy to staging'
        required: true
        default: latest
        type: string

# Least privilege: nothing by default, each job grants itself what it needs.
permissions: {}

concurrency:
  group: staging-gate
  cancel-in-progress: false

jobs:
  # A release run where the PR carried `release:none` (resolve-pr says
  # should_release=false) still CONCLUDES 'success': every downstream job
  # just skips. Without this check, such merges would re-deploy unchanged
  # images. Query the triggering
  # run's jobs and only proceed when create-release actually succeeded.
  check-release:
    name: check a release was published
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    # check-release reads the triggering release run's job list via the API
    # (GET /actions/runs/:id/jobs): without actions:read the default token
    # gets "Resource not accessible by integration" (HTTP 403) and the gate
    # shows a red run instead of a clean skip on release:none merges.
    permissions:
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      released: ${{ steps.probe.outputs.released }}
    steps:
      - name: Probe triggering release run for a published release
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          conclusion=$(gh api "/repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs" \
            --jq '.jobs[] | select(.name == "create-release") | .conclusion')
          echo "create-release concluded: ${conclusion:-<absent>}"
          if [ "$conclusion" = "success" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No release published by the triggering run (release:none merge), gate skips."
          fi

  # Deploy through the SAME path as a manual `deploy.yml` dispatch: render
  # /opt/markoto/.env from the staging GitHub Environment (infra/render-env.sh),
  # sync compose + mounted config, pull + up, 300 s cold-boot health budget,
  # one-hop auto-rollback. Rendering .env here is what makes new env vars
  # reach staging; a 90 s health budget is shorter than a cold LiteLLM
  # migration boot.
  deploy:
    name: deploy (staging)
    needs: check-release
    if: needs.check-release.outputs.released == 'true'
    # The called workflow's own permissions are capped by what is granted here.
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      tag: ${{ inputs.tag || 'latest' }}
      # Pin to the exact commit the triggering release was built from so
      # the compose files we sync match the images we deploy. On
      # workflow_dispatch there is no triggering run: default-branch
      # HEAD is the right answer there.
      ref: ${{ github.event.workflow_run.head_sha || github.ref }}
    # Required even though every secret deploy.yml reads lives only in the
    # `staging` Environment: a called workflow sees an environment secret
    # only when the caller passes it (by name or via inherit). Without
    # this the deploy runs with empty DEPLOY_* values. The
    # only repo-level secret (SONAR_TOKEN) is unused by deploy.yml.
    secrets: inherit

  smoke:
    name: smoke (staging)
    # Gate: check-release verified the triggering run actually published a
    # release, which requires release.yml's run-flows job (the full suite
    # INCLUDING live-AI flows) to have been green on this exact commit, so
    # the gate goes straight to deploy + the public smoke suite.
    needs: deploy
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Binds the staging DEPLOY_HOST / DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS /
    # APPRISE_URLS secrets + DEPLOY_USER var.
    environment: staging
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'markoto' }}
      TAG: ${{ inputs.tag || 'latest' }}
      STAGING_URL: https://staging.markoto.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # Pinned host keys + strict checking (also used by reset-staging-db.sh).
      - name: Configure SSH (pinned host keys)
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      # Clear Valkey only (rate-limit counters, sync state), so two releases
      # within an hour cannot trip the anonymous limits during the smoke run.
      # Postgres stays: staging holds signed-in test accounts and their
      # Stripe sandbox links, and the smoke suite only uses the public,
      # anonymous surface. A full wipe is still `scripts/reset-staging-db.sh`
      # by hand. Guards on DOMAIN containing "staging".
      - name: Reset staging rate limits
        run: SSH_KEY="$HOME/.ssh/id_ed25519" RESET_SCOPE=valkey ./scripts/reset-staging-db.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: node_modules/.bin/playwright install --with-deps chromium

      - name: Smoke suite against staging
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.STAGING_URL }}
          CI: 'true'
        run: bun run smoke

      - name: Notify on failure
        if: failure()
        env:
          APPRISE_URLS: ${{ secrets.APPRISE_URLS }}
        run: |
          set -euo pipefail
          if [ -z "${APPRISE_URLS:-}" ]; then echo "::warning title=Notification skipped::APPRISE_URLS is not set in the staging Environment (the operator runbook, kept outside this repository)"; exit 0; fi
          pip install --only-binary=:all: apprise==1.9.9 >/dev/null 2>&1 || true
          apprise -t "Staging gate FAILED (tag ${TAG})" \
                  -b "Smoke suite failed on staging (deploy.yml notifies deploy failures itself), prod promotion is blocked. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                  "${APPRISE_URLS}" || true

  # promote-prod (dormant)
  # Enable once the prod VPS + a `prod` GitHub Environment exist. Intended to
  # run AUTOMATICALLY on a green smoke (no manual approval): deploy the
  # staging-verified tag to prod with the same health-gated, auto-rollback
  # loop as deploy.yml, then re-run `bun run smoke` with
  # PLAYWRIGHT_BASE_URL=https://<prod> and roll back on failure.
  #
  # Rollback is CODE-only (flip the image tag); the DB is never restored. That
  # is safe because every migration is backward-compatible: enforced by the
  # migration-guard CI job (scripts/check-destructive-migrations.ts).
