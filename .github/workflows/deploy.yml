name: deploy

# Manual deploy dispatcher (see `on:` below: NOT event-triggered). SSHes
# to the VPS as the unprivileged `markoto` user, pulls the requested tag,
# runs the stack on that user's rootless Podman (markoto-compose, installed
# by infra/playbooks/provision.yml), polls /api/health, auto-rollbacks on
# failure, sends Apprise notifications either way.
#
# Required secrets, all scoped to the target Environment (staging / prod; see
# the operator runbook, kept outside this repository):
#   DEPLOY_SSH_KEY: private OpenSSH key of the markoto user on the VPS (its
#                   public half is group_vars `markoto_deploy_pubkey`; the
#                   host installs it with `restrict`, and markoto has no sudo)
#   DEPLOY_HOST: IP or DNS of the VPS
#   DEPLOY_KNOWN_HOSTS: pinned SSH host keys (`ssh-keyscan -t ed25519 HOST`);
#                        the job refuses to connect without them
#   APPRISE_URLS: Apprise URLs (optional: notifications are skipped)
#   GHCR_PULL_TOKEN: read:packages token while the images are private
#                    (optional, with the GHCR_PULL_USER variable)
# plus the app + provider secrets that infra/render-env.sh renders into .env.

on:
  # MANUAL ONLY. A merge/release never auto-deploys: you pick the environment
  # and tag, and `prod` can require an approval via the GitHub Environment
  # protection rules (Settings → Environments → prod → Required reviewers).
  # Flow: merge → release.yml builds+pushes images → you dispatch this to
  # `staging`, verify, then dispatch to `prod`.
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, prod]
      tag:
        description: 'Image tag to deploy (vX.Y.Z, or staging/latest)'
        required: true
        type: string
  # staging-gate.yml reuses this exact deploy path for staging so the gate
  # renders .env from GitHub and gets the cold-boot health budget +
  # auto-rollback.
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (staging or prod)'
        required: true
        type: string
      tag:
        description: 'Image tag to deploy (vX.Y.Z, or staging/latest)'
        required: true
        type: string
      ref:
        description: 'Git ref whose compose files + render script are shipped (default: the triggering ref)'
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  deploy:
    name: deploy (${{ inputs.environment }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Binds environment-scoped secrets (DEPLOY_HOST, DEPLOY_SSH_KEY) + any
    # required-reviewer protection rule for prod.
    environment: ${{ inputs.environment }}
    # Serialize deploys per environment: never two deploys to the same host
    # at once. Job-level (not workflow-level) so it also applies when this
    # workflow is called from staging-gate.yml.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      # SSH login user on the VPS: the unprivileged account that owns the
      # stack (infra/roles/base). Override per Environment with a
      # `DEPLOY_USER` variable only for a host provisioned differently.
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'markoto' }}
      TAG: ${{ inputs.tag }}
    steps:
      # Needed so the "Render .env" step can run infra/render-env.sh: this
      # workflow otherwise only SSHes to the VM and wouldn't check out the repo.
      # A caller (staging-gate.yml) pins the ref to the commit the release
      # images were built from, so the synced compose files match them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - name: Validate tag
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            echo "No tag provided." >&2
            exit 1
          fi
          if ! [[ "$TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+|staging|latest)$ ]]; then
            echo "Tag $TAG must be a strict vX.Y.Z, or 'staging'/'latest'" >&2
            exit 1
          fi
          echo "Deploying $TAG to $DEPLOY_HOST"

      # Pinned host keys + strict checking for every ssh/scp below.
      - name: Configure SSH (pinned host keys)
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      # Render /opt/markoto/.env on the VM from the GitHub Environment
      # secrets/variables (provider keys included). This makes GitHub
      # the single source of truth for deploy config: no laptop ansible-vault
      # in the loop. render-env.sh is also what the Ansible role runs;
      # it fails loud if any required secret is empty, so a broken/partial
      # GitHub config aborts the deploy BEFORE the running stack is touched.
      # The previous .env is kept as .env.prev for manual recovery (the
      # image-tag auto-rollback below does NOT restore .env).
      - name: Render .env from GitHub secrets/variables
        env:
          # secrets (Environment-scoped)
          NUXT_SESSION_PASSWORD: ${{ secrets.NUXT_SESSION_PASSWORD }}
          NUXT_JWT_SECRET: ${{ secrets.NUXT_JWT_SECRET }}
          NUXT_INTERNAL_API_SECRET: ${{ secrets.NUXT_INTERNAL_API_SECRET }}
          NUXT_JWT_SECRET_PREVIOUS: ${{ secrets.NUXT_JWT_SECRET_PREVIOUS }}
          NUXT_INTERNAL_API_SECRET_PREVIOUS: ${{ secrets.NUXT_INTERNAL_API_SECRET_PREVIOUS }}
          # Encrypts stored provider keys / SSO secrets (openssl rand -hex 32). Never
          # replace without moving the old value to _PREVIOUS (the operator runbook, kept outside this repository).
          NUXT_ENCRYPTION_KEY: ${{ secrets.NUXT_ENCRYPTION_KEY }}
          NUXT_ENCRYPTION_KEY_PREVIOUS: ${{ secrets.NUXT_ENCRYPTION_KEY_PREVIOUS }}
          # Anonymous gate: self-hosted ALTCHA bot check HMAC key (openssl rand -hex 32).
          NUXT_ALTCHA_HMAC_KEY: ${{ secrets.NUXT_ALTCHA_HMAC_KEY }}
          # App <-> markitdown converter shared secret (openssl rand -hex 32).
          NUXT_MARKITDOWN_API_SECRET: ${{ secrets.NUXT_MARKITDOWN_API_SECRET }}
          # Instance admins promoted at sign-in. A secret rather than a
          # variable: variables are printed in the job log, and these are
          # people's email addresses.
          NUXT_ADMIN_USER_EMAILS: ${{ secrets.NUXT_ADMIN_USER_EMAILS }}
          NUXT_PUBLISH_DOMAINS_TARGET: ${{ vars.NUXT_PUBLISH_DOMAINS_TARGET }}
          # Published pages' own hostname (pages.markoto.app on prod, its
          # staging twin on staging). Required: the app refuses to boot
          # in the hosted shape without it.
          NUXT_PUBLISH_PAGES_HOST: ${{ vars.NUXT_PUBLISH_PAGES_HOST }}
          NUXT_PUBLISH_TRAEFIK_TOKEN: ${{ secrets.NUXT_PUBLISH_TRAEFIK_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          # Separate DB roles (optional; empty = POSTGRES_USER for everything).
          POSTGRES_APP_PASSWORD: ${{ secrets.POSTGRES_APP_PASSWORD }}
          POSTGRES_LITELLM_PASSWORD: ${{ secrets.POSTGRES_LITELLM_PASSWORD }}
          VALKEY_PASSWORD: ${{ secrets.VALKEY_PASSWORD }}
          NUXT_S3_ACCESS_KEY: ${{ secrets.NUXT_S3_ACCESS_KEY }}
          NUXT_S3_SECRET_KEY: ${{ secrets.NUXT_S3_SECRET_KEY }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          LITELLM_SALT_KEY: ${{ secrets.LITELLM_SALT_KEY }}
          NUXT_STRIPE_SECRET_KEY: ${{ secrets.NUXT_STRIPE_SECRET_KEY }}
          NUXT_STRIPE_WEBHOOK_SECRET: ${{ secrets.NUXT_STRIPE_WEBHOOK_SECRET }}
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
          # Backup storage (optional; empty falls back to NUXT_S3_*)
          BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          NUXT_AI_DICTATE_JWT_SECRET: ${{ secrets.NUXT_AI_DICTATE_JWT_SECRET }}
          NUXT_OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.NUXT_OAUTH_GITHUB_CLIENT_SECRET }}
          NUXT_OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.NUXT_OAUTH_GOOGLE_CLIENT_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # provider keys (Environment-scoped, like the rest)
          JINA_AI_API_KEY: ${{ secrets.JINA_AI_API_KEY }}
          STAAN_API_KEY: ${{ secrets.STAAN_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
          # variables (Environment-scoped, non-secret)
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
          POSTGRES_APP_USER: ${{ vars.POSTGRES_APP_USER }}
          POSTGRES_LITELLM_USER: ${{ vars.POSTGRES_LITELLM_USER }}
          VALKEY_DB: ${{ vars.VALKEY_DB }}
          NUXT_S3_ENDPOINT: ${{ vars.NUXT_S3_ENDPOINT }}
          NUXT_S3_BUCKET: ${{ vars.NUXT_S3_BUCKET }}
          NUXT_STRIPE_LOOKUP_KEY_PREFIX: ${{ vars.NUXT_STRIPE_LOOKUP_KEY_PREFIX }}
          NUXT_STRIPE_PRICE_IDS: ${{ vars.NUXT_STRIPE_PRICE_IDS }}
          NUXT_STRIPE_AUTOMATIC_TAX: ${{ vars.NUXT_STRIPE_AUTOMATIC_TAX }}
          NUXT_EMAIL_FROM: ${{ vars.NUXT_EMAIL_FROM }}
          NUXT_OAUTH_GITHUB_CLIENT_ID: ${{ vars.NUXT_OAUTH_GITHUB_CLIENT_ID }}
          NUXT_OAUTH_GOOGLE_CLIENT_ID: ${{ vars.NUXT_OAUTH_GOOGLE_CLIENT_ID }}
          NUXT_PUBLIC_SENTRY_DSN: ${{ vars.NUXT_PUBLIC_SENTRY_DSN }}
          DOMAIN: ${{ vars.DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          REGISTRY: ${{ vars.REGISTRY }}
          BACKUP_INTERVAL_SECONDS: ${{ vars.BACKUP_INTERVAL_SECONDS }}
          BACKUP_RETENTION_COUNT: ${{ vars.BACKUP_RETENTION_COUNT }}
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
          BACKUP_S3_PREFIX: ${{ vars.BACKUP_S3_PREFIX }}
          OVH_PG_HOST: ${{ vars.OVH_PG_HOST }}
          OVH_PG_CA_REMOTE_PATH: ${{ vars.OVH_PG_CA_REMOTE_PATH }}
          # Optional hosted-shape tuning (empty = render-env.sh default:
          # billing off, plans "coming soon", SaaS BYOK allowlist, free AI
          # allowance, committed free-tier + web-tool limits).
          NUXT_BILLING_ENABLED: ${{ vars.NUXT_BILLING_ENABLED }}
          NUXT_PLANS_COMING_SOON: ${{ vars.NUXT_PLANS_COMING_SOON }}
          # Only prod may be indexed; staging (and anything else) renders
          # NUXT_SITE_INDEXABLE=false → robots.txt Disallow: / + noindex.
          NUXT_SITE_INDEXABLE: ${{ inputs.environment == 'prod' && 'true' || 'false' }}
          # Canonicals, og:url, JSON-LD and the sitemap name markoto.app on
          # every environment but prod (prod = its own NUXT_SITE_URL).
          NUXT_CANONICAL_SITE_URL: ${{ inputs.environment != 'prod' && 'https://markoto.app' || '' }}
          NUXT_WEB_TOOLS_HOURLY_LIMIT: ${{ vars.NUXT_WEB_TOOLS_HOURLY_LIMIT }}
          NUXT_WEB_TOOLS_DAILY_LIMIT: ${{ vars.NUXT_WEB_TOOLS_DAILY_LIMIT }}
          NUXT_AI_DEFAULT_CHAT_MODEL: ${{ vars.NUXT_AI_DEFAULT_CHAT_MODEL }}
          NUXT_AI_DEFAULT_CHAT_VISION: ${{ vars.NUXT_AI_DEFAULT_CHAT_VISION }}
          NUXT_AI_DEFAULT_CHAT_STRONG_MODEL: ${{ vars.NUXT_AI_DEFAULT_CHAT_STRONG_MODEL }}
          NUXT_AI_DEFAULT_IMAGE_MODEL: ${{ vars.NUXT_AI_DEFAULT_IMAGE_MODEL }}
          NUXT_AI_DEFAULT_TRANSCRIBE_MODEL: ${{ vars.NUXT_AI_DEFAULT_TRANSCRIBE_MODEL }}
          NUXT_FREE_TIER_TOTAL_BUDGET_USD: ${{ vars.NUXT_FREE_TIER_TOTAL_BUDGET_USD }}
          TIER_FREE_LITELLM_BUDGET_USD: ${{ vars.TIER_FREE_LITELLM_BUDGET_USD }}
          TIER_FREE_WORKSPACES_OWNED: ${{ vars.TIER_FREE_WORKSPACES_OWNED }}
          TIER_FREE_KNOWLEDGE_FILES: ${{ vars.TIER_FREE_KNOWLEDGE_FILES }}
          TIER_FREE_KNOWLEDGE_BYTES_PER_WORKSPACE: ${{ vars.TIER_FREE_KNOWLEDGE_BYTES_PER_WORKSPACE }}
          TIER_FREE_KNOWLEDGE_BYTES_PER_USER: ${{ vars.TIER_FREE_KNOWLEDGE_BYTES_PER_USER }}
          TIER_FREE_IMAGE_BYTES_PER_USER: ${{ vars.TIER_FREE_IMAGE_BYTES_PER_USER }}
          TIER_FREE_MEMBERS_PER_WORKSPACE: ${{ vars.TIER_FREE_MEMBERS_PER_WORKSPACE }}
          TIER_FREE_HISTORY_DAYS: ${{ vars.TIER_FREE_HISTORY_DAYS }}
          TIER_FREE_SAVED_THEMES: ${{ vars.TIER_FREE_SAVED_THEMES }}
          TIER_FREE_IMPORT_MAX_BYTES: ${{ vars.TIER_FREE_IMPORT_MAX_BYTES }}
          TIER_FREE_WEB_TOOLS_PER_DAY: ${{ vars.TIER_FREE_WEB_TOOLS_PER_DAY }}
          TIER_FREE_MCP_TOOL_CALLS_PER_DAY: ${{ vars.TIER_FREE_MCP_TOOL_CALLS_PER_DAY }}
          TIER_FREE_FEATURE_CUSTOM_CSS: ${{ vars.TIER_FREE_FEATURE_CUSTOM_CSS }}
          TIER_FREE_FEATURE_MCP_WRITE: ${{ vars.TIER_FREE_FEATURE_MCP_WRITE }}
          TIER_FREE_FEATURE_AI_IMAGE: ${{ vars.TIER_FREE_FEATURE_AI_IMAGE }}
          TIER_FREE_FEATURE_AI_VOICE: ${{ vars.TIER_FREE_FEATURE_AI_VOICE }}
          TIER_FREE_FEATURE_AI_STRONG_MODEL: ${{ vars.TIER_FREE_FEATURE_AI_STRONG_MODEL }}
          TIER_FREE_FEATURE_SSO: ${{ vars.TIER_FREE_FEATURE_SSO }}
          TIER_FREE_FEATURE_AUDIT_LOG: ${{ vars.TIER_FREE_FEATURE_AUDIT_LOG }}
          TIER_FREE_FEATURE_GUESTS: ${{ vars.TIER_FREE_FEATURE_GUESTS }}
          TIER_FREE_FEATURE_BRAND_KIT: ${{ vars.TIER_FREE_FEATURE_BRAND_KIT }}
          TIER_FREE_FEATURE_SHARE_CONTROLS: ${{ vars.TIER_FREE_FEATURE_SHARE_CONTROLS }}
          TIER_FREE_FEATURE_CUSTOM_DOMAINS: ${{ vars.TIER_FREE_FEATURE_CUSTOM_DOMAINS }}
          TIER_PRO_FEATURE_SSO: ${{ vars.TIER_PRO_FEATURE_SSO }}
          TIER_PRO_FEATURE_AUDIT_LOG: ${{ vars.TIER_PRO_FEATURE_AUDIT_LOG }}
          TIER_PRO_FEATURE_GUESTS: ${{ vars.TIER_PRO_FEATURE_GUESTS }}
          TIER_PRO_FEATURE_BRAND_KIT: ${{ vars.TIER_PRO_FEATURE_BRAND_KIT }}
          TIER_TEAM_FEATURE_SSO: ${{ vars.TIER_TEAM_FEATURE_SSO }}
          TIER_TEAM_FEATURE_AUDIT_LOG: ${{ vars.TIER_TEAM_FEATURE_AUDIT_LOG }}
          NUXT_IMAGE_GC_RETENTION_DAYS: ${{ vars.NUXT_IMAGE_GC_RETENTION_DAYS }}
          NUXT_INACTIVE_DOC_TTL_DAYS: ${{ vars.NUXT_INACTIVE_DOC_TTL_DAYS }}
          NUXT_AUDIT_LOG_RETENTION_DAYS: ${{ vars.NUXT_AUDIT_LOG_RETENTION_DAYS }}
          NUXT_ABUSE_REPORT_RETENTION_DAYS: ${{ vars.NUXT_ABUSE_REPORT_RETENTION_DAYS }}
          NUXT_AI_REALTIME_MODEL: ${{ vars.NUXT_AI_REALTIME_MODEL }}
          NUXT_EMAIL_PROVIDER: ${{ vars.NUXT_EMAIL_PROVIDER }}
          # Operator identity on the legal pages (public facts, so variables).
          # CONTROLLER_ADDRESS + REPRESENTED_BY are required: render-env.sh
          # refuses to render without them. The rest fall back to the code
          # defaults in shared/legal/entity.ts.
          NUXT_LEGAL_CONTROLLER_NAME: ${{ vars.NUXT_LEGAL_CONTROLLER_NAME }}
          NUXT_LEGAL_CONTROLLER_ADDRESS: ${{ vars.NUXT_LEGAL_CONTROLLER_ADDRESS }}
          NUXT_LEGAL_PRIVACY_CONTACT_EMAIL: ${{ vars.NUXT_LEGAL_PRIVACY_CONTACT_EMAIL }}
          NUXT_LEGAL_ABUSE_CONTACT_EMAIL: ${{ vars.NUXT_LEGAL_ABUSE_CONTACT_EMAIL }}
          NUXT_LEGAL_GOVERNING_LAW: ${{ vars.NUXT_LEGAL_GOVERNING_LAW }}
          NUXT_LEGAL_LEGAL_FORM: ${{ vars.NUXT_LEGAL_LEGAL_FORM }}
          NUXT_LEGAL_REGISTERED_OFFICE: ${{ vars.NUXT_LEGAL_REGISTERED_OFFICE }}
          NUXT_LEGAL_REPRESENTED_BY: ${{ vars.NUXT_LEGAL_REPRESENTED_BY }}
          NUXT_LEGAL_UID: ${{ vars.NUXT_LEGAL_UID }}
          NUXT_LEGAL_CH_ID: ${{ vars.NUXT_LEGAL_CH_ID }}
          NUXT_LEGAL_EHRA_ID: ${{ vars.NUXT_LEGAL_EHRA_ID }}
          # Edge + sync-server tuning (empty = code defaults, .env.example).
          NUXT_TRUSTED_PROXY_HOPS: ${{ vars.NUXT_TRUSTED_PROXY_HOPS }}
          RENDERER_ALLOWED_ORIGINS: ${{ vars.RENDERER_ALLOWED_ORIGINS }}
          SYNC_MAX_MESSAGE_BYTES: ${{ vars.SYNC_MAX_MESSAGE_BYTES }}
          SYNC_MAX_UPDATE_BYTES: ${{ vars.SYNC_MAX_UPDATE_BYTES }}
          SYNC_MAX_DOCUMENT_BYTES: ${{ vars.SYNC_MAX_DOCUMENT_BYTES }}
          SYNC_MAX_PREAUTH_BYTES: ${{ vars.SYNC_MAX_PREAUTH_BYTES }}
          SYNC_MAX_PREAUTH_TOTAL_BYTES: ${{ vars.SYNC_MAX_PREAUTH_TOTAL_BYTES }}
          SYNC_AUTH_TIMEOUT_MS: ${{ vars.SYNC_AUTH_TIMEOUT_MS }}
          SYNC_MAX_CONNECTIONS_PER_IP: ${{ vars.SYNC_MAX_CONNECTIONS_PER_IP }}
          SYNC_MAX_ROOMS: ${{ vars.SYNC_MAX_ROOMS }}
          SYNC_MEMORY_GUARD_PERCENT: ${{ vars.SYNC_MEMORY_GUARD_PERCENT }}
          SYNC_MEMORY_LIMIT_BYTES: ${{ vars.SYNC_MEMORY_LIMIT_BYTES }}
          SYNC_UNLOAD_GRACE_MS: ${{ vars.SYNC_UNLOAD_GRACE_MS }}
          NUXT_PUBLIC_SYNC_HIDDEN_DISCONNECT_MS: ${{ vars.NUXT_PUBLIC_SYNC_HIDDEN_DISCONNECT_MS }}
          COMPACT_THRESHOLD: ${{ vars.COMPACT_THRESHOLD }}
          COMPACT_INTERVAL_MS: ${{ vars.COMPACT_INTERVAL_MS }}
          COMPACT_MAX_DOCS_PER_RUN: ${{ vars.COMPACT_MAX_DOCS_PER_RUN }}
          COMPACT_RETAIN_HISTORY_DAYS: ${{ vars.COMPACT_RETAIN_HISTORY_DAYS }}
          # the tag being deployed pins IMAGE_TAG in the rendered .env
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Owner-only from the first byte, on the runner and on the host: no
          # window where the secrets file is group/world readable.
          umask 077
          rendered="$(mktemp)"
          trap 'shred -u "$rendered" 2>/dev/null || rm -f "$rendered"' EXIT
          bash infra/render-env.sh > "$rendered"
          echo "rendered .env: $(grep -cE '^[A-Z]' "$rendered") keys"
          # Stream over ssh stdin into a 0600 temp file next to .env, keep the
          # old one as .env.prev for recovery, then rename into place (atomic:
          # compose never sees a half-written .env).
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" '
            set -euo pipefail
            umask 077
            cd /opt/markoto
            cat > .env.new
            if [ -f .env ]; then cp -a .env .env.prev; fi
            mv -f .env.new .env
          ' < "$rendered"

      # Private images (while ghcr.io/markoto-app is private): a read-only
      # token, stored for the markoto user in ~/.docker/config.json (0600):
      # Docker Compose sends it with each pull, Podman reads the same file.
      # Streamed over ssh stdin, never on a command line. No token = the
      # host's existing login (or none, for public images) stays as it is.
      - name: Registry login on the host
        env:
          GHCR_PULL_USER: ${{ vars.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GHCR_PULL_TOKEN:-}" ]; then
            echo "GHCR_PULL_TOKEN is not set: no registry login (public images)"
            exit 0
          fi
          if [ -z "${GHCR_PULL_USER:-}" ]; then
            echo "::error title=Missing variable::GHCR_PULL_TOKEN is set but the GHCR_PULL_USER variable is not"
            exit 1
          fi
          auth="$(printf '%s:%s' "$GHCR_PULL_USER" "$GHCR_PULL_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$auth" \
            | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" '
                set -euo pipefail
                umask 077
                mkdir -p ~/.docker
                cat > ~/.docker/config.json.new
                mv -f ~/.docker/config.json.new ~/.docker/config.json
              '

      # Same rationale as staging-gate.yml: the host's compose files are
      # otherwise only written at Ansible provision time, so a merged
      # compose change would never reach the box (`pull && up -d` against
      # the stale copy silently no-ops). Sync the compose pair + every repo
      # path they bind-mount before rolling.
      - name: Sync compose + mounted config to the host
        run: |
          set -euo pipefail
          # deploy/config/postgres/init is deliberately NOT synced: the initdb
          # scripts only run on the FIRST boot of a fresh postgres data
          # dir, a provision-time concern of the Ansible markoto role.
          # compose.podman.yml: the hosted stack runs on rootless Podman
          # (render-env.sh names it in COMPOSE_FILE).
          tar czf - \
            deploy/compose/compose.prod.yml \
            deploy/compose/compose.base.yml \
            deploy/compose/compose.podman.yml \
            deploy/config/litellm/config.yaml \
            deploy/config/litellm/custom_handlers.py \
            deploy/config/postgres/db-init.sh \
            deploy/config/postgres/pg-major-upgrade.sh \
            deploy/config/edge/haproxy.cfg \
            deploy/config/traefik/acme-ec-migrate.sh \
            deploy/config/renderer/seccomp.json \
            | ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'tar xzf - -C /opt/markoto'
          # Traefik's certificate store. Compose would create a missing
          # bind-mount source as a DIRECTORY, and Traefik then drops the
          # ACME resolver; the file must also be readable by its owner only.
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'mkdir -p /opt/markoto/traefik && cd /opt/markoto/traefik && { [ -f acme.json ] || install -m 600 /dev/null acme.json; } && chmod 600 acme.json'

      - name: Roll forward + health check
        id: roll
        run: |
          set -euo pipefail
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            TAG="${TAG}" \
            'bash -se' <<'REMOTE'
          set -euo pipefail
          : "${TAG:?TAG must be set}"

          # Docker Compose on this user's rootless Podman, run in /opt/markoto
          # (infra/roles/podman_host). Missing = the host was never
          # provisioned for Podman: stop before touching anything.
          if ! command -v markoto-compose > /dev/null; then
            echo "markoto-compose not found: provision the host (infra/playbooks/provision.yml)" >&2
            exit 1
          fi
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          cd /opt/markoto

          # Capture the version we are leaving so auto-rollback knows
          # what to roll back to. .last-deploy may not exist on the very
          # first deploy: fall back to "latest" which is harmless.
          PREV=$(cat .last-deploy 2>/dev/null || echo "latest")
          echo "$PREV" > .last-deploy.prev
          echo "Previous tag was: $PREV"
          echo "Deploying tag: $TAG"

          # Pull + roll. IMAGE_TAG is consumed by .env via compose.
          export IMAGE_TAG="$TAG"
          # LiteLLM loads its config only at boot, and its single-file
          # bind mounts keep the old file after the tar sync replaced it.
          # A changed hash changes the litellm container's label, so
          # `up -d` recreates it (deploy/compose/compose.base.yml).
          LITELLM_CONFIG_HASH="$(cat deploy/config/litellm/config.yaml deploy/config/litellm/custom_handlers.py | sha256sum | cut -c1-16)"
          export LITELLM_CONFIG_HASH
          # Registry credentials: the "Registry login on the host" step.
          markoto-compose pull
          # Certificates issued with RSA keys keep them on every renewal:
          # set such a store aside once so Traefik issues ECDSA ones
          # (deploy/config/traefik/acme-ec-migrate.sh). Traefik must be
          # stopped while the store changes; `up -d` starts it again.
          acme_rc=0
          sh deploy/config/traefik/acme-ec-migrate.sh check traefik/acme.json || acme_rc=$?
          if [ "$acme_rc" -eq 10 ]; then
            markoto-compose rm -sf traefik
            sh deploy/config/traefik/acme-ec-migrate.sh rotate traefik/acme.json
          elif [ "$acme_rc" -ne 0 ]; then
            echo "acme-ec-migrate.sh check failed ($acme_rc)" >&2
            exit 1
          fi
          # Bundled Postgres only: a volume that still holds a pre-18
          # cluster is dumped, set aside inside the volume and restored into
          # Postgres 18 (deploy/config/postgres/pg-major-upgrade.sh); the
          # dump stays in postgres-upgrade/. No-op on a managed cluster and
          # on every later deploy.
          COMPOSE=markoto-compose ENGINE=podman BACKUP_DIR=/opt/markoto/postgres-upgrade \
            sh deploy/config/postgres/pg-major-upgrade.sh upgrade
          markoto-compose up -d --remove-orphans

          # Health-check loop: 60 attempts × 5 s = 300 s. Sized for a COLD
          # first boot: litellm runs ~118 Prisma migrations before turning
          # healthy (start_period 60s) and `app` gates on litellm via
          # depends_on service_healthy: a shorter budget could expire on a
          # healthy deploy and trigger a spurious auto-rollback. Warm rolls
          # pass on early attempts, so the ceiling costs nothing.
          DOMAIN=$(awk -F= '/^DOMAIN=/{print $2}' .env | tr -d '"')
          if [ -z "$DOMAIN" ]; then
            echo "DOMAIN not in .env, cannot probe health" >&2
            exit 1
          fi
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 "https://${DOMAIN}/api/health" > /dev/null 2>&1; then
              echo "Health check passed on attempt $i"
              ok=1
              break
            fi
            sleep 5
          done

          if [ "$ok" -ne 1 ]; then
            echo "Health check failed after 300s, rolling back to $PREV" >&2
            export IMAGE_TAG="$PREV"
            markoto-compose pull || true
            markoto-compose up -d --remove-orphans
            # Try to confirm rollback health. If even rollback fails,
            # the workflow will surface that too.
            for i in $(seq 1 20); do
              if curl -fsS --max-time 5 "https://${DOMAIN}/api/health" > /dev/null 2>&1; then
                echo "Rollback health check passed on attempt $i"
                # Mark the file as the rollback target so a human can
                # see the gap.
                echo "$PREV" > .last-deploy
                exit 64   # signal "rolled back" to the runner
              fi
              sleep 3
            done
            echo "Rollback ALSO failed, manual intervention required" >&2
            exit 65       # signal "rollback failed"
          fi

          # Success. Update marker; the previous .env is no longer needed
          # (it is only kept for recovery from a failed deploy).
          echo "$TAG" > .last-deploy
          rm -f .env.prev

          # Disk: keep our images of this tag and of the previous one (the
          # rollback target), drop older ones and dangling layers (a moved
          # `latest`). Images a container still uses are refused by rmi.
          podman images --format '{{.Repository}}:{{.Tag}}' \
            | awk -F: -v cur="$TAG" -v prev="$PREV" '/\/markoto-[a-z]+:[^:]+$/ && $NF != cur && $NF != prev' \
            | xargs -r podman rmi > /dev/null 2>&1 || true
          podman image prune -f > /dev/null || true
          REMOTE
          ec=$?
          {
            echo "remote_exit=$ec"
            if [ "$ec" -eq 0 ]; then
              echo "status=succeeded"
            elif [ "$ec" -eq 64 ]; then
              echo "status=rolled_back"
            elif [ "$ec" -eq 65 ]; then
              echo "status=rollback_failed"
            else
              echo "status=failed"
            fi
          } >> "$GITHUB_OUTPUT"
          # Don't fail the step yet: let the notify step run, then exit.
          exit 0

      - name: Read previous tag (for notification)
        if: steps.roll.outputs.status == 'rolled_back' || steps.roll.outputs.status == 'rollback_failed'
        id: prev
        run: |
          set -euo pipefail
          PREV=$(ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'cat /opt/markoto/.last-deploy.prev 2>/dev/null || echo unknown')
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Apprise
        run: pip install --only-binary=':all:' apprise==1.9.9

      - name: Notify (success)
        if: steps.roll.outputs.status == 'succeeded'
        env:
          APPRISE_URLS: ${{ secrets.APPRISE_URLS }}
        run: |
          if [ -z "${APPRISE_URLS:-}" ]; then echo "::warning title=Notification skipped::APPRISE_URLS is not set in this Environment (the operator runbook, kept outside this repository)"; exit 0; fi
          apprise -t "Deploy ${TAG} succeeded" \
                  -b "Deployed to ${DEPLOY_HOST}.
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                  -i markdown \
                  "${APPRISE_URLS}"

      - name: Notify (rolled back)
        if: steps.roll.outputs.status == 'rolled_back'
        env:
          APPRISE_URLS: ${{ secrets.APPRISE_URLS }}
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          if [ -z "${APPRISE_URLS:-}" ]; then echo "::warning title=Notification skipped::APPRISE_URLS is not set in this Environment (the operator runbook, kept outside this repository)"; exit 0; fi
          apprise -t "Deploy ${TAG} FAILED, rolled back to ${PREV_TAG}" \
                  -b "Auto-rollback restored ${PREV_TAG} on ${DEPLOY_HOST}. Health check now passing under previous version. Investigate the failed release.
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                  -i markdown \
                  "${APPRISE_URLS}"

      - name: Notify (rollback failed)
        if: steps.roll.outputs.status == 'rollback_failed'
        env:
          APPRISE_URLS: ${{ secrets.APPRISE_URLS }}
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          if [ -z "${APPRISE_URLS:-}" ]; then echo "::warning title=Notification skipped::APPRISE_URLS is not set in this Environment (the operator runbook, kept outside this repository)"; exit 0; fi
          apprise -t "Deploy ${TAG} FAILED, ROLLBACK ALSO FAILED" \
                  -b "Both ${TAG} and rollback to ${PREV_TAG} failed health on ${DEPLOY_HOST}. MANUAL INTERVENTION REQUIRED.
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                  -i markdown \
                  "${APPRISE_URLS}"

      - name: Fail the job if deploy didn't succeed
        if: steps.roll.outputs.status != 'succeeded'
        env:
          DEPLOY_STATUS: ${{ steps.roll.outputs.status }}
        run: |
          echo "Deploy status: ${DEPLOY_STATUS}"
          exit 1
