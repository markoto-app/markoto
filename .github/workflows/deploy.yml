name: deploy

# Manual deploy dispatcher (see `on:` below — NOT event-triggered). SSHes
# to the VPS, pulls the requested tag (private GHCR via PAT mounted on the
# VPS at provision time), runs compose up, polls /api/health,
# auto-rollbacks on failure, sends Apprise notifications either way.
#
# Required GitHub secrets (see docs/GITHUB-CONFIG.md):
#   DEPLOY_SSH_KEY    — private OpenSSH key for the markoto user on the VPS
#   DEPLOY_HOST       — IP or DNS of the VPS
#   APPRISE_URLS      — semicolon-separated Apprise URLs
#
# The VPS must already have run `docker login ghcr.io` via the Ansible
# `markoto` role (uses the `ghcr_pat` vault entry — see infra/group_vars/
# all.vault.example.yml).

on:
  # MANUAL ONLY. A merge/release never auto-deploys — you pick the environment
  # and tag, and `prod` can require an approval via the GitHub Environment
  # protection rules (Settings → Environments → prod → Required reviewers).
  # Flow: merge → release.yml builds+pushes images → you dispatch this to
  # `staging`, verify, then dispatch to `prod`. (Previously it auto-fired on
  # release:published, which would push straight to prod on every merge.)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, prod]
      tag:
        description: 'Image tag to deploy (vX.Y.Z, or staging/latest)'
        required: true
        type: string
  # staging-gate.yml reuses this exact deploy path for staging so the gate
  # also renders .env from GitHub (before, it only synced compose files —
  # every env var added since the host's last manual deploy never reached
  # staging) and gets the cold-boot health budget + auto-rollback.
  workflow_call:
    inputs:
      environment:
        description: 'Target environment (staging or prod)'
        required: true
        type: string
      tag:
        description: 'Image tag to deploy (vX.Y.Z, or staging/latest)'
        required: true
        type: string
      ref:
        description: 'Git ref whose compose files + render script are shipped (default: the triggering ref)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    name: deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Binds environment-scoped secrets (DEPLOY_HOST, DEPLOY_SSH_KEY) + any
    # required-reviewer protection rule for prod.
    environment: ${{ inputs.environment }}
    # Serialize deploys per environment — never two deploys to the same host
    # at once. Job-level (not workflow-level) so it also applies when this
    # workflow is called from staging-gate.yml.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      # SSH login user on the VPS. Prod is Ansible-provisioned with a
      # dedicated `markoto` user; the manually-provisioned staging box
      # uses `debian`. Set a per-environment `DEPLOY_USER` variable
      # (Settings → Environments → <env> → Variables) to override; the
      # default preserves the original prod behaviour.
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'markoto' }}
      TAG: ${{ inputs.tag }}
    steps:
      # Needed so the "Render .env" step can run infra/render-env.sh — this
      # workflow otherwise only SSHes to the VM and wouldn't check out the repo.
      # A caller (staging-gate.yml) pins the ref to the commit the release
      # images were built from, so the synced compose files match them.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Validate tag
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            echo "No tag provided." >&2
            exit 1
          fi
          if ! [[ "$TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+|staging|latest)$ ]]; then
            echo "Tag $TAG must be a strict vX.Y.Z, or 'staging'/'latest'" >&2
            exit 1
          fi
          echo "Deploying $TAG to $DEPLOY_HOST"

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Render /opt/markoto/.env on the VM from the GitHub Environment
      # secrets/variables (+ repo-level provider-key secrets). This makes GitHub
      # the single source of truth for deploy config — no laptop ansible-vault
      # in the loop. render-env.sh is a faithful, parity-tested port of env.j2;
      # it fails loud if any required secret is empty, so a broken/partial
      # GitHub config aborts the deploy BEFORE the running stack is touched.
      # The previous .env is kept as .env.prev for manual recovery (the
      # image-tag auto-rollback below does NOT restore .env).
      - name: Render .env from GitHub secrets/variables
        env:
          # ── secrets (Environment-scoped) ──
          NUXT_SESSION_PASSWORD: ${{ secrets.NUXT_SESSION_PASSWORD }}
          NUXT_JWT_SECRET: ${{ secrets.NUXT_JWT_SECRET }}
          NUXT_INTERNAL_API_SECRET: ${{ secrets.NUXT_INTERNAL_API_SECRET }}
          NUXT_JWT_SECRET_PREVIOUS: ${{ secrets.NUXT_JWT_SECRET_PREVIOUS }}
          NUXT_INTERNAL_API_SECRET_PREVIOUS: ${{ secrets.NUXT_INTERNAL_API_SECRET_PREVIOUS }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          VALKEY_PASSWORD: ${{ secrets.VALKEY_PASSWORD }}
          NUXT_S3_ACCESS_KEY: ${{ secrets.NUXT_S3_ACCESS_KEY }}
          NUXT_S3_SECRET_KEY: ${{ secrets.NUXT_S3_SECRET_KEY }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          LITELLM_SALT_KEY: ${{ secrets.LITELLM_SALT_KEY }}
          NUXT_STRIPE_SECRET_KEY: ${{ secrets.NUXT_STRIPE_SECRET_KEY }}
          NUXT_STRIPE_WEBHOOK_SECRET: ${{ secrets.NUXT_STRIPE_WEBHOOK_SECRET }}
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
          # Backup storage (optional; empty falls back to NUXT_S3_*)
          BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          NUXT_AI_DICTATE_JWT_SECRET: ${{ secrets.NUXT_AI_DICTATE_JWT_SECRET }}
          NUXT_OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.NUXT_OAUTH_GITHUB_CLIENT_SECRET }}
          NUXT_OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.NUXT_OAUTH_GOOGLE_CLIENT_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # ── provider keys (repo-level secrets) ──
          JINA_AI_API_KEY: ${{ secrets.JINA_AI_API_KEY }}
          STAAN_API_KEY: ${{ secrets.STAAN_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
          # ── variables (Environment-scoped, non-secret) ──
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
          VALKEY_DB: ${{ vars.VALKEY_DB }}
          VALKEY_TLS_ENABLED: ${{ vars.VALKEY_TLS_ENABLED }}
          NUXT_S3_ENDPOINT: ${{ vars.NUXT_S3_ENDPOINT }}
          NUXT_S3_BUCKET: ${{ vars.NUXT_S3_BUCKET }}
          NUXT_STRIPE_PRICE_PRO: ${{ vars.NUXT_STRIPE_PRICE_PRO }}
          NUXT_STRIPE_PRICE_MAX: ${{ vars.NUXT_STRIPE_PRICE_MAX }}
          NUXT_STRIPE_PRICE_ULTRA: ${{ vars.NUXT_STRIPE_PRICE_ULTRA }}
          NUXT_STRIPE_AUTOMATIC_TAX: ${{ vars.NUXT_STRIPE_AUTOMATIC_TAX }}
          NUXT_EMAIL_FROM: ${{ vars.NUXT_EMAIL_FROM }}
          NUXT_OAUTH_GITHUB_CLIENT_ID: ${{ vars.NUXT_OAUTH_GITHUB_CLIENT_ID }}
          NUXT_OAUTH_GOOGLE_CLIENT_ID: ${{ vars.NUXT_OAUTH_GOOGLE_CLIENT_ID }}
          NUXT_PUBLIC_SENTRY_DSN: ${{ vars.NUXT_PUBLIC_SENTRY_DSN }}
          DOMAIN: ${{ vars.DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          REGISTRY: ${{ vars.REGISTRY }}
          BACKUP_INTERVAL_SECONDS: ${{ vars.BACKUP_INTERVAL_SECONDS }}
          BACKUP_RETENTION_COUNT: ${{ vars.BACKUP_RETENTION_COUNT }}
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
          BACKUP_S3_PREFIX: ${{ vars.BACKUP_S3_PREFIX }}
          OVH_PG_HOST: ${{ vars.OVH_PG_HOST }}
          OVH_PG_CA_REMOTE_PATH: ${{ vars.OVH_PG_CA_REMOTE_PATH }}
          # Optional hosted-shape tuning (empty = render-env.sh default:
          # billing off, plans "coming soon", SaaS BYOK allowlist, committed
          # free-tier + web-tool limits).
          NUXT_BILLING_ENABLED: ${{ vars.NUXT_BILLING_ENABLED }}
          NUXT_PLANS_COMING_SOON: ${{ vars.NUXT_PLANS_COMING_SOON }}
          NUXT_WEB_TOOLS_HOURLY_LIMIT: ${{ vars.NUXT_WEB_TOOLS_HOURLY_LIMIT }}
          NUXT_WEB_TOOLS_DAILY_LIMIT: ${{ vars.NUXT_WEB_TOOLS_DAILY_LIMIT }}
          TIER_FREE_LITELLM_BUDGET_USD: ${{ vars.TIER_FREE_LITELLM_BUDGET_USD }}
          TIER_FREE_WORKSPACES_OWNED: ${{ vars.TIER_FREE_WORKSPACES_OWNED }}
          TIER_FREE_KNOWLEDGE_FILES: ${{ vars.TIER_FREE_KNOWLEDGE_FILES }}
          TIER_FREE_KNOWLEDGE_BYTES_PER_WORKSPACE: ${{ vars.TIER_FREE_KNOWLEDGE_BYTES_PER_WORKSPACE }}
          TIER_FREE_KNOWLEDGE_BYTES_PER_USER: ${{ vars.TIER_FREE_KNOWLEDGE_BYTES_PER_USER }}
          # the tag being deployed pins IMAGE_TAG in the rendered .env
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          bash infra/render-env.sh > /tmp/rendered.env
          echo "rendered .env: $(grep -cE '^[A-Z]' /tmp/rendered.env) keys"
          # ship atomically; keep the old one as .env.prev for recovery
          scp -o BatchMode=yes /tmp/rendered.env "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/markoto/.env.new"
          ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" '
            set -euo pipefail
            cd /opt/markoto
            [ -f .env ] && cp -a .env .env.prev || true
            install -m 600 .env.new .env
            rm -f .env.new
          '
          shred -u /tmp/rendered.env 2>/dev/null || rm -f /tmp/rendered.env

      # Same rationale as staging-gate.yml: the host's compose files are
      # otherwise only written at Ansible provision time, so a merged
      # compose change would never reach the box — `pull && up -d`
      # against the stale copy silently no-ops. Sync the compose pair +
      # every repo path they bind-mount before rolling.
      - name: Sync compose + mounted config to the host
        run: |
          set -euo pipefail
          # infra/postgres/init is deliberately NOT synced: the initdb
          # scripts only run on the FIRST boot of a fresh postgres data
          # dir (a provision-time concern), and the host copy is
          # root-owned from provisioning — the deploy user can't
          # overwrite it (tar: Permission denied). Changing an init
          # script requires an Ansible pass anyway.
          tar czf - \
            docker-compose.prod.yml \
            docker-compose.base.yml \
            infra/litellm/config.yaml \
            infra/litellm/custom_handlers.py \
            | ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" 'tar xzf - -C /opt/markoto'

      - name: Roll forward + health check
        id: roll
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            TAG="${TAG}" \
            'bash -se' <<'REMOTE'
          set -euo pipefail
          : "${TAG:?TAG must be set}"

          cd /opt/markoto

          # Capture the version we are leaving so auto-rollback knows
          # what to roll back to. .last-deploy may not exist on the very
          # first deploy — fall back to "latest" which is harmless.
          PREV=$(cat .last-deploy 2>/dev/null || echo "latest")
          echo "$PREV" > .last-deploy.prev
          echo "Previous tag was: $PREV"
          echo "Deploying tag: $TAG"

          # Pull + roll. IMAGE_TAG is consumed by .env via compose.
          export IMAGE_TAG="$TAG"
          # Login is already established at provision time via the
          # ghcr_pat vault entry — no additional `docker login` here.
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d

          # Health-check loop: 60 attempts × 5 s = 300 s. Sized for a COLD
          # first boot: litellm runs ~118 Prisma migrations before turning
          # healthy (start_period 60s) and `app` gates on litellm via
          # depends_on service_healthy — a 90 s budget could expire while a
          # perfectly healthy deploy was still warming up and trigger a
          # spurious auto-rollback. Warm rolls pass on early attempts, so
          # the longer ceiling costs nothing in the common case.
          DOMAIN=$(awk -F= '/^DOMAIN=/{print $2}' .env | tr -d '"')
          if [ -z "$DOMAIN" ]; then
            echo "DOMAIN not in .env — cannot probe health" >&2
            exit 1
          fi
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 "https://${DOMAIN}/api/health" > /dev/null 2>&1; then
              echo "Health check passed on attempt $i"
              ok=1
              break
            fi
            sleep 5
          done

          if [ "$ok" -ne 1 ]; then
            echo "Health check failed after 300s — rolling back to $PREV" >&2
            export IMAGE_TAG="$PREV"
            docker compose -f docker-compose.prod.yml pull || true
            docker compose -f docker-compose.prod.yml up -d
            # Try to confirm rollback health. If even rollback fails,
            # the workflow will surface that too.
            for i in $(seq 1 20); do
              if curl -fsS --max-time 5 "https://${DOMAIN}/api/health" > /dev/null 2>&1; then
                echo "Rollback health check passed on attempt $i"
                # Mark the file as the rollback target so a human can
                # see the gap.
                echo "$PREV" > .last-deploy
                exit 64   # signal "rolled back" to the runner
              fi
              sleep 3
            done
            echo "Rollback ALSO failed — manual intervention required" >&2
            exit 65       # signal "rollback failed"
          fi

          # Success. Update marker.
          echo "$TAG" > .last-deploy
          REMOTE
          ec=$?
          {
            echo "remote_exit=$ec"
            if [ "$ec" -eq 0 ]; then
              echo "status=succeeded"
            elif [ "$ec" -eq 64 ]; then
              echo "status=rolled_back"
            elif [ "$ec" -eq 65 ]; then
              echo "status=rollback_failed"
            else
              echo "status=failed"
            fi
          } >> "$GITHUB_OUTPUT"
          # Don't fail the step yet — let the notify step run, then exit.
          exit 0

      - name: Read previous tag (for notification)
        if: steps.roll.outputs.status == 'rolled_back' || steps.roll.outputs.status == 'rollback_failed'
        id: prev
        run: |
          set -euo pipefail
          PREV=$(ssh -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'cat /opt/markoto/.last-deploy.prev 2>/dev/null || echo unknown')
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Apprise
        run: pip install apprise

      - name: Notify (success)
        if: steps.roll.outputs.status == 'succeeded'
        env:
          APPRISE_URLS: ${{ secrets.APPRISE_URLS }}
        run: |
          if [ -z "${APPRISE_URLS:-}" ]; then echo "no APPRISE_URLS"; exit 0; fi
          apprise -t "Deploy ${TAG} succeeded" \
                  -b "Deployed to ${DEPLOY_HOST}.
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                  -i markdown \
                  "${APPRISE_URLS}"

      - name: Notify (rolled back)
        if: steps.roll.outputs.status == 'rolled_back'
        env:
          APPRISE_URLS: ${{ secrets.APPRISE_URLS }}
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          if [ -z "${APPRISE_URLS:-}" ]; then echo "no APPRISE_URLS"; exit 0; fi
          apprise -t "Deploy ${TAG} FAILED — rolled back to ${PREV_TAG}" \
                  -b "Auto-rollback restored ${PREV_TAG} on ${DEPLOY_HOST}. Health check now passing under previous version. Investigate the failed release.
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                  -i markdown \
                  "${APPRISE_URLS}"

      - name: Notify (rollback failed)
        if: steps.roll.outputs.status == 'rollback_failed'
        env:
          APPRISE_URLS: ${{ secrets.APPRISE_URLS }}
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          if [ -z "${APPRISE_URLS:-}" ]; then echo "no APPRISE_URLS"; exit 0; fi
          apprise -t "Deploy ${TAG} FAILED — ROLLBACK ALSO FAILED" \
                  -b "Both ${TAG} and rollback to ${PREV_TAG} failed health on ${DEPLOY_HOST}. MANUAL INTERVENTION REQUIRED.
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                  -i markdown \
                  "${APPRISE_URLS}"

      - name: Fail the job if deploy didn't succeed
        if: steps.roll.outputs.status != 'succeeded'
        run: |
          echo "Deploy status: ${{ steps.roll.outputs.status }}"
          exit 1
