name: image-scan

# Reusable: build the selected runtime images exactly as release.yml does
# (same context/Dockerfile pairs) WITHOUT pushing, then scan each with Trivy.
# Called from:
#   - ci.yml              on PRs, only for images whose inputs changed
#   - image-scan-weekly   weekly + manual, all images, against main
#
# Fails on fixable HIGH/CRITICAL OS + library CVEs: `ignore-unfixed` keeps a
# CVE with no upstream fix yet from blocking unrelated work; bumping the
# base-image digest is the remedy when this goes red.

on:
  workflow_call:
    inputs:
      services:
        description: 'JSON array of service names to scan (default: all five)'
        type: string
        required: false
        default: '["app","sync-server","renderer","markitdown","backup"]'

permissions: {}

jobs:
  prepare:
    name: prepare
    permissions: {}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select matrix entries
        id: select
        env:
          SERVICES: ${{ inputs.services }}
        run: |
          set -euo pipefail
          # Same context/Dockerfile pairs as release.yml's build-images.
          FULL='[
            {"service":"app","context":".","dockerfile":"Dockerfile"},
            {"service":"sync-server","context":".","dockerfile":"./sync-server/Dockerfile"},
            {"service":"renderer","context":".","dockerfile":"./renderer/Dockerfile"},
            {"service":"markitdown","context":"./markitdown-server","dockerfile":"./markitdown-server/Dockerfile"},
            {"service":"backup","context":"./backup-server","dockerfile":"./backup-server/Dockerfile"}
          ]'
          MATRIX="$(jq -c --argjson want "${SERVICES}" \
            '{include: [.[] | select(.service as $s | $want | index($s))]}' <<<"${FULL}")"
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  scan:
    name: scan (${{ matrix.service }})
    needs: prepare
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's root disk is too small for "build + load into the
      # daemon + Trivy's own export copy" of the larger images (app with
      # the 10 GB swapfile below, renderer at ~2 GB). Drop preinstalled SDKs this job never
      # uses, and (below) scan an image tarball instead of a loaded image
      # so the layers exist on disk once, not three times.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # Same memory headroom as release.yml's build-images job: the app
      # build (Nuxt/Vite + Sentry source maps) OOMs without extra swap.
      - name: Add swap (memory-heavy app build)
        if: matrix.service == 'app'
        run: |
          sudo fallocate -l 10G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          tags: markoto-${{ matrix.service }}:ci-scan
          cache-from: type=gha,scope=${{ matrix.service }}

      # Pinned by commit SHA (v0.36.0), not by tag: most of trivy-action's
      # tags were force-pushed to malicious commits in a supply-chain
      # compromise (GHSA-69fq-xp46-6x23), so a tag is not a trustworthy
      # reference for this action.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
