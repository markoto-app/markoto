# Publish the docs screenshots from a release run.
#
# Every release run (release.yml) records the whole flow suite and uploads
# its manifests + screenshots as the `flow-output` artifact: also when a
# few flows failed: scripts/build-flows.ts republishes only variants with a
# `.passed` sentinel, a failed variant keeps its previously published
# frames. A frame that looks the same as the committed one keeps its
# committed bytes (pixel comparison, scripts/lib/flowShots.ts), so the PR
# carries only what changed instead of re-encoded copies of every
# screenshot. This workflow turns that artifact into a PR that refreshes
# `public/flows/`, so the docs site always shows the released app without
# anyone copying screenshots by hand. main stays PR-only: the change goes
# through the normal PR gate (label `release:none`, merged by a human or
# the release operator).
#
# Runs after every release run (any conclusion: a run that skipped its
# flow job has no artifact and ends here as a no-op) or by hand with a
# release run id. There is one screenshots PR at a time (branch
# `docs/flow-shots`, updated in place by the next release).

name: publish-flow-shots

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'release.yml run id whose flow-output to publish'
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-flow-shots
  cancel-in-progress: false

jobs:
  publish:
    name: open a screenshots PR
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The organisation's release GitHub App (RELEASE_APP_ID variable +
    # RELEASE_APP_PRIVATE_KEY secret, main-only Environment) pushes the branch
    # and opens the PR: a PR opened with GITHUB_TOKEN would not trigger ci.yml,
    # so its required checks would never report.
    environment: release
    permissions:
      actions: read # download the artifact of the triggering run
      contents: read # check out the (private) repository
    env:
      RUN_ID: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}
    steps:
      - name: Find the flow-output artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          count=$(gh api "/repos/${REPO}/actions/runs/${RUN_ID}/artifacts" \
            --jq '[.artifacts[] | select(.name == "flow-output" and .expired == false)] | length')
          echo "flow-output artifacts on run ${RUN_ID}: ${count}"
          echo "found=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.artifact.outputs.found == 'true'
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Download flow output
        if: steps.artifact.outputs.found == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flow-output
          path: tests/e2e/output/flows
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}

      - name: Setup Bun
        if: steps.artifact.outputs.found == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # The pixel comparison needs sharp (prebuilt libvips, no install
      # script). `--ignore-scripts`: no dependency code runs at install;
      # the app token is only minted for the last step.
      - name: Install dependencies
        if: steps.artifact.outputs.found == 'true'
        run: bun install --frozen-lockfile --ignore-scripts --filter markoto

      - name: Rebuild public/flows
        if: steps.artifact.outputs.found == 'true'
        run: bun scripts/build-flows.ts --summary "${RUNNER_TEMP}/flows-summary.md"

      - name: Require the release GitHub App credentials
        if: steps.artifact.outputs.found == 'true'
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${RELEASE_APP_ID:-}" ] || [ -z "${RELEASE_APP_PRIVATE_KEY:-}" ]; then
            echo "::error title=Missing GitHub App credentials::RELEASE_APP_ID (variable) and RELEASE_APP_PRIVATE_KEY (secret) must both be set in the 'release' Environment (the operator runbook, kept outside this repository)."
            exit 1
          fi

      - name: Create release app token
        id: app-token
        if: steps.artifact.outputs.found == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # One screenshots PR at a time: every run force-pushes the fixed
      # branch `docs/flow-shots` (built from main, so it always carries
      # everything since the last merged refresh) and updates the open PR's
      # title + body instead of opening another one. PRs left over from the
      # former per-version branches (`docs/flow-shots-vX.Y.Z`) are closed as
      # superseded and their branches deleted. When main already matches the
      # release's output, an open PR would only bring older frames back, so
      # it is closed too.
      - name: Open or update the PR
        if: steps.artifact.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ github.repository }}
          BRANCH: docs/flow-shots
        run: |
          set -euo pipefail
          version=$(git tag --list 'v*' --sort=-v:refname | head -1)
          version="${version:-run-${RUN_ID}}"
          title="docs: publish the ${version} flow screenshots"

          # Closes every open screenshots PR except the one given as $1.
          close_others() {
            local keep="$1" note="$2" number head
            gh pr list --repo "$REPO" --state open --base main --limit 100 \
              --json number,headRefName \
              --jq '.[] | select(.headRefName | startswith("docs/flow-shots")) | "\(.number) \(.headRefName)"' |
            while read -r number head; do
              [ "$number" = "$keep" ] && continue
              gh pr close "$number" --repo "$REPO" --delete-branch --comment "$note"
              echo "Closed #${number} (${head})."
            done
          }

          if [ -z "$(git status --porcelain -- public/flows)" ]; then
            echo "public/flows is unchanged, nothing to publish."
            close_others none "Closed: public/flows on main already matches the ${version} flow output."
            exit 0
          fi

          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add public/flows
          git commit -q -m "$title" \
            -m "From release run ${RUN_ID} (flow-output artifact, scripts/build-flows.ts)."
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${BRANCH}"

          body="$RUNNER_TEMP/pr-body.md"
          {
            echo "Refreshes \`public/flows/\` (the screenshots and manifests the docs embed) from the flow-output artifact of release run [${RUN_ID}](${GITHUB_SERVER_URL}/${REPO}/actions/runs/${RUN_ID}). Frames that look the same keep their committed file; variants whose flow failed in that run keep their previous frames (\`scripts/build-flows.ts\`)."
            echo
            cat "${RUNNER_TEMP}/flows-summary.md"
            echo
            echo "Opened by \`.github/workflows/publish-flow-shots.yml\`, which force-pushes this branch after every release, so this PR always shows the newest release's screenshots."
          } > "$body"

          number=$(gh pr list --repo "$REPO" --state open --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$REPO" --title "$title" --body-file "$body"
            echo "PR #${number} updated to ${version}."
          else
            url=$(gh pr create --repo "$REPO" --base main --head "$BRANCH" \
              --title "$title" --label release:none --body-file "$body")
            number="${url##*/}"
            echo "Opened PR #${number}."
          fi
          close_others "$number" "Superseded by #${number} (newer flow screenshots)."
