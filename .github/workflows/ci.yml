name: ci

# PR-only checks. The push-to-main flow lives in release.yml.
#
# There is deliberately no failure notification here: PR runs cannot use a
# main-restricted Environment, so a notifier would need APPRISE_URLS as a
# repo-level secret readable by any branch workflow. GitHub's own PR check
# notifications cover this; main-only workflows (release, deploy, weekly
# scans) still notify through Environment-scoped APPRISE_URLS.
#
# The `main` ruleset requires `label-check`, `semantic-pr-title`,
# `actions-lint`, `secret-scan`, `lint-typecheck`, `lint-types`,
# `repo-checks`, `docs-checks`, `shell-docker-lint`, `python-checks`,
# `test-unit-dom`, `migration-guard`, `selfhost-check` and
# `test-repos-integration-flows`. `sonar` is NOT required (fork PRs never get
# its token). See the operator runbook, kept outside this repository.
# Every job except `sonar` runs on fork PRs: none of them reads a secret.
# Jobs skipped by path filters report as skipped, which satisfies a
# required check.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Least privilege: nothing by default, each job grants itself what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Path-based gating. Done with job-level `if`s (NOT workflow-level
  # `paths:`/`paths-ignore:`): a workflow skipped by `paths` leaves required
  # status checks "pending" forever and blocks merge, whereas a job skipped
  # by `if` reports as skipped, which satisfies the required check.
  changes:
    name: changes
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.code.outputs.code }}
      image_services: ${{ steps.services.outputs.services }}
      markitdown: ${{ steps.markitdown.outputs.markitdown }}
      python: ${{ steps.python.outputs.python }}
    steps:
      # `code` is true when ANY changed file is NOT documentation-like
      # (`every` quantifier: a file counts only if it matches all patterns).
      # Deliberately counted as code: content/** (legal + docs pages are
      # rendered by the app and covered by tests), shared/templates/content/** (template skeletons),
      # and .github/workflows/*.yml (CI changes must always be exercised).
      - name: Detect non-docs changes
        id: code
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!**/AGENTS.md'
              - '!.github/**/*.md'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!LICENSE'
              - '!NOTICE'

      # Inputs that can change an image's contents / CVE surface. Compose
      # files are not listed: they only reference third-party images
      # (traefik, valkey, litellm, ...) that are not built or scanned here.
      # The reusable image-scan.yml itself is in every list so a change to
      # the scan job is exercised.
      - name: Detect image-affecting changes
        id: images
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            # One Bun workspace, one lockfile: every image installs from the
            # root manifests, so a dependency change anywhere can move any of
            # the three JavaScript images.
            app:
              - 'Dockerfile'
              - '.dockerignore'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - '*/package.json'
              - '.github/workflows/image-scan.yml'
            sync-server:
              - 'sync-server/Dockerfile'
              - 'sync-server/Dockerfile.dockerignore'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - '*/package.json'
              - '.github/workflows/image-scan.yml'
            renderer:
              - 'renderer/Dockerfile'
              - 'renderer/Dockerfile.dockerignore'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - '*/package.json'
              - '.github/workflows/image-scan.yml'
            markitdown:
              - 'markitdown-server/Dockerfile'
              - '.github/workflows/image-scan.yml'
            backup:
              - 'backup-server/Dockerfile'
              - '.github/workflows/image-scan.yml'

      # The converter's own Python tests (archive-bomb limits, the shared
      # secret, design extraction): run whenever its source changes.
      - name: Detect markitdown source changes
        id: markitdown
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            markitdown:
              - 'markitdown-server/**'
              - 'tests/fixtures/design-import/**'
              - '.github/workflows/ci.yml'

      # Python lives in markitdown-server/, deploy/config/litellm/, a few scripts and
      # test fixtures; the linters read these configs.
      - name: Detect Python changes
        id: python
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            python:
              - '**/*.py'
              - 'ruff.toml'
              - 'pyrightconfig.json'
              - 'markitdown-server/**'
              - 'package.json'
              - '.github/workflows/ci.yml'

      - name: Build image-scan service list
        id: services
        env:
          APP: ${{ steps.images.outputs.app }}
          SYNC: ${{ steps.images.outputs.sync-server }}
          RENDERER: ${{ steps.images.outputs.renderer }}
          MARKITDOWN: ${{ steps.images.outputs.markitdown }}
          BACKUP: ${{ steps.images.outputs.backup }}
        run: |
          set -euo pipefail
          list=()
          if [ "${APP}" = "true" ]; then list+=("app"); fi
          if [ "${SYNC}" = "true" ]; then list+=("sync-server"); fi
          if [ "${RENDERER}" = "true" ]; then list+=("renderer"); fi
          if [ "${MARKITDOWN}" = "true" ]; then list+=("markitdown"); fi
          if [ "${BACKUP}" = "true" ]; then list+=("backup"); fi
          if [ "${#list[@]}" -eq 0 ]; then
            json='[]'
          else
            json="$(printf '%s\n' "${list[@]}" | jq -R . | jq -sc .)"
          fi
          echo "services=${json}" >> "${GITHUB_OUTPUT}"

  label-check:
    name: label-check
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Validate exactly one (or zero) release:* label
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const releaseLabels = labels.filter(n => n.startsWith('release:'));
            const allowed = ['release:major', 'release:minor', 'release:patch', 'release:none'];
            const invalid = releaseLabels.filter(n => !allowed.includes(n));
            if (invalid.length > 0) {
              core.setFailed(
                `Unknown release label(s): ${invalid.join(', ')}.\n` +
                `Allowed: ${allowed.join(', ')}. ` +
                `Omit the label entirely to default to release:patch.`
              );
              return;
            }
            if (releaseLabels.length > 1) {
              core.setFailed(
                `Multiple release:* labels found: ${releaseLabels.join(', ')}.\n` +
                `Apply EXACTLY ONE of: release:major, release:minor, release:patch, release:none. ` +
                `Or omit entirely to default to release:patch.`
              );
              return;
            }
            const effective = releaseLabels[0] || 'release:patch (implicit default)';
            core.info(`Effective release label: ${effective}`);

  semantic-pr-title:
    name: semantic-pr-title
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      # Enforces feat:/fix:/docs:/chore:/refactor:/test:/build:/ci: prefix +
      # lower-cased subject. The PR title is ALSO the release name (see
      # release.yml): this gate is what stops a sloppy title from shipping
      # straight to the public release page.
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            build
            ci
            perf
            revert
          requireScope: false
          subjectPattern: '^[a-z].*'
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter.
            Examples:
              feat: add per-doc theme presets
              fix(sync): close valkey on SIGTERM
              docs: clarify rotation cadence

  actions-lint:
    name: actions-lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # Catches workflow regressions at PR-check time: schema mistakes,
    # ${{ }} expression typos, shellcheck-flagged bash inside `run:` blocks,
    # unpinned action versions, etc. See `.github/workflows/README.md` for
    # how to run the same lint locally before pushing.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download actionlint
        id: get_actionlint
        # Pinned to a commit of the download script. The script's first
        # arg pins the binary version it fetches: both layers are pinned
        # so a tampered `main` can't substitute a different binary.
        run: bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
        shell: bash

      - name: Run actionlint
        env:
          ACTIONLINT: ${{ steps.get_actionlint.outputs.executable }}
        run: |
          "${ACTIONLINT}" -color
        shell: bash

  secret-scan:
    name: secret-scan
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # Scans the full git history for leaked credentials. fetch-depth: 0
    # is required so gitleaks sees every commit, not just the PR head.
    # The gitleaks image is run directly: the gitleaks GitHub Action needs a
    # paid licence for repositories owned by an organisation, the tool
    # itself does not. Same scan as the local `make secrets-scan`
    # (.gitleaks.toml and .gitleaksignore are read from the repository).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan the history with gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:105ac66a57b2bb8afb61a3b8a5dcc4817773d03724a7e8a515214cfe58225556 \
            git /repo --redact --no-banner

  selfhost-check:
    name: selfhost-check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # Static validation of the self-host deployment shape: install.sh is
    # shellcheck-clean and deploy/compose/compose.selfhost*.yml (+ the shared base)
    # render for HTTP, HTTPS, build-from-source and backup combinations.
    # The runner image ships shellcheck but Compose v2.x, which rejects a
    # file that overrides services it `include:`s ("conflicts with imported
    # resource": allowed again since Compose v5.0.0, compose-go#835). Every
    # compose file here relies on that, so install a pinned v5 plugin.
    env:
      COMPOSE_VERSION: v5.4.0
      COMPOSE_SHA256: 837fd1d35bf6a494f41b5b5988269a7be79de337cf1a1a6ff0e45ab51bb4e9be
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Docker Compose ${{ env.COMPOSE_VERSION }}
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL -o ~/.docker/cli-plugins/docker-compose \
            "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-x86_64"
          echo "${COMPOSE_SHA256}  $HOME/.docker/cli-plugins/docker-compose" | sha256sum -c -
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version

      - name: Validate self-host compose + install.sh
        run: bash scripts/selfhost-check.sh

  # markitdown-server/test_*.py run inside the image they test (its Python,
  # markitdown and limits), so a dependency bump that breaks the archive
  # pre-flight or the secret check fails here, not in production.
  markitdown-tests:
    name: markitdown-tests
    needs: changes
    if: needs.changes.outputs.markitdown == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build the markitdown image
        run: docker build -t markoto-markitdown:ci markitdown-server

      # The image ships without pip; the HTTP test client (pure Python,
      # pinned, wheels only) is mounted read-only instead of installed.
      - name: Fetch the test client
        run: |
          python3 -m pip install --target "${RUNNER_TEMP}/pydeps" --no-deps --only-binary=:all: \
            httpx==0.28.1 httpcore==1.0.9 certifi==2025.8.3

      - name: Run the Python unit tests in the image
        run: |
          docker run --rm --network none --entrypoint python \
            -e PYTHONPATH=/deps -v "${RUNNER_TEMP}/pydeps:/deps:ro" \
            -v "$PWD/markitdown-server:/t:ro" -w /t \
            -v "$PWD/tests/fixtures/design-import:/fixtures:ro" \
            markoto-markitdown:ci -B -m unittest -v test_server test_design_extract

  lint-typecheck:
    name: lint-typecheck
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      # vue-tsc over the whole app exceeds Node's default heap ceiling on the
      # runner.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # vue-tsc must run under real Node: its Vue language plugin does not
      # take effect under Bun, which silently drops every .vue file from the
      # check. (setup-bun puts no `node` shim on PATH for a plain `bun run`.)
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ESLint without the type-aware rules (`lint:fast`, ~seconds); every
      # rule is an error. The type-aware rules run in the parallel
      # `lint-types` job. `--bun` forces eslint + nuxt to run under Bun (Node 20 on the
      # runner lacks Object.groupBy that eslint-flat-config-utils 0.4+
      # depends on; would crash before reading a single rule).
      - name: Lint (all rules except type-aware)
        run: bun run lint:fast

      # No `--bun`: `bun run` keeps the shebang's real Node for vue-tsc.
      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck covers .vue files
        run: bun run typecheck:guard

      - name: Typecheck tests
        run: bun run typecheck:tests

      - name: Typecheck scripts
        run: bun run typecheck:scripts

      # sync-server and renderer are workspace packages with their own
      # tsconfig + `typecheck` script; `nuxt typecheck` never sees them.
      - name: Typecheck sync-server + renderer
        run: bun run typecheck:services

      # .env.example, the configuration reference and the renderer's env
      # loader are generated from the env registry (shared/env).
      - name: Generated env files are current
        run: bun run check:env

      # infra/render-env.sh renders the hosted .env for both deploy paths
      # (deploy.yml and the Ansible role).
      - name: render-env.sh behaviour
        run: bash infra/render-env-test.sh

  # The type-aware typescript-eslint rules (no-floating-promises, ...) cost
  # ~95 % of the lint time, so they run as their own job in parallel with the
  # rest. This job runs the complete config (`bun run lint`), which also covers
  # the few non-type rules that read type information and the report of
  # unused suppression comments, so nothing falls between the two lint jobs.
  lint-types:
    name: lint-types
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # One install at the workspace root covers sync-server and the
      # renderer too: the type-aware rules resolve their imports through
      # their own tsconfig.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Under Node, not Bun: the TypeScript programs behind the type-aware
      # rules peak at about 5 GB under V8 with this heap ceiling and at more
      # than 11 GB under Bun, which the runner does not have.
      - name: Lint (full config, type-aware rules included)
        run: node node_modules/eslint/bin/eslint.js .
        env:
          NODE_OPTIONS: --max-old-space-size=5632

  # Structural checks over the source graph and the generated schema.
  repo-checks:
    name: repo-checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # drizzle-kit and knip run under real Node.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Unused files, exports and dependencies (knip.jsonc).
      - name: Unused code and dependencies (knip)
        run: bun run knip

      # Layer boundaries and import cycles (.dependency-cruiser.cjs).
      - name: Import graph (dependency-cruiser)
        run: bun run depcruise

      # Fails when server/db/schema/ has changes no committed migration
      # covers, i.e. `drizzle-kit generate` would create a migration.
      - name: Schema matches the migrations
        run: bun run db:check-drift

      # Markdown prose: milestone vocabulary and dangling path references.
      - name: Internal vocabulary
        run: bun run check:vocab

      # The em-dash character (U+2014) is never used in the repository.
      - name: No em-dash
        run: bun run check:em-dash

  docs-checks:
    name: docs-checks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      LYCHEE_VERSION: lychee-v0.24.2
      LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Path references in Markdown
        run: bun run check:md-paths

      # Offline pass (lychee.toml): relative links and #anchors between our
      # own Markdown files. The release binary is pinned by checksum.
      - name: Install lychee
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/lychee.tar.gz" \
            "https://github.com/lycheeverse/lychee/releases/download/${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  ${RUNNER_TEMP}/lychee.tar.gz" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf "${RUNNER_TEMP}/lychee.tar.gz" -C "${HOME}/.local/bin" --strip-components=1 --wildcards '*/lychee'
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Markdown links (lychee, offline)
        run: bun run check:links

  shell-docker-lint:
    name: shell-docker-lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      HADOLINT_VERSION: v2.15.1
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # shellcheck ships with the runner image.
      - name: shellcheck (every tracked *.sh)
        run: bun run check:shell

      - name: Install hadolint
        run: |
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL -o "${HOME}/.local/bin/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  ${HOME}/.local/bin/hadolint" | sha256sum -c -
          chmod +x "${HOME}/.local/bin/hadolint"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: hadolint (every Dockerfile, .hadolint.yaml)
        run: bun run check:docker

  # markitdown-server, the LiteLLM provider plugin and the Python fixtures.
  python-checks:
    name: python-checks
    needs: changes
    if: needs.changes.outputs.python == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install uv
        run: python3 -m pip install --quiet uv==0.13.6

      # ruff (pinned in package.json): lint + format check.
      - name: ruff
        run: bun run check:py

      # pyright against the pinned markitdown-server requirements.
      - name: pyright
        run: bun run check:pyright

  migration-guard:
    name: migration-guard
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the guard can diff the PR's new migrations against
      # the base branch (it only scans CHANGED drizzle/*.sql: historical
      # migrations legitimately contain DROP/TRUNCATE).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # No `bun install`: the script uses only node builtins, so this stays
      # fast. Flags backward-incompatible DDL (DROP/RENAME/TYPE/SET NOT NULL/
      # TRUNCATE) that would break code-only rollback in the deploy pipeline.
      # Acknowledge a reviewed exception with `-- allow-destructive: <reason>`
      # in the migration .sql. See scripts/check-destructive-migrations.ts.
      - name: Guard against backward-incompatible migrations
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: bun scripts/check-destructive-migrations.ts

  test-unit-dom:
    name: test-unit-dom
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test:unit

      - name: DOM tests
        run: bun run test:dom

  test-repos-integration-flows:
    # The name is a required status check in branch protection; renaming it
    # blocks every merge. The job runs coverage + integration only. The
    # Playwright flow suite (which also regenerates the docs/demo
    # screenshots, incl. live AI) runs only in release.yml, for PRs labeled
    # release:*.
    name: test-repos-integration-flows
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: changes
    # Only on ready-for-review PRs to keep draft loops snappy, and only when
    # the PR touches something other than documentation (see `changes`).
    # Skipped (not failed) otherwise, which satisfies the required check.
    if: >-
      github.event.pull_request.draft == false &&
      needs.changes.outputs.code == 'true'
    # ~10 min of setup (install, test stack, unit coverage) plus the
    # integration suite, which grows with every design template (each has a
    # real-renderer PDF case, and the Type 3 sweep renders every preset).
    # A 20 min limit cancels healthy runs mid-suite.
    timeout-minutes: 30
    env:
      # Test stack defaults: match deploy/compose/compose.test.yml.
      TEST_MODE: "1"
      NUXT_VOXTRAL_REALTIME_MOCK: "1"
      # No live-AI provider keys here (the PR gate runs no flow suite).
      # Raise the V8 heap ceiling for the Nuxt build (the test stack + the
      # integration setup both run `bun run build`, which exceeds the
      # default heap limit on the 7 GB runner).
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The integration setup's `bun run build` needs a larger V8 heap than
      # the default on the 7 GB runner; NODE_OPTIONS=--max-old-space-size (in
      # the job env above) lifts that soft limit using the existing RAM+swap.
      # NO extra swapfile here: /mnt is Docker's data-root on the runner, and a big
      # swapfile there starves the test-stack image pulls ("no space left").

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The integration app binds :3101 (TEST_PORT); sync-test posts
      # activity-log rows back to it, so its APP_URL must point there.
      # The default baked into the compose file is :3001; this override
      # keeps the MCP activity round-trip on the right port so the mcp:%
      # attribution tests pass.
      - name: Bring up test stack
        env:
          SYNC_TEST_APP_URL: http://host.docker.internal:3101
        run: bash scripts/test-compose.sh --profile flows up -d --wait

      # Replaces `bun run test:repos`: covers the same project plus
      # unit + dom + nuxt under one vitest invocation with --coverage.
      # The lcov is uploaded below for the sonar job to consume; running
      # the same test set in a separate workflow would double the cost.
      - name: Coverage suite (unit + dom + nuxt + repos)
        run: bun run test:coverage:fast

      - name: Integration tests
        run: bun run test:integration

      # The Playwright flow suite is NOT run here: its 4-project matrix takes
      # about the whole 25-min budget on its own. It runs in release.yml.
      - name: Tear down test stack
        if: always()
        run: bash scripts/test-compose.sh --profile flows down -v

      - name: Upload coverage for sonar
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          # Only the lcov file: the html / json-summary reports add
          # MBs of artefact weight that sonar doesn't read.
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  sonar:
    name: sonar
    permissions:
      contents: read
      pull-requests: read
    needs: [changes, test-repos-integration-flows]
    # Inherits the heavy-job's gates (draft + docs-only): sonar isn't useful
    # without the coverage artifact that job produces. Mirror the gates so a
    # draft or docs-only PR skips sonar instead of failing on a missing
    # artifact (a skipped dependency would skip this job anyway; the explicit
    # condition keeps that visible).
    #
    # Fork PRs (and Dependabot PRs, whose secrets live in a separate
    # namespace) never receive SONAR_TOKEN, so the scan could only ever fail
    # there: skip the job instead of showing a red check nobody can fix.
    # Same-repo PRs fail loudly below if the secret is missing.
    if: >-
      github.event.pull_request.draft == false &&
      needs.changes.outputs.code == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Full history → accurate blame + new-code period detection.
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-lcov
          path: coverage

      - name: Require SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error title=Missing secret::SONAR_TOKEN is not set (repo-level Actions secret, see the operator runbook, kept outside this repository)."
            exit 1
          fi

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  image-scan:
    name: image-scan
    permissions:
      contents: read
    needs: changes
    # Builds + Trivy-scans only the images whose inputs changed in this PR
    # (Dockerfile, package.json / bun.lock, base-image pins: see the
    # `images` filter in the `changes` job). A skipped job reports as
    # skipped, which satisfies a required check. Unchanged images are
    # covered by the weekly image-scan-weekly.yml run against main.
    # Same draft gate as the heavy test job (image builds take minutes).
    if: >-
      github.event.pull_request.draft == false &&
      needs.changes.outputs.image_services != '[]'
    uses: ./.github/workflows/image-scan.yml
    with:
      services: ${{ needs.changes.outputs.image_services }}
