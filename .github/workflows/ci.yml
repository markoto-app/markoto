name: ci

# Phase 12 — PR-only checks. Push-to-main flow lives in release.yml.
#
# Jobs run in this order semantically (GH runs the independent ones in
# parallel as the runner pool allows):
#
#   label-check         — exactly one (or zero) `release:*` label
#   semantic-pr-title   — conventional-commit subject
#   secret-scan         — gitleaks against full history; blocks any PR
#                         that introduces a leaked secret
#   lint-typecheck      — fast (~30s) gate
#   selfhost-check      — shellcheck install.sh + `docker compose config`
#                         for every self-host compose combination (no
#                         containers started)
#   test-unit-dom       — fast unit + happy-dom suite
#   changes             — path filters (dorny/paths-filter): `code` (anything
#                         beyond docs) gates the heavy jobs; per-image
#                         filters gate image-scan. Job-level gating only —
#                         never workflow-level `paths:` (see below).
#   test-repos-integration-flows
#                       — heavy stack (~10–15 min); skipped on draft PRs
#                         and on docs-only PRs. Name is historical (it once
#                         ran a fast flow suite); do NOT rename — required
#                         check.
#                         Also produces ./coverage/lcov.info (consumed
#                         by the sonar job below) — `bun run test:repos`
#                         was replaced by `test:coverage:fast` so we
#                         don't run unit/dom/nuxt/repos twice on a PR.
#   sonar               — SonarQube Cloud scan; downloads the coverage
#                         artifact from test-repos-integration-flows.
#                         Same draft/docs-only gates as that job.
#   image-scan          — Trivy scan, only for images whose Dockerfile /
#                         deps / base pins changed (image-scan.yml). The
#                         weekly image-scan-weekly.yml covers the rest.
#   notify-on-failure   — single Apprise ping if any of the above failed
#
# Branch protection on `main` should require `label-check`,
# `semantic-pr-title`, `actions-lint`, `secret-scan`, `lint-typecheck`,
# `test-unit-dom`, and (for ready-for-review PRs)
# `test-repos-integration-flows` + `sonar`. See docs/GITHUB-CONFIG.md.
# Jobs skipped by path filters report as skipped, which satisfies a
# required check.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Path-based gating. Done with job-level `if`s (NOT workflow-level
  # `paths:`/`paths-ignore:`): a workflow skipped by `paths` leaves required
  # status checks "pending" forever and blocks merge, whereas a job skipped
  # by `if` reports as skipped, which satisfies the required check.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.code.outputs.code }}
      image_services: ${{ steps.services.outputs.services }}
    steps:
      # `code` is true when ANY changed file is NOT documentation-like.
      # (`every` quantifier: a file counts only if it matches all patterns,
      # i.e. matches `**` and none of the exclusions.) Deliberately counted
      # as code: content/** (legal + docs pages are rendered by the app and
      # covered by tests), shared/templates/content/** (template skeletons),
      # and .github/workflows/*.yml (CI changes must always be exercised).
      # paths-filter pinned by commit SHA (v4.0.3), like trivy-action.
      - name: Detect non-docs changes
        id: code
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!**/AGENTS.md'
              - '!.github/**/*.md'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.agents/**'
              - '!LICENSE'
              - '!NOTICE'

      # Inputs that can change an image's contents / CVE surface. Compose
      # files are not listed: they only reference third-party images
      # (traefik, valkey, litellm, ...) that are not built or scanned here.
      # The reusable image-scan.yml itself is in every list so a change to
      # the scan job is exercised.
      - name: Detect image-affecting changes
        id: images
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            app:
              - 'Dockerfile'
              - '.dockerignore'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/image-scan.yml'
            sync-server:
              - 'sync-server/Dockerfile'
              - 'sync-server/package.json'
              - 'sync-server/bun.lock'
              - 'shared/package.json'
              - 'shared/bun.lock'
              - '.github/workflows/image-scan.yml'
            renderer:
              - 'renderer/Dockerfile'
              - 'renderer/package.json'
              - 'renderer/bun.lock'
              - '.github/workflows/image-scan.yml'
            markitdown:
              - 'markitdown-server/Dockerfile'
              - '.github/workflows/image-scan.yml'
            backup:
              - 'backup-server/Dockerfile'
              - '.github/workflows/image-scan.yml'

      - name: Build image-scan service list
        id: services
        env:
          APP: ${{ steps.images.outputs.app }}
          SYNC: ${{ steps.images.outputs.sync-server }}
          RENDERER: ${{ steps.images.outputs.renderer }}
          MARKITDOWN: ${{ steps.images.outputs.markitdown }}
          BACKUP: ${{ steps.images.outputs.backup }}
        run: |
          set -euo pipefail
          list=()
          if [ "${APP}" = "true" ]; then list+=("app"); fi
          if [ "${SYNC}" = "true" ]; then list+=("sync-server"); fi
          if [ "${RENDERER}" = "true" ]; then list+=("renderer"); fi
          if [ "${MARKITDOWN}" = "true" ]; then list+=("markitdown"); fi
          if [ "${BACKUP}" = "true" ]; then list+=("backup"); fi
          if [ "${#list[@]}" -eq 0 ]; then
            json='[]'
          else
            json="$(printf '%s\n' "${list[@]}" | jq -R . | jq -sc .)"
          fi
          echo "services=${json}" >> "${GITHUB_OUTPUT}"

  label-check:
    name: label-check
    runs-on: ubuntu-latest
    steps:
      - name: Validate exactly one (or zero) release:* label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const releaseLabels = labels.filter(n => n.startsWith('release:'));
            const allowed = ['release:major', 'release:minor', 'release:patch', 'release:none'];
            const invalid = releaseLabels.filter(n => !allowed.includes(n));
            if (invalid.length > 0) {
              core.setFailed(
                `Unknown release label(s): ${invalid.join(', ')}.\n` +
                `Allowed: ${allowed.join(', ')}. ` +
                `Omit the label entirely to default to release:patch.`
              );
              return;
            }
            if (releaseLabels.length > 1) {
              core.setFailed(
                `Multiple release:* labels found: ${releaseLabels.join(', ')}.\n` +
                `Apply EXACTLY ONE of: release:major, release:minor, release:patch, release:none. ` +
                `Or omit entirely to default to release:patch.`
              );
              return;
            }
            const effective = releaseLabels[0] || 'release:patch (implicit default)';
            core.info(`Effective release label: ${effective}`);

  semantic-pr-title:
    name: semantic-pr-title
    runs-on: ubuntu-latest
    steps:
      # Enforces feat:/fix:/docs:/chore:/refactor:/test:/build:/ci: prefix +
      # lower-cased subject. The PR title is ALSO the release name (see
      # release.yml) — this gate is what stops a sloppy title from shipping
      # straight to the public release page.
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            build
            ci
            perf
            revert
          requireScope: false
          subjectPattern: '^[a-z].*'
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter.
            Examples:
              feat: add per-doc theme presets
              fix(sync): close valkey on SIGTERM
              docs: clarify rotation cadence

  actions-lint:
    name: actions-lint
    runs-on: ubuntu-latest
    # Catches workflow regressions at PR-check time: schema mistakes,
    # ${{ }} expression typos, shellcheck-flagged bash inside `run:` blocks,
    # unpinned action versions, etc. See `.github/workflows/README.md` for
    # how to run the same lint locally before pushing.
    steps:
      - uses: actions/checkout@v4

      - name: Download actionlint
        id: get_actionlint
        # Pin to the v1.7.12 tag of the download script. The script's first
        # arg pins the binary version it fetches — both layers are pinned
        # so a tampered `main` can't substitute a different binary.
        run: bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
        shell: bash

      - name: Run actionlint
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    # Scans the full git history for leaked credentials. fetch-depth: 0
    # is required so gitleaks sees every commit, not just the PR head.
    # The default action config matches our local `make secrets-scan`.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  selfhost-check:
    name: selfhost-check
    runs-on: ubuntu-latest
    # Static validation of the self-host deployment shape: install.sh is
    # shellcheck-clean and docker-compose.selfhost*.yml (+ the shared base)
    # render for HTTP, HTTPS, build-from-source and backup combinations.
    # The runner image ships shellcheck but Compose v2.x, which rejects a
    # file that overrides services it `include:`s ("conflicts with imported
    # resource" — allowed again since Compose v5.0.0, compose-go#835). Every
    # compose file here relies on that, so install a pinned v5 plugin.
    env:
      COMPOSE_VERSION: v5.4.0
      COMPOSE_SHA256: 837fd1d35bf6a494f41b5b5988269a7be79de337cf1a1a6ff0e45ab51bb4e9be
    steps:
      - uses: actions/checkout@v4

      - name: Install Docker Compose ${{ env.COMPOSE_VERSION }}
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL -o ~/.docker/cli-plugins/docker-compose \
            "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-x86_64"
          echo "${COMPOSE_SHA256}  $HOME/.docker/cli-plugins/docker-compose" | sha256sum -c -
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version

      - name: Validate self-host compose + install.sh
        run: bash scripts/selfhost-check.sh

  lint-typecheck:
    name: lint-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `--bun` forces eslint + nuxt to run under Bun (Node 20 on the
      # runner lacks Object.groupBy that eslint-flat-config-utils 0.4+
      # depends on; would crash before reading a single rule).
      - name: Lint
        run: bun --bun run lint

      - name: Typecheck
        run: bun --bun run typecheck

      # render-env.sh (CI deploy path) and env.j2 (Ansible path) must emit
      # byte-identical .env content. The parity script existed but was never
      # wired into CI, and the two DID silently drift (a var added to one
      # file only) — this step makes the drift a PR failure.
      - name: render-env ↔ env.j2 parity
        run: |
          pip install --quiet jinja2
          bash infra/render-env-parity-test.sh

  migration-guard:
    name: migration-guard
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the guard can diff the PR's new migrations against
      # the base branch (it only scans CHANGED drizzle/*.sql — historical
      # migrations legitimately contain DROP/TRUNCATE).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # No `bun install` — the script uses only node builtins, so this stays
      # fast. Flags backward-incompatible DDL (DROP/RENAME/TYPE/SET NOT NULL/
      # TRUNCATE) that would break code-only rollback in the deploy pipeline.
      # Acknowledge a reviewed exception with `-- allow-destructive: <reason>`
      # in the migration .sql. See scripts/check-destructive-migrations.ts.
      - name: Guard against backward-incompatible migrations
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: bun scripts/check-destructive-migrations.ts

  test-unit-dom:
    name: test-unit-dom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # sync-server/ ships as a separate package with its own node_modules.
      # A handful of unit tests import sync-server source directly
      # (syncAuth.test.ts, contractsJwt.test.ts → sync-server/src/auth.ts →
      # sentry.ts → @sentry/bun), so those deps must be present or the
      # imports fail with ERR_MODULE_NOT_FOUND. The coverage job already does
      # this; the unit job needs it too.
      - name: Install sync-server dependencies
        run: bun install --frozen-lockfile
        working-directory: sync-server

      - name: Unit tests
        run: bun run test:unit

      - name: DOM tests
        run: bun run test:dom

  test-repos-integration-flows:
    # Historical name, kept because it is a required status check in branch
    # protection (renaming it would block every merge). It originally ran
    # repos + integration + a fast Playwright flow suite; today it is
    # coverage + integration ONLY. The Playwright flow suite (which also
    # regenerates the docs/demo screenshots, incl. live AI) runs only in
    # release.yml, for PRs labeled release:*.
    name: test-repos-integration-flows
    runs-on: ubuntu-latest
    needs: changes
    # Only on ready-for-review PRs to keep draft loops snappy, and only when
    # the PR touches something other than documentation (see `changes`).
    # Skipped (not failed) otherwise, which satisfies the required check.
    if: >-
      github.event.pull_request.draft == false &&
      needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    env:
      # Test stack defaults — match docker-compose.test.yml.
      TEST_MODE: "1"
      NUXT_GOOGLE_SPEECH_MOCK: "1"
      # No live-AI provider keys + no Playwright flow suite here: the PR gate
      # is coverage + integration only. The full flow suite (incl. live AI)
      # runs in release.yml (release:*-labeled merges only).
      # Raise the V8 heap ceiling for the Nuxt build (the test stack + the
      # integration setup both run `bun run build`, which OOM'd at the
      # default heap limit on the 7 GB runner: "Reached heap limit").
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      # The integration setup's `bun run build` hit the V8 heap ceiling
      # ("Reached heap limit") on the 7 GB runner. That's a soft heap limit,
      # not physical exhaustion — NODE_OPTIONS=--max-old-space-size (in the
      # job env above) lifts it using the existing RAM+swap. NO extra
      # swapfile here: /mnt is Docker's data-root on the runner, and a big
      # swapfile there starves the test-stack image pulls ("no space left").

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # sync-server/ has its own package.json (it ships as a separate
      # container — `@sentry/bun` etc. don't belong at the root). The
      # root install doesn't reach it, but vitest's `coverage.all: true`
      # instruments every file in `include:` — including
      # `sync-server/src/**/*.ts` — at coverage-suite time. Without
      # these deps installed, `import '@sentry/bun'` ERR_MODULE_NOT_FOUND
      # crashes the coverage run.
      - name: Install sync-server dependencies
        run: bun install --frozen-lockfile
        working-directory: sync-server

      # The integration app binds :3101 (TEST_PORT); sync-test posts
      # activity-log rows back to it, so its APP_URL must point there.
      # The default baked into the compose file is :3001; this override
      # keeps the MCP activity round-trip on the right port so the mcp:%
      # attribution tests pass. (The full flow suite — incl. live AI —
      # runs in release.yml, NOT on the PR gate.)
      - name: Bring up test stack
        env:
          SYNC_TEST_APP_URL: http://host.docker.internal:3101
        run: docker compose -f docker-compose.test.yml --profile flows up -d --wait

      # Replaces `bun run test:repos` — covers the same project plus
      # unit + dom + nuxt under one vitest invocation with --coverage.
      # The lcov is uploaded below for the sonar job to consume; running
      # the same test set in a separate workflow would double the cost.
      - name: Coverage suite (unit + dom + nuxt + repos)
        run: bun run test:coverage:fast

      - name: Integration tests
        run: bun run test:integration

      # NOTE: the Playwright flow suite is NOT run here — it's slow (the
      # 4-project matrix ~= the whole 25-min budget on its own). It runs in
      # release.yml (full suite incl. live AI) for release:*-labeled merges.
      # Keeping the PR gate to coverage + integration is what makes it fast.
      - name: Tear down test stack
        if: always()
        run: docker compose -f docker-compose.test.yml --profile flows down -v

      - name: Upload coverage for sonar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          # Only the lcov file — the html / json-summary reports add
          # MBs of artefact weight that sonar doesn't read.
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  sonar:
    name: sonar
    needs: [changes, test-repos-integration-flows]
    # Inherits the heavy-job's gates (draft + docs-only) — sonar isn't useful
    # without the coverage artifact that job produces. Mirror the gates so a
    # draft or docs-only PR skips sonar instead of failing on a missing
    # artifact (a skipped dependency would skip this job anyway; the explicit
    # condition keeps that visible).
    if: >-
      github.event.pull_request.draft == false &&
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history → accurate blame + new-code period detection.
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-lcov
          path: coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  image-scan:
    name: image-scan
    needs: changes
    # Builds + Trivy-scans only the images whose inputs changed in this PR
    # (Dockerfile, package.json / bun.lock, base-image pins — see the
    # `images` filter in the `changes` job). A skipped job reports as
    # skipped, which satisfies a required check. Unchanged images are
    # covered by the weekly image-scan-weekly.yml run against main.
    # Same draft gate as the heavy test job (image builds take minutes).
    if: >-
      github.event.pull_request.draft == false &&
      needs.changes.outputs.image_services != '[]'
    uses: ./.github/workflows/image-scan.yml
    with:
      services: ${{ needs.changes.outputs.image_services }}

  notify-on-failure:
    name: notify-on-failure
    needs:
      - changes
      - label-check
      - semantic-pr-title
      - actions-lint
      - secret-scan
      - selfhost-check
      - lint-typecheck
      - test-unit-dom
      - test-repos-integration-flows
      - sonar
      - image-scan
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Apprise
        run: pip install apprise

      - name: Send Apprise notification
        env:
          APPRISE_URLS: ${{ secrets.APPRISE_URLS }}
          # Pass user-controlled GitHub context fields through env to avoid
          # script-injection (a PR title/branch with backticks or $() would
          # otherwise execute on the runner). actionlint flags `head_ref`
          # specifically; we pipe the others through the same way for
          # consistency.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${APPRISE_URLS:-}" ]; then
            echo "APPRISE_URLS secret not configured — skipping notification."
            exit 0
          fi
          apprise -t "CI failed on PR #${PR_NUMBER}" \
                  -b "Branch \`${PR_HEAD_REF}\` — ${PR_TITLE}
          Run: ${RUN_URL}" \
                  -i markdown \
                  "${APPRISE_URLS}"
