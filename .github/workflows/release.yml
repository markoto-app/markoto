name: release

# Phase 12 — a merge to main fires this. Pipeline:
#
#   1. resolve-pr           — find the PR for this commit, read its title +
#                             body + release:* label. release:none short-
#                             circuits the rest. We use the PR title as the
#                             release name and the PR body as the release
#                             notes — no aggregation, no release-drafter.
#   2. bump-version         — compute the next version from the latest v* TAG
#                             (not package.json) and push an annotated vX.Y.Z
#                             tag. NO commit back to main.
#   3. build-images         — matrix [app, sync-server, renderer, markitdown, backup], push to GHCR
#   4. run-flows            — regenerate flow output against the freshly-built
#                             tag (uses docker-compose.test.yml --profile flows)
#   5. create-release       — softprops/action-gh-release using the PR title
#                             as the release name, the PR body as the body
#                             (with an auto-appended footer), and flow image
#                             assets attached
#   6. notify-release       — single Apprise message
#
# main is strictly PR-only: this workflow NEVER pushes a commit to main.
# Versions live in the git tag history, not a committed package.json bump,
# and flow manifests ship as Release assets rather than a commit. The only
# write is the vX.Y.Z tag push (tags aren't covered by the branch ruleset),
# authenticated by RELEASE_BOT_TOKEN. See docs/GITHUB-CONFIG.md.
#
# Why "PR-title + PR-body" over release-drafter aggregation:
#
# Our model is one-LABELED-PR-equals-one-release. Merges WITHOUT a
# release:patch|minor|major label do not release (Actions-budget economy —
# label the last PR of a batch to ship the accumulated work). When a
# release does run, aggregation across multiple PRs is unnecessary, and
# release-drafter's category buckets bury what authors actually wrote in
# their PR descriptions. Authors get rewarded for writing meaningful titles
# + descriptions (PR template hints at "What changed" / "Why" / "How to
# verify"); those flow directly to the release page with zero indirection.

on:
  push:
    branches: [main]

# Least privilege: nothing by default, each job grants itself what it needs.
# Jobs that need high-value secrets (RELEASE_BOT_TOKEN, live-AI provider keys,
# APPRISE_URLS) bind the `release` Environment, which only deploys from `main`
# (docs/GITHUB-CONFIG.md). Repo-level secrets are NOT used here.
permissions: {}

concurrency:
  # Serialize releases — never two release runs in flight against main.
  group: release-main
  cancel-in-progress: false

jobs:
  resolve-pr:
    name: resolve-pr
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.pr.outputs.should_release }}
      bump: ${{ steps.pr.outputs.bump }}
      pr_number: ${{ steps.pr.outputs.number }}
      pr_title: ${{ steps.pr.outputs.title }}
      pr_body: ${{ steps.pr.outputs.body }}
      pr_author: ${{ steps.pr.outputs.author }}
      current_version: ${{ steps.compute.outputs.current_version }}
      new_version: ${{ steps.compute.outputs.new_version }}
      previous_tag: ${{ steps.compute.outputs.previous_tag }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Get merged PR details
        id: pr
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            // A merged PR maps to one merge commit — except a merged stack
            // (gh stack / merge-async on the top PR): ONE merge commit closes
            // every PR of the stack, and the API lists them in no useful
            // order. Take the merged PR that carries a release:major|minor|
            // patch label (the top of the stack, by convention), else any
            // merged one. Direct pushes to main are blocked by branch
            // protection except for the release bot's [skip ci] commits,
            // which never re-enter this workflow.
            const merged = prs.data.filter(p => p.merged_at);
            const releasing = merged.filter(p => (p.labels || []).some(l => /^release:(major|minor|patch)$/.test(l.name)));
            if (releasing.length > 1) {
              core.setFailed(
                'Several PRs of this merge carry a release label: ' +
                releasing.map(p => '#' + p.number).join(', ') + '. Label only the top of the stack.'
              );
              return;
            }
            const pr = releasing[0] || merged[0] || prs.data[0];
            if (!pr) {
              core.setFailed('No merged PR found for commit ' + context.sha);
              return;
            }

            // Validate release labels.
            const releaseLabels = (pr.labels || []).filter(l => l.name.startsWith('release:'));
            if (releaseLabels.length > 1) {
              core.setFailed(
                'Multiple release: labels found on PR #' + pr.number + ': ' +
                releaseLabels.map(l => l.name).join(', ')
              );
              return;
            }
            const allowed = ['release:major', 'release:minor', 'release:patch', 'release:none'];
            if (releaseLabels.length === 1 && !allowed.includes(releaseLabels[0].name)) {
              core.setFailed(
                'Unknown release label: ' + releaseLabels[0].name +
                '. Allowed: ' + allowed.join(', ')
              );
              return;
            }
            // Releases are OPT-IN: an unlabeled merge does NOT release.
            // The full release chain (5 image builds + the 40-min live-AI
            // flow suite + staging deploy) costs ~90 billable minutes —
            // far too much to spend on every docs/chore/fix merge. Label
            // the LAST PR of a batch release:patch|minor|major to ship
            // the accumulated work in one release. `release:none` is kept
            // as an accepted explicit no-op for muscle-memory compat.
            const bump = releaseLabels[0]?.name.replace('release:', '') || 'none';
            const skip = bump === 'none';

            core.setOutput('number', String(pr.number));
            core.setOutput('title', pr.title);
            // Empty bodies are common; render a placeholder so the release
            // page isn't blank — a PR with no body is a smell, but better to
            // surface it than crash the release.
            core.setOutput('body', pr.body || '_(No description provided.)_');
            core.setOutput('author', pr.user.login);
            core.setOutput('bump', bump);
            core.setOutput('should_release', skip ? 'false' : 'true');
            if (skip) {
              core.info('PR #' + pr.number + ' labelled release:none — skipping release.');
            } else {
              core.info('PR #' + pr.number + ' "' + pr.title + '" → ' + bump);
            }

      - name: Compute new version
        id: compute
        if: steps.pr.outputs.should_release == 'true'
        env:
          PR_BUMP: ${{ steps.pr.outputs.bump }}
        run: |
          set -euo pipefail
          # Source of truth for the current version is the latest v* tag,
          # NOT package.json — the release flow no longer commits a version
          # bump back to main (main is strictly PR-only), so the tag history
          # is the durable version record. resolve-pr checks out at
          # fetch-depth: 0, so every tag is present here. No tags yet → 0.0.0.
          CURRENT=$(git tag --list 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')
          CURRENT=${CURRENT:-0.0.0}
          BUMP="${PR_BUMP}"
          NEW=$(node -e "
            const [maj, min, pat] = process.argv[1].split('.').map(Number);
            const bump = process.argv[2];
            if (bump === 'major') console.log(\`\${maj+1}.0.0\`);
            else if (bump === 'minor') console.log(\`\${maj}.\${min+1}.0\`);
            else console.log(\`\${maj}.\${min}.\${pat+1}\`);
          " "$CURRENT" "$BUMP")
          {
            echo "current_version=$CURRENT"
            echo "new_version=$NEW"
            echo "previous_tag=v$CURRENT"
          } >> "$GITHUB_OUTPUT"
          echo "Bump: $BUMP  $CURRENT → $NEW"

      # A release whose changes since the previous tag touch nothing the app
      # image runs — the committed flow screenshots (public/flows, a
      # publish-flow-shots PR), operator docs, AGENTS.md / top-level Markdown,
      # CI workflows (.github/) — has no code for the flow suite to test: it ships new images (the screenshots live in the app
      # image) without the ~45-minute suite. content/ is NOT docs-only: those
      # pages are served by the app and covered by flows.
      - name: Detect a docs-only release
        id: scope
        if: steps.pr.outputs.should_release == 'true'
        env:
          PREVIOUS: ${{ steps.compute.outputs.previous_tag }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/${PREVIOUS}" >/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "${PREVIOUS}" HEAD)
          others=$(printf '%s\n' "$changed" | grep -vE '^(public/flows/|docs/|\.github/)' | grep -vE '^[^/]+\.md$|^(app|server|shared|tests|infra|scripts|sync-server|renderer)/(.*/)?CLAUDE\.md$' | grep -v '^$' || true)
          if [ -n "$changed" ] && [ -z "$others" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Docs-only release: the flow suite is skipped."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  bump-version:
    name: bump-version
    needs: resolve-pr
    if: needs.resolve-pr.outputs.should_release == 'true'
    permissions:
      contents: read
    # RELEASE_BOT_TOKEN lives in this main-only Environment.
    environment: release
    runs-on: ubuntu-latest
    outputs:
      tag: v${{ needs.resolve-pr.outputs.new_version }}
    steps:
      # Checked out at the merged commit on main. We create + push an
      # annotated tag there — NO commit back to main (main is strictly
      # PR-only, enforced by the repository ruleset). Tags are not covered
      # by the branch ruleset, so the tag push is allowed. RELEASE_BOT_TOKEN
      # authenticates the push (GITHUB_TOKEN would also work for tags).
      - name: Require RELEASE_BOT_TOKEN
        env:
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          if [ -z "${RELEASE_BOT_TOKEN:-}" ]; then
            echo "::error title=Missing secret::RELEASE_BOT_TOKEN is not set in the 'release' Environment (docs/GITHUB-CONFIG.md). No tag was pushed."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_TOKEN }}

      - name: Tag release
        env:
          NEW: ${{ needs.resolve-pr.outputs.new_version }}
        run: |
          set -euo pipefail
          git config user.name "markoto-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git tag -a "v${NEW}" -m "Release v${NEW}"
          git push origin "v${NEW}"

  build-images:
    name: build-images (${{ matrix.service }})
    needs: [resolve-pr, bump-version]
    if: needs.resolve-pr.outputs.should_release == 'true'
    permissions:
      contents: read
      packages: write
      # cosign keyless signing (GitHub OIDC -> Fulcio certificate).
      id-token: write
    # RELEASE_BOT_TOKEN (GHCR push credential) lives in this main-only Environment.
    environment: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        # `image` is the GHCR repo name the prod compose pulls
        # (${REGISTRY}/markoto-<x>); `service` is just the display label
        # + build cache scope. All five runtime images are built here — the
        # markitdown + backup images were previously omitted, so the prod
        # stack could never pull a complete set.
        include:
          - service: app
            context: .
            dockerfile: Dockerfile
            image: markoto-app
          - service: sync-server
            # Repo-root context: the sync Dockerfile COPYs both sync-server/src
            # AND the top-level shared/ dir, so ./sync-server can't see shared/.
            context: .
            dockerfile: ./sync-server/Dockerfile
            image: markoto-sync
          - service: renderer
            context: ./renderer
            dockerfile: ./renderer/Dockerfile
            image: markoto-renderer
          - service: markitdown
            context: ./markitdown-server
            dockerfile: ./markitdown-server/Dockerfile
            image: markoto-markitdown
          - service: backup
            context: ./backup-server
            dockerfile: ./backup-server/Dockerfile
            image: markoto-backup
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: v${{ needs.resolve-pr.outputs.new_version }}

      # The app build plus its 10 GB swapfile and BuildKit's cache export
      # left the runner with ~90 MB free on the v0.2.0 release, so the
      # cosign download after the push failed and the image went out
      # unsigned. Drop preinstalled SDKs this job never uses first (same
      # list as image-scan.yml).
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # The `app` Nuxt/Vite build (with Sentry source-map processing) peaks
      # above the 7 GB of a private-repo runner and the OOM-killer SIGKILLs
      # `bun run build` inside the Docker build ("cannot allocate memory").
      # bun uses JSC (no V8 heap flag), so the fix is more virtual memory.
      # Add a SECOND swapfile (the runner already has an active /swapfile —
      # fallocate'ing that one fails "Text file busy") on the large 72 GB
      # root disk. NOT /mnt: that's the small disk Docker layers spill onto.
      # Only the app image build is heavy enough to need it.
      - name: Add swap (memory-heavy app build)
        if: matrix.image == 'markoto-app'
        run: |
          sudo fallocate -l 10G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci
          swapon --show
          free -h

      - name: Require RELEASE_BOT_TOKEN
        env:
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          if [ -z "${RELEASE_BOT_TOKEN:-}" ]; then
            echo "::error title=Missing secret::RELEASE_BOT_TOKEN is not set in the 'release' Environment (docs/GITHUB-CONFIG.md)."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # RELEASE_BOT_TOKEN (from the main-only `release` Environment)
          # carries packages:write, so it doubles as the GHCR push
          # credential. ${{ secrets.GITHUB_TOKEN }} (the job declares
          # `packages: write`) works too once each package grants this repo
          # Actions write access — docs/GITHUB-CONFIG.md, owner checklist.
          password: ${{ secrets.RELEASE_BOT_TOKEN }}

      # Installed BEFORE the build so a full disk after a large push can
      # never leave a pushed image unsigned.
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Build + push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/joelbarmettleruzh/${{ matrix.image }}:v${{ needs.resolve-pr.outputs.new_version }}
            ghcr.io/joelbarmettleruzh/${{ matrix.image }}:latest
          # Links the GHCR package to this repository.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=v${{ needs.resolve-pr.outputs.new_version }}
          # BuildKit attestations pushed next to the image: SLSA provenance
          # (max detail) and an SBOM.
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Keyless: the signature is bound to this workflow's OIDC identity
      # (release.yml on refs/heads/main) and logged in the public Rekor log.
      # Signing the digest covers every tag that points at it.
      - name: Sign image (cosign keyless)
        env:
          IMAGE: ghcr.io/joelbarmettleruzh/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST:-}" ]; then
            echo "::error title=No digest::build-push-action returned no image digest; refusing to ship an unsigned image."
            exit 1
          fi
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "Signed ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

  run-flows-and-collect-outputs:
    name: run-flows-and-collect-outputs
    needs: [resolve-pr, build-images]
    if: needs.resolve-pr.outputs.should_release == 'true' && needs.resolve-pr.outputs.docs_only != 'true'
    permissions:
      contents: read
    # Live-AI provider keys live in this main-only Environment.
    environment: release
    runs-on: ubuntu-latest
    # The flow suite is 160 Playwright tests on ONE worker by design
    # (flow-docs record ordered manifests against a shared stack) —
    # measured ~3.1 tests/min in CI ⇒ ~55 min for the suite alone, plus
    # setup + retries. 45 was measured-too-small (run 29152361051
    # cancelled mid-suite at 107/160).
    timeout-minutes: 90
    env:
      IMAGE_TAG: v${{ needs.resolve-pr.outputs.new_version }}
      TEST_MODE: "1"
      NUXT_VOXTRAL_REALTIME_MOCK: "1"
      # The live-AI provider keys are deliberately NOT job-level env: they are
      # bound only to the two steps that use them (test-stack bring-up passes
      # them into the litellm container; `flows:test` reads them), so
      # `bun install`, Playwright and every other step never see them.
      # flows-ephemeral.ts runs `bun run build`, which OOMs at the default V8
      # heap limit on the 7 GB runner (same fix as ci.yml test-repos-integration-flows
      # and staging-gate.yml full-flow-suite — this job was the only one missing it).
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: v${{ needs.resolve-pr.outputs.new_version }}

      - name: Require live-AI provider keys
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          JINA_AI_API_KEY: ${{ secrets.JINA_AI_API_KEY }}
          BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
          STAAN_API_KEY: ${{ secrets.STAAN_API_KEY }}
        run: |
          missing=""
          for n in MISTRAL_API_KEY JINA_AI_API_KEY BFL_API_KEY STAAN_API_KEY; do
            if [ -z "${!n:-}" ]; then missing="${missing} ${n}"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Not set in the 'release' Environment (docs/GITHUB-CONFIG.md):${missing}"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # requireLiveAi() sees the keys, so the AI flows (write-with-ai,
      # knowledge-grounded-ai, voice-dictate, …) run for real. This is THE
      # one live-AI verification per release: staging-gate trusts this run
      # (create-release only publishes if this job is green) and goes
      # straight to deploy + public smoke.
      - name: Bring up test stack against built images
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          JINA_AI_API_KEY: ${{ secrets.JINA_AI_API_KEY }}
          BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
          STAAN_API_KEY: ${{ secrets.STAAN_API_KEY }}
        run: docker compose -f docker-compose.test.yml --profile flows up -d --wait

      # flows:test (scripts/flows-ephemeral.ts) runs three Playwright passes
      # on this one stack, restarting only the app server between them:
      # untagged flows (hosted shape, marketing site off), `@billing`
      # (billing on) and `@marketing` (NUXT_MARKETING_SITE_ENABLED=true).
      # All three write to tests/e2e/output/flows, so the upload below
      # carries every pass's manifests + screenshots.
      - name: Run flow tests
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          JINA_AI_API_KEY: ${{ secrets.JINA_AI_API_KEY }}
          BFL_API_KEY: ${{ secrets.BFL_API_KEY }}
          STAAN_API_KEY: ${{ secrets.STAAN_API_KEY }}
        run: bun run flows:test

      - name: Tear down test stack
        if: always()
        run: docker compose -f docker-compose.test.yml --profile flows down -v

      # Uploaded even when some flows failed: build-flows.ts republishes
      # only variants with a `.passed` sentinel, so publish-flow-shots.yml
      # can still refresh every flow that passed (a failed one keeps its
      # previous frames). create-release still needs the whole job green.
      - name: Upload flow output (manifests + images)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flow-output
          path: tests/e2e/output/flows
          # Keep the per-variant `.passed` sentinels: scripts/build-flows.ts
          # only publishes variants that have one, and upload-artifact v4
          # drops dotfiles by default.
          include-hidden-files: true
          retention-days: 30

      # On failure the Playwright
      # error contexts (test-results/) used to vanish with the runner —
      # debugging the July-11 polished-pdf hang required a full local
      # reproduction because of exactly this gap. Ship them always.
      - name: Upload failure artefacts (error contexts + traces)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flow-failure-artefacts
          path: test-results
          retention-days: 14
          if-no-files-found: ignore

  # NOTE: flow manifests are NOT committed back to main (main is strictly
  # PR-only). The flow output is still published — run-flows uploads it as
  # the `flow-output` artifact and create-release packs it into the GitHub
  # Release assets. If the docs-site gallery ever needs the manifests in
  # git, refresh them via a normal PR rather than an automated push to main.

  create-release:
    name: create-release
    needs:
      - resolve-pr
      - bump-version
      - build-images
      - run-flows-and-collect-outputs
    # Runs after a green flow suite, or without one for a docs-only release
    # (the suite is skipped then; a skipped `needs` would skip this job too
    # without the explicit result checks).
    if: >-
      !cancelled() &&
      needs.resolve-pr.outputs.should_release == 'true' &&
      needs.build-images.result == 'success' &&
      (needs.run-flows-and-collect-outputs.result == 'success' ||
       (needs.run-flows-and-collect-outputs.result == 'skipped' && needs.resolve-pr.outputs.docs_only == 'true'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_url: ${{ steps.release.outputs.url }}
    steps:
      - name: Download flow output artefact
        if: needs.resolve-pr.outputs.docs_only != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: flow-output
          path: flow-output

      - name: Collect flow image assets
        id: collect
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Per-flow tarball — friendlier than uploading thousands of
          # individual .webp files. Empty flow-output is fine; tar over an
          # empty loop body is a no-op.
          if [ -d flow-output ]; then
            for flow_dir in flow-output/*/; do
              [ -d "$flow_dir" ] || continue
              flow=$(basename "$flow_dir")
              tar -C "$flow_dir" -czf "release-assets/${flow}.tar.gz" .
              echo "Packed $flow"
            done
          fi
          ls -la release-assets/ || true

      - name: Compose release body
        id: body
        env:
          PR_BODY: ${{ needs.resolve-pr.outputs.pr_body }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
          PR_AUTHOR: ${{ needs.resolve-pr.outputs.pr_author }}
          NEW: ${{ needs.resolve-pr.outputs.new_version }}
          PREVIOUS: ${{ needs.resolve-pr.outputs.previous_tag }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          {
            printf '%s\n\n' "$PR_BODY"
            printf -- '---\n\n'
            printf '**PR:** [#%s](%s/%s/pull/%s) by @%s\n\n' \
              "$PR_NUMBER" "$SERVER" "$REPO" "$PR_NUMBER" "$PR_AUTHOR"
            printf '**Diff:** [%s → v%s](%s/%s/compare/%s...v%s)\n' \
              "$PREVIOUS" "$NEW" "$SERVER" "$REPO" "$PREVIOUS" "$NEW"
          } > release-body.md
          echo "Wrote release-body.md ($(wc -c < release-body.md) bytes)"

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.resolve-pr.outputs.new_version }}
          name: ${{ needs.resolve-pr.outputs.pr_title }}
          body_path: release-body.md
          files: release-assets/*.tar.gz
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-release:
    name: notify-release
    needs: [resolve-pr, create-release]
    if: needs.resolve-pr.outputs.should_release == 'true'
    permissions: {}
    # APPRISE_URLS lives in this main-only Environment.
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Apprise
        run: pip install apprise==1.9.9

      - name: Send Apprise notification
        env:
          APPRISE_URLS: ${{ secrets.APPRISE_URLS }}
          NEW: ${{ needs.resolve-pr.outputs.new_version }}
          TITLE: ${{ needs.resolve-pr.outputs.pr_title }}
          URL: ${{ needs.create-release.outputs.release_url }}
        run: |
          if [ -z "${APPRISE_URLS:-}" ]; then
            echo "::warning title=Notification skipped::APPRISE_URLS is not set in the 'release' Environment (docs/GITHUB-CONFIG.md)."
            exit 0
          fi
          apprise -t "markoto v${NEW} released" \
                  -b "${TITLE}

          Release notes: ${URL}
          Deploy will fire automatically (deploy.yml on release.published)." \
                  -i markdown \
                  "${APPRISE_URLS}"
