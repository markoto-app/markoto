# Development infrastructure only.
# Run: docker compose -f docker-compose.dev.yml up -d
#
# This starts Postgres, SeaweedFS (S3 for image uploads + backups in dev),
# Hocuspocus sync, Pandoc, and the backup sidecar.
#
# Production uses external S3 (Infomaniak) and drops SeaweedFS entirely;
# only this dev compose still ships it.
#
# Postgres:   localhost:5432  (postgres://ypad:devpassword@localhost:5432/ypad)
# Valkey:     localhost:6379  (redis://localhost:6379/0 — rate limit + future cache)
# SeaweedFS:  http://localhost:8333  (S3 API for image uploads + dev backups)
# Hocuspocus: ws://localhost:4001    (WebSocket sync — connects directly to PG inside the container)
# Pandoc:     http://localhost:8080  (conversion API)

services:
  postgres:
    image: postgres:16-alpine@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
    restart: unless-stopped
    environment:
      - POSTGRES_USER=ypad
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=ypad
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ypad -d ypad"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    ports:
      - "5432:5432"

  valkey:
    image: valkey/valkey:8-alpine@sha256:1cb6b20b70d927560cc4cc5397b5f045e74aa603ff7696274778880bb6fadc75
    restart: unless-stopped
    # AOF with fsync-every-second is a fine trade for rate-limit data: worst
    # case we lose ≤1s of hits on crash, sliding windows self-heal.
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data

  seaweedfs:
    # Pinned to match production (docker-compose.yml). Bump together.
    image: chrislusf/seaweedfs@sha256:854479eebcbc0060d803edb27b3bd88a0552e23fde08a26a6482e59aff887a77
    restart: unless-stopped
    command: >
      server -s3
      -ip=seaweedfs -ip.bind=0.0.0.0
      -dir=/data -s3.config=/etc/seaweedfs/s3.json -s3.port=8333
    ports:
      - "8333:8333"
    volumes:
      - seaweed_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  sync:
    build:
      # Build from the repo root so shared/utils/ is visible to the
      # sync-server Dockerfile's COPY step.
      context: .
      dockerfile: sync-server/Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - PORT=4001
      - DATABASE_URL=postgres://ypad:devpassword@postgres:5432/ypad
      - JWT_SECRET=development-jwt-secret-change-me-in-production-64chars
      - INTERNAL_API_SECRET=development-internal-api-secret-change-me
      # Sync server reaches the Nuxt app on host for activity logging.
      # host.docker.internal works on Mac/Windows; on Linux, use host-gateway extra_host.
      - APP_URL=http://host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy

  pandoc:
    build: ./pandoc-server
    restart: unless-stopped
    ports:
      - "8080:8080"

  # Same image / script as prod. Short interval so devs can verify the loop
  # without waiting a day; retention low so SeaweedFS doesn't grow unbounded.
  backup:
    build: ./backup-server
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=ypad
      - POSTGRES_DB=ypad
      - PGPASSWORD=devpassword
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_ACCESS_KEY=ypad-access-key
      - S3_SECRET_KEY=ypad-secret-key
      - S3_BUCKET=ypad
      - BACKUP_INTERVAL_SECONDS=3600   # 1 h in dev (tight loop for testing)
      - BACKUP_RETENTION_COUNT=5
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started

volumes:
  pg_data:
  seaweed_data:
  valkey_data:
