# Development infrastructure only.
# Run: docker compose -f docker-compose.dev.yml up -d
#
# This starts Postgres, Valkey, SeaweedFS (S3 for image uploads + backups in dev),
# Hocuspocus sync, markitdown (file → markdown converter), and the backup sidecar.
#
# Production uses external S3 (Infomaniak) and drops SeaweedFS entirely;
# only this dev compose still ships it.
#
# Postgres:    localhost:5432  (credentials from .env: POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB)
# Valkey:      localhost:6379  (rate limit + session locks)
# SeaweedFS:   http://localhost:8333  (S3 API for image uploads + dev backups)
# Hocuspocus:  ws://localhost:4001    (WebSocket sync — connects directly to PG inside the container)
# Markitdown:  http://localhost:8080  (file → markdown conversion API)
#
# Policy: every credential below comes from .env via `${X:?required}`.
# No hardcoded passwords. No `${X:-default}` fallbacks. .env is the single
# source of truth — `docker compose up` fails fast if a value is missing
# rather than booting with a stale or default one.

services:
  postgres:
    # pgvector/pgvector is Postgres 16 (alpine-based) with the `vector`
    # extension pre-built. Drop-in replacement for postgres:16-alpine —
    # data directory + client protocol are identical; CREATE EXTENSION
    # vector is run by the first migration.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT required}:5432"

  valkey:
    image: valkey/valkey:8-alpine@sha256:1cb6b20b70d927560cc4cc5397b5f045e74aa603ff7696274778880bb6fadc75
    restart: unless-stopped
    # AOF with fsync-every-second is a fine trade for rate-limit data: worst
    # case we lose ≤1s of hits on crash, sliding windows self-heal.
    # 1gb headroom for rate-limit + presence + render-singleflight + sweep-lock
    # keyspaces under sustained load. allkeys-lru is correct for our shape
    # (cache-with-some-locks); locks have short TTLs and the rate-limit
    # fail-open path is documented.
    #
    # `--requirepass` is enforced even in dev so the auth code path runs
    # against the same shape it will in prod (and so "tests pass locally
    # without auth, then fail at deploy" can't happen). `VALKEY_PASSWORD`
    # defaults to a weak literal here ONLY because dev exposes 6379 on
    # localhost — no real data, no internet exposure. Production is
    # `:?required` and forces a real secret.
    command:
      - "valkey-server"
      - "--requirepass"
      - "${VALKEY_PASSWORD:-devpassword}"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--maxmemory"
      - "1gb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    healthcheck:
      test: ["CMD", "valkey-cli", "--no-auth-warning", "-a", "${VALKEY_PASSWORD:-devpassword}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # `ports:` IS correct here — the Nuxt app runs on the host (`bun run
    # dev`) and reaches Valkey on `localhost:6379`. Prod and local use
    # `expose:` instead because the app runs in a container.
    ports:
      - "${VALKEY_PORT:?VALKEY_PORT required}:6379"
    volumes:
      - valkey_data:/data

  seaweedfs:
    # Pinned to match production (docker-compose.yml). Bump together.
    image: chrislusf/seaweedfs@sha256:854479eebcbc0060d803edb27b3bd88a0552e23fde08a26a6482e59aff887a77
    restart: unless-stopped
    command: >
      server -s3
      -ip=seaweedfs -ip.bind=0.0.0.0
      -dir=/data -s3.config=/etc/seaweedfs/s3.json -s3.port=8333
    ports:
      - "8333:8333"
    volumes:
      - seaweed_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  sync:
    build:
      # Build from the repo root so shared/utils/ is visible to the
      # sync-server Dockerfile's COPY step.
      context: .
      dockerfile: sync-server/Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - PORT=4001
      # Postgres parts pulled from .env. POSTGRES_HOST overridden inline:
      # the container reaches Postgres via the docker service name, not
      # localhost.
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - JWT_SECRET=${NUXT_JWT_SECRET:?NUXT_JWT_SECRET required}
      - JWT_SECRET_PREVIOUS=${NUXT_JWT_SECRET_PREVIOUS}
      - INTERNAL_API_SECRET=${NUXT_INTERNAL_API_SECRET:?NUXT_INTERNAL_API_SECRET required}
      - INTERNAL_API_SECRET_PREVIOUS=${NUXT_INTERNAL_API_SECRET_PREVIOUS}
      # Valkey — backs per-doc attribution + diff baselines (was three
      # process-local Maps). Same default as the valkey service so the
      # sync container can authenticate when .env leaves VALKEY_PASSWORD
      # blank.
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - VALKEY_PASSWORD=${VALKEY_PASSWORD:-devpassword}
      - VALKEY_DB=${VALKEY_DB:-0}
      # Sync server reaches the Nuxt app on host for activity logging.
      # host.docker.internal works on Mac/Windows; on Linux, use host-gateway extra_host.
      - APP_URL=http://host.docker.internal:3000
      # Dev tabs + HMR reconnects from a single host machine blow
      # past the prod default (20). Bump the cap aggressively so
      # devs don't get rate-limited every reload. Override via
      # SYNC_MAX_CONNECTIONS_PER_IP if you want to test the limit.
      - SYNC_MAX_CONNECTIONS_PER_IP=${SYNC_MAX_CONNECTIONS_PER_IP:-500}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  markitdown:
    build: ./markitdown-server
    restart: unless-stopped
    ports:
      - "8080:8080"

  # Backend PDF + PNG renderer. Playwright + Chromium drives the existing
  # paged.js preview pipeline against /_internal/render/:docId on the app.
  # Internal-network-only in prod/local; dev publishes 9000 so the host
  # `bun run dev` can call it directly.
  renderer:
    build: ./renderer
    restart: unless-stopped
    stop_grace_period: 30s
    # Cap memory: a doc with hundreds of inline images can OOM Chromium
    # silently. 2 GB is comfortable for typical loads (≤50 pages, ≤30
    # images) and lets multiple concurrent renders coexist with the host.
    # Below ~1 GB Chromium becomes unstable; above 4 GB rarely buys you
    # anything for paginated docs.
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --tries=1 --timeout=3 http://127.0.0.1:9000/health || exit 1"]
      interval: 30s
      timeout: 5s
      # Cold-start budget: Playwright launches Chromium lazily on the
      # first /render request, but the HTTP server itself is up within a
      # second. Give it 30 s anyway so a slow image fetch doesn't trip
      # the healthcheck and trigger a restart loop.
      start_period: 30s
      retries: 3
    environment:
      - PORT=9000
      - INTERNAL_API_SECRET=${NUXT_INTERNAL_API_SECRET:?NUXT_INTERNAL_API_SECRET required}
      # Renderer's Chromium navigates back to the Nuxt app's print page.
      # Dev = host bun via host.docker.internal; prod = compose service name.
      - APP_URL=http://host.docker.internal:3000
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_ACCESS_KEY=${NUXT_S3_ACCESS_KEY:?NUXT_S3_ACCESS_KEY required}
      - S3_SECRET_KEY=${NUXT_S3_SECRET_KEY:?NUXT_S3_SECRET_KEY required}
      - S3_BUCKET=${NUXT_S3_BUCKET:?NUXT_S3_BUCKET required}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9000:9000"

  # Same image / script as prod. Short interval so devs can verify the loop
  # without waiting a day; retention low so SeaweedFS doesn't grow unbounded.
  backup:
    build: ./backup-server
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_ACCESS_KEY=${NUXT_S3_ACCESS_KEY:?NUXT_S3_ACCESS_KEY required}
      - S3_SECRET_KEY=${NUXT_S3_SECRET_KEY:?NUXT_S3_SECRET_KEY required}
      - S3_BUCKET=${NUXT_S3_BUCKET:?NUXT_S3_BUCKET required}
      - BACKUP_INTERVAL_SECONDS=3600   # 1 h in dev (tight loop for testing)
      - BACKUP_RETENTION_COUNT=5
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started

volumes:
  pg_data:
  seaweed_data:
  valkey_data:
