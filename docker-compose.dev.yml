# Development infrastructure only.
# Run: docker compose -f docker-compose.dev.yml up -d
#
# This starts Postgres, Valkey, SeaweedFS (S3 for image uploads + backups in dev),
# Hocuspocus sync, markitdown (file → markdown converter), and the backup sidecar.
#
# Production uses external S3 (OVH Object Storage) and drops SeaweedFS
# entirely; only this dev compose still ships it.
#
# Postgres:    localhost:5432  (credentials from .env: POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB)
# Valkey:      localhost:6379  (rate limit + session locks)
# SeaweedFS:   http://localhost:8333  (S3 API for image uploads + dev backups)
# Hocuspocus:  ws://localhost:4001    (WebSocket sync — connects directly to PG inside the container)
# Markitdown:  http://localhost:8080  (file → markdown conversion API)
#
# Policy: every credential below comes from .env via `${X:?required}`.
# No hardcoded passwords. .env is the single source of truth — `docker
# compose up` fails fast if a value is missing.
#
# Common service shape lives in docker-compose.base.yml (see header).
# This file overrides only what's dev-specific: ports published to the
# host (vs internal-only `expose:`), the host-gateway extra_host so the
# sync/renderer containers can reach `bun run dev` on the host, and the
# `${VALKEY_PASSWORD:-devpassword}` fallback so the stack boots without
# a populated .env (prod is `:?required`).

include:
  - docker-compose.base.yml

services:
  postgres:
    healthcheck:
      # Tighter cold-start budget in dev — empty data dir, fast boot.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT required}:5432"

  litellm:
    # Publish 4000 on the host so the host-side `bun run dev` can reach
    # the proxy at http://localhost:4000.
    ports:
      - "4000:4000"

  valkey:
    # `--requirepass` is enforced even in dev so the auth code path runs
    # against the same shape it will in prod (and so "tests pass locally
    # without auth, then fail at deploy" can't happen). `VALKEY_PASSWORD`
    # defaults to a weak literal here ONLY because dev exposes 6379 on
    # localhost — no real data, no internet exposure. Production is
    # `:?required` and forces a real secret. `command:` is replaced
    # wholesale on merge, so the strict form in base.yml is dropped.
    command:
      - "valkey-server"
      - "--requirepass"
      - "${VALKEY_PASSWORD:-devpassword}"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--maxmemory"
      - "1gb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    healthcheck:
      test: ["CMD", "valkey-cli", "--no-auth-warning", "-a", "${VALKEY_PASSWORD:-devpassword}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # `ports:` IS correct here — the Nuxt app runs on the host (`bun run
    # dev`) and reaches Valkey on `localhost:6379`. Prod and local use
    # `expose:` instead because the app runs in a container.
    ports:
      - "${VALKEY_PORT:?VALKEY_PORT required}:6379"

  # Defined inline (not in base) — prod uses external S3 and `include:`
  # has no "drop service" mechanic. See header in docker-compose.base.yml.
  seaweedfs:
    image: chrislusf/seaweedfs@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
    restart: unless-stopped
    # `-master.volumeSizeLimitMB=256`: recent SeaweedFS derives how many
    # volumes a server may hold from free disk / volume size limit (default
    # 30 GB). On a small /data -- e.g. the tmpfs on a 16 GB CI runner -- that
    # leaves no free volume slot and every PUT fails with "No writable
    # volumes" (surfaced by the renderer as an S3 InternalError / "Renderer
    # 500"). Small volumes keep plenty of slots on any realistic disk.
    command: >
      server -s3
      -ip=seaweedfs -ip.bind=0.0.0.0
      -dir=/data -s3.config=/etc/seaweedfs/s3.json -s3.port=8333
      -master.volumeSizeLimitMB=256
    ports:
      - "8333:8333"
    volumes:
      - seaweed_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  sync:
    build:
      # Build from the repo root so shared/utils/ is visible to the
      # sync-server Dockerfile's COPY step.
      context: .
      dockerfile: sync-server/Dockerfile
    environment:
      - JWT_SECRET=${NUXT_JWT_SECRET:?NUXT_JWT_SECRET required}
      - JWT_SECRET_PREVIOUS=${NUXT_JWT_SECRET_PREVIOUS}
      - INTERNAL_API_SECRET=${NUXT_INTERNAL_API_SECRET:?NUXT_INTERNAL_API_SECRET required}
      - INTERNAL_API_SECRET_PREVIOUS=${NUXT_INTERNAL_API_SECRET_PREVIOUS}
      # Same default as the valkey service so the sync container can
      # authenticate when .env leaves VALKEY_PASSWORD blank.
      - VALKEY_PASSWORD=${VALKEY_PASSWORD:-devpassword}
      # Sync server reaches the Nuxt app on host for activity logging.
      # host.docker.internal works on Mac/Windows; on Linux, use
      # host-gateway extra_host (see below).
      - APP_URL=http://host.docker.internal:3000
      # Dev tabs + HMR reconnects from a single host machine blow past
      # the prod default (20). Bump the cap aggressively so devs don't
      # get rate-limited every reload. Override via
      # SYNC_MAX_CONNECTIONS_PER_IP if you want to test the limit.
      - SYNC_MAX_CONNECTIONS_PER_IP=${SYNC_MAX_CONNECTIONS_PER_IP:-500}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4001:4001"

  markitdown:
    build: ./markitdown-server
    ports:
      - "8080:8080"

  # Dev publishes 9000 so the host `bun run dev` can call the renderer
  # directly. In prod/local the renderer is internal-network-only.
  renderer:
    build: ./renderer
    environment:
      # Renderer's Chromium navigates back to the Nuxt app's print page.
      # Dev = host bun via host.docker.internal.
      - APP_URL=http://host.docker.internal:3000
      - S3_ENDPOINT=http://seaweedfs:8333
      # Presigned image URLs use the app's NUXT_S3_ENDPOINT (localhost:8333
      # in .env.example); the renderer's network allowlist must admit it.
      - S3_PUBLIC_ENDPOINT=http://localhost:8333
      # SeaweedFS doesn't support SSE-S3 — omit the encryption header or
      # PDF/PNG render uploads fail with an opaque S3 InternalError.
      - S3_SSE=none
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9000:9000"

  # Same image / script as prod. Short interval so devs can verify the
  # loop without waiting a day; retention low so SeaweedFS doesn't grow
  # unbounded.
  backup:
    build: ./backup-server
    environment:
      - S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-http://seaweedfs:8333}
      - BACKUP_INTERVAL_SECONDS=3600   # 1 h in dev (tight loop for testing)
      # SeaweedFS rejects the SSE-S3 header (InternalError) — see backup.sh.
      - S3_SSE=none
      - BACKUP_RETENTION_COUNT=5
      # Stub passphrase so the sidecar doesn't restart-loop. Dev
      # backups encrypt against a throwaway key — never used for restore.
      # Prod compose requires a real value via `:?required`.
      - BACKUP_GPG_PASSPHRASE=dev-backup-not-a-real-passphrase
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started

volumes:
  # Declared here (not in base) because seaweedfs is defined per-env —
  # see header in docker-compose.base.yml.
  seaweed_data:
