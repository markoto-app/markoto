# Claim data for /compare/hedgedoc (content/marketing/en/compare/hedgedoc.md).
# Each value: what the table shows, where it comes from, when it was checked.
# markoto's sources point at its docs (site paths) or the code (repo paths).
# Re-check a competitor value at its source before changing `checked`.
name: HedgeDoc
rows:
  - feature: Licence
    markoto:
      value: Source-available (FSL-1.1, becomes Apache-2.0 after two years)
      source: LICENSE
      checked: '2026-11-04'
    competitor:
      value: AGPL-3.0 (open source)
      source: https://github.com/hedgedoc/hedgedoc
      checked: '2026-11-04'
  - feature: Price
    markoto:
      value: Free, hosted or self-hosted
      source: /docs/plans/limits
      checked: '2026-11-04'
    competitor:
      value: Free
      source: https://hedgedoc.org/
      checked: '2026-11-04'
  - feature: Self-hosting
    markoto:
      value: true
      source: /docs/self-hosting
      checked: '2026-11-04'
    competitor:
      value: true
      source: https://hedgedoc.org/
      checked: '2026-11-04'
