# Self-host overlay: co-branding for a managed private instance (WP16).
# The customer's logo is read from ./branding (next to this file) and
# shown beside the markoto wordmark; the name and support contact come
# from .env (NUXT_INSTANCE_BRAND_NAME, NUXT_INSTANCE_SUPPORT_URL,
# NUXT_INSTANCE_SUPPORT_EMAIL — see docs/MANAGED-INSTANCE.md).
#
#   COMPOSE_FILE=docker-compose.selfhost.yml:docker-compose.selfhost.tls.yml:docker-compose.selfhost.brand.yml
#
# Put the logo at ./branding/logo.svg (or set NUXT_INSTANCE_BRAND_LOGO to
# /app/branding/<file>.png|webp|jpg). At most 1 MB; it is drawn at the
# wordmark's height (18–20 px), so a wide, simple mark works best.
#
# Merge semantics: `volumes` replace the base definition (the app has
# none), `environment` merges per key.

services:
  app:
    volumes:
      - ./branding:/app/branding:ro,z
    environment:
      - NUXT_INSTANCE_BRAND_LOGO=${NUXT_INSTANCE_BRAND_LOGO:-/app/branding/logo.svg}
