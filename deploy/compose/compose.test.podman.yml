# Podman overlay for the test stack. Use it together with the main file:
#
#   docker compose -f deploy/compose/compose.test.yml -f deploy/compose/compose.test.podman.yml up -d --wait
#
# or set COMPOSE_FILE=deploy/compose/compose.test.yml:deploy/compose/compose.test.podman.yml
# in .env so `bun run test:integration:up` / `flows:up` pick it up.
# Everything else in the test stack runs unchanged on rootless Podman.
# See docs/contributing/CONTAINER-ENGINES.md.

services:
  renderer-test:
    # Compose sends a seccomp profile to the engine as inline JSON (Docker's
    # API contract); Podman's Docker-compatible API reads that value as a
    # file path and refuses it ("file name too long"). Podman's own default
    # profile already allows the user-namespace syscalls Chromium's sandbox
    # needs, except chroot without CAP_SYS_CHROOT — so: Podman's default
    # profile plus that one capability. Podman hands added capabilities to
    # the non-root `pwuser` as ambient capabilities; CAP_SYS_CHROOT alone
    # changes the root directory inside the container's own mount
    # namespace and grants nothing outside it.
    security_opt: !override
      - no-new-privileges:true
    cap_add:
      - SYS_CHROOT
