      - TIER_FREE_FEATURE_CUSTOM_DOMAINS=${TIER_FREE_FEATURE_CUSTOM_DOMAINS:-}
      - TIER_PRO_FEATURE_SSO=${TIER_PRO_FEATURE_SSO:-}
      - TIER_PRO_FEATURE_AUDIT_LOG=${TIER_PRO_FEATURE_AUDIT_LOG:-}
      - TIER_PRO_FEATURE_GUESTS=${TIER_PRO_FEATURE_GUESTS:-}
      - TIER_PRO_FEATURE_BRAND_KIT=${TIER_PRO_FEATURE_BRAND_KIT:-}
      - TIER_TEAM_FEATURE_SSO=${TIER_TEAM_FEATURE_SSO:-}
      - TIER_TEAM_FEATURE_AUDIT_LOG=${TIER_TEAM_FEATURE_AUDIT_LOG:-}
      - NUXT_LEGAL_CONTROLLER_NAME=${NUXT_LEGAL_CONTROLLER_NAME:-}
      - NUXT_LEGAL_CONTROLLER_ADDRESS=${NUXT_LEGAL_CONTROLLER_ADDRESS:-}
      - NUXT_LEGAL_PRIVACY_CONTACT_EMAIL=${NUXT_LEGAL_PRIVACY_CONTACT_EMAIL:-}
      - NUXT_LEGAL_ABUSE_CONTACT_EMAIL=${NUXT_LEGAL_ABUSE_CONTACT_EMAIL:-}
      - NUXT_LEGAL_GOVERNING_LAW=${NUXT_LEGAL_GOVERNING_LAW:-}
      - NUXT_LEGAL_LEGAL_FORM=${NUXT_LEGAL_LEGAL_FORM:-}
      - NUXT_LEGAL_REGISTERED_OFFICE=${NUXT_LEGAL_REGISTERED_OFFICE:-}
      - NUXT_LEGAL_REPRESENTED_BY=${NUXT_LEGAL_REPRESENTED_BY:-}
      - NUXT_LEGAL_UID=${NUXT_LEGAL_UID:-}
      - NUXT_LEGAL_CH_ID=${NUXT_LEGAL_CH_ID:-}
      - NUXT_LEGAL_EHRA_ID=${NUXT_LEGAL_EHRA_ID:-}
      - NUXT_AUDIT_LOG_RETENTION_DAYS=${NUXT_AUDIT_LOG_RETENTION_DAYS:-}
      - NUXT_ABUSE_REPORT_RETENTION_DAYS=${NUXT_ABUSE_REPORT_RETENTION_DAYS:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - NUXT_EMAIL_FROM=${NUXT_EMAIL_FROM:-}
      - NUXT_EMAIL_PROVIDER=${NUXT_EMAIL_PROVIDER:-}
      - NUXT_PUBLISH_PAGES_HOST=${NUXT_PUBLISH_PAGES_HOST:-}
      - NUXT_PUBLISH_DOMAINS_TARGET=${NUXT_PUBLISH_DOMAINS_TARGET:-}
      - NUXT_PUBLISH_TRAEFIK_TOKEN=${NUXT_PUBLISH_TRAEFIK_TOKEN:-}
      - NUXT_PUBLIC_SENTRY_DSN=${NUXT_PUBLIC_SENTRY_DSN:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      # END env:gen app
      - NUXT_S3_BUCKET=${NUXT_S3_BUCKET:?NUXT_S3_BUCKET required}
      # Anonymous gate (server/utils/anonGate/): HMAC key of the self-hosted
      # ALTCHA bot check + the remembered-terms cookie. Required: the hosted
      # service gates anonymous documents and reports.
      - NUXT_ALTCHA_HMAC_KEY=${NUXT_ALTCHA_HMAC_KEY:?NUXT_ALTCHA_HMAC_KEY required}
      # Bring-your-own-key AI. No defaults here: the hosted SaaS sets
      # no instance AI defaults (users bring their own key) and renders the
      # provider allowlist into .env (infra/render-env.sh). Self-hosters set
      # NUXT_AI_DEFAULT_* in .env. See server/utils/aiProviders/config.ts.
      - NUXT_AI_DEFAULT_CHAT_BASE_URL=${NUXT_AI_DEFAULT_CHAT_BASE_URL:-}
      - NUXT_AI_DEFAULT_CHAT_API_KEY=${NUXT_AI_DEFAULT_CHAT_API_KEY:-}
      - NUXT_AI_DEFAULT_IMAGE_BASE_URL=${NUXT_AI_DEFAULT_IMAGE_BASE_URL:-}
      - NUXT_AI_DEFAULT_IMAGE_API_KEY=${NUXT_AI_DEFAULT_IMAGE_API_KEY:-}
      - NUXT_AI_DEFAULT_TRANSCRIBE_BASE_URL=${NUXT_AI_DEFAULT_TRANSCRIBE_BASE_URL:-}
      - NUXT_AI_DEFAULT_TRANSCRIBE_API_KEY=${NUXT_AI_DEFAULT_TRANSCRIBE_API_KEY:-}
      # Hosted shape: the provider allowlist is mandatory (the app also
      # refuses to boot with legal surfaces on and an empty list). Rendered
      # by infra/render-env.sh.
      - NUXT_AI_BYOK_ALLOWED_BASE_URLS=${NUXT_AI_BYOK_ALLOWED_BASE_URLS:?NUXT_AI_BYOK_ALLOWED_BASE_URLS required (BYOK provider allowlist)}
      - NUXT_AI_BYOK_ALLOW_PRIVATE_URLS=${NUXT_AI_BYOK_ALLOW_PRIVATE_URLS:-false}
      # LiteLLM proxy. server/plugins/01-validate-secrets.ts requires the
      # LiteLLM pair unconditionally, so the app crash-loops at boot without
      # these. The URL targets the in-network proxy; the master key matches
      # the one mounted into the litellm container from .env.
      - NUXT_LITELLM_URL=http://litellm:4000
      # Embeddings (self-hosters can override; hosted keeps these defaults,
      # which equal the nuxt.config.ts defaults). docs/AI-MODELS.md#embeddings
      - NUXT_LITELLM_EMBEDDINGS_MODEL=${NUXT_LITELLM_EMBEDDINGS_MODEL:-jina-embeddings-v5-text-nano}
      - NUXT_LITELLM_EMBEDDINGS_DIMS=${NUXT_LITELLM_EMBEDDINGS_DIMS:-768}
      - NUXT_LITELLM_EMBEDDINGS_SEND_DIMENSIONS=${NUXT_LITELLM_EMBEDDINGS_SEND_DIMENSIONS:-auto}
      - NUXT_LITELLM_EMBEDDINGS_TASK_HINTS=${NUXT_LITELLM_EMBEDDINGS_TASK_HINTS:-auto}
      - NUXT_LITELLM_EMBEDDINGS_UPSTREAM_MODEL=${EMBEDDINGS_UPSTREAM_MODEL:-}
      - NUXT_LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY required}
      # LiteLLM's own Postgres role, for the spend-log sweep + admin spend
      # query (server/utils/litellm/litellmDb.ts); empty = the app role.
      - NUXT_LITELLM_DB_USER=${POSTGRES_LITELLM_USER:-}
      - NUXT_LITELLM_DB_PASSWORD=${POSTGRES_LITELLM_PASSWORD:-}
      # Cookieless analytics (docs/SELF-HOSTING.md#analytics-optional). The website id
      # (from Umami, after its first login) switches the browser side on;
      # the in-network URL counts published-page views (only while the
      # `analytics` profile runs Umami); Umami's own role lets the app
      # delete expired visitor data in the umami database.
      - NUXT_PUBLIC_ANALYTICS_WEBSITE_ID=${NUXT_PUBLIC_ANALYTICS_WEBSITE_ID:-}
      - NUXT_PUBLIC_ANALYTICS_ADS_CONVERSIONS=${NUXT_PUBLIC_ANALYTICS_ADS_CONVERSIONS:-false}
      - NUXT_ANALYTICS_INTERNAL_URL=${UMAMI_APP_SECRET:+http://umami:3000}
      - NUXT_ANALYTICS_DB_USER=${POSTGRES_UMAMI_USER:-}
      - NUXT_ANALYTICS_DB_PASSWORD=${POSTGRES_UMAMI_PASSWORD:-}
      # Billing mode (shared/config/billingMode.ts). Default: billing OFF,
      # no Stripe calls, Stripe vars not required, everyone on the free tier.
      # NUXT_PLANS_COMING_SOON=true is the hosted free-only SaaS (pricing
      # page "coming soon" + waitlist); leave it false when self-hosting.
      - NUXT_BILLING_ENABLED=${NUXT_BILLING_ENABLED:-false}
      - NUXT_PLANS_COMING_SOON=${NUXT_PLANS_COMING_SOON:-false}
      # Legal surfaces (shared/config/instance.ts): onboarding gate, consent
      # banner, DPA step, /legal/* pages. This file is the HOSTED stack, so
      # they default ON here (the code default is off, for self-hosters,
      # see deploy/compose/compose.selfhost.yml).
      - NUXT_LEGAL_SURFACES_ENABLED=${NUXT_LEGAL_SURFACES_ENABLED:-true}
      # Terms + bot check before anonymous documents / reports
      # (shared/config/anonGate.ts). ON for the hosted service.
      - NUXT_ANON_GATE_ENABLED=${NUXT_ANON_GATE_ENABLED:-true}
      # Marketing site (shared/config/instance.ts): the product tour at /
      # for logged-out visitors, sitemap.xml, the JSON-LD on / and the
      # hosted-only marketing pages. ON here; the code default (self-host)
      # is off. The former NUXT_PRODUCT_TOUR_ENABLED is still honoured as
      # the fallback for one release.
      - NUXT_MARKETING_SITE_ENABLED=${NUXT_MARKETING_SITE_ENABLED:-${NUXT_PRODUCT_TOUR_ENABLED:-true}}
      # Search-engine indexing. Staging renders false (robots.txt
      # Disallow: / + X-Robots-Tag: noindex on every response).
      - NUXT_SITE_INDEXABLE=${NUXT_SITE_INDEXABLE:-true}
      # Customer domains get their own headers: HSTS without
      # includeSubDomains / preload (those would bind the customer's other
      # subdomains and put their domain on the browser preload list).
      # On staging the edge login (`edge-auth`, below) goes in front of
      # them too; empty EDGE_BASIC_AUTH_USERS (prod) leaves it out.
      - NUXT_PUBLISH_TRAEFIK_MIDDLEWARES=custom-domain-headers@docker,${EDGE_BASIC_AUTH_USERS:+edge-auth@docker,}app-compress@docker
      # Number of trusted reverse proxies in front of the app (Traefik = 1).
      # See shared/utils/security/clientIp.ts.
      - NUXT_TRUSTED_PROXY_HOPS=${NUXT_TRUSTED_PROXY_HOPS:-1}
      # Public origin for absolute links in emails (waitlist confirm /
      # unsubscribe). Pinned to DOMAIN so links never follow a spoofed Host.
      - NUXT_SITE_URL=https://${DOMAIN:?DOMAIN required}
      # Anonymous documents are deleted after this many inactive days (0 =
      # never). Defaulted here, not left empty: it is a runtimeConfig key,
      # and an empty env value would override the code default and turn
      # the sweep off.
      - NUXT_INACTIVE_DOC_TTL_DAYS=${NUXT_INACTIVE_DOC_TTL_DAYS:-30}
      # Internal services, and the browser's sync endpoint.
      - NUXT_PUBLIC_SYNC_URL=wss://sync.${DOMAIN:?DOMAIN required}
      - NUXT_SYNC_INTERNAL_URL=http://sync:4001
      - NUXT_MARKITDOWN_URL=http://markitdown:8080
      - NUXT_RENDERER_INTERNAL_URL=http://renderer:9000
      # Postgres + Valkey atomic parts. HOST/PORT default to the in-stack
      # container; a managed-Postgres deployment overrides them via .env
      # (POSTGRES_HOST=<cluster-host> POSTGRES_PORT=<port> + the TLS vars
      # below). The Nuxt app composes the URL via
      # shared/utils/runtime/connectionStrings.ts. In managed mode the
      # bundled postgres service is not started (its profile is off).
      # POSTGRES_APP_* = the app's own least-privilege role (owner of the app
      # database only, deploy/config/postgres/db-init.sh); unset = the admin role.
      - POSTGRES_USER=${POSTGRES_APP_USER:-${POSTGRES_USER}}
      - POSTGRES_PASSWORD=${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - VALKEY_DB=${VALKEY_DB:?VALKEY_DB required}
      # Postgres TLS posture: see shared/utils/runtime/postgresSsl.ts and the operator runbook, kept outside this repository.
      # Empty PGSSLROOTCERT is fine: prod default is rejectUnauthorized
      # against the system CA bundle. Set it to a bind-mounted PEM path
      # (e.g. /run/secrets/managed_pg_ca.pem) for cert-pin verification.
      - NODE_ENV=production
      - PGSSLROOTCERT=${PGSSLROOTCERT:-}
    # Image user `bun`; nothing in /app is writable. Bun only needs /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=256m
    <<: *hardening
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      # Service-to-service routes stay off the public edge (no router
      # matches → Traefik 404s): /api/internal/** (sync → app, Traefik's own
      # provider poll goes to app:3000 directly) and the renderer's print
      # page + bootstrap. The app refuses them from the edge too
      # (server/utils/platform/internalRoutes.ts); scripts/selfhost-check.sh pins this.
      - "traefik.http.routers.app.rule=Host(`${DOMAIN}`) && !PathPrefix(`/api/internal/`) && !PathPrefix(`/_internal/render/`) && !Path(`/api/_internal/render-bootstrap`)"
      # Explicit lowest priority: Traefik ranks routers by rule length, and
      # the exclusions above made this catch-all longer than `app-import`.
      - "traefik.http.routers.app.priority=1"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=le"
      - "traefik.http.services.app.loadbalancer.server.port=3000"
      # Routing liveness: the app process + its Postgres and Valkey
      # connections, not sync or the sidecars (server/api/health/live.get.ts),
      # so a sync restart doesn't take every page offline. Cached 5 s;
      # a miss is two parallel probes of at most 1 s.
      - "traefik.http.services.app.loadbalancer.healthcheck.path=/api/health/live"
      - "traefik.http.services.app.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.app.loadbalancer.healthcheck.timeout=10s"
      # Security headers + CSP (see docs/SECURITY-HARDENING.md)
      # Applied to every response from the app router. Traefik's
      # `headers` middleware has named fields for HSTS / CSP / referrer /
      # frame-deny / nosniff; everything else lands in
      # `customResponseHeaders`. Strings with commas / parens / spaces
      # are quoted to survive Compose's CSV-style label parsing.
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      # Content-Security-Policy and Cross-Origin-Resource-Policy are NOT
      # set here: the app sends them itself (server/plugins/csp.ts): the
      # CSP carries a per-response script nonce, and /api/files needs a
      # different CORP than the rest. A Traefik CSP label would be enforced
      # IN ADDITION to the app's policy. See docs/SECURITY-HARDENING.md §2.
      - "traefik.http.middlewares.security-headers.headers.customResponseHeaders.Cross-Origin-Opener-Policy=same-origin"
      - "traefik.http.middlewares.security-headers.headers.customResponseHeaders.Permissions-Policy=camera=(), microphone=(self), geolocation=(), payment=(self)"
      - "traefik.http.routers.app.middlewares=security-headers,${EDGE_BASIC_AUTH_USERS:+edge-auth,}app-compress"
      # Edge login (staging only). EDGE_BASIC_AUTH_USERS is an htpasswd
      # line (`user:<bcrypt>`) that only the staging Environment renders;
      # empty (prod, the default) means no router references `edge-auth`,
      # so there is no login. It keeps strangers from signing up, spending
      # the platform's AI keys or running test-card checkouts on staging.
      # The `$` of the hash need no escaping: compose substitutes the value
      # once and does not interpolate it again (render-env.sh single-quotes
      # it in .env). The Authorization header is dropped before the app.
      - "traefik.http.middlewares.edge-auth.basicauth.users=${EDGE_BASIC_AUTH_USERS:-}"
      - "traefik.http.middlewares.edge-auth.basicauth.realm=markoto staging"
      - "traefik.http.middlewares.edge-auth.basicauth.removeheader=true"
      # Paths that skip the edge login (and route exactly as `app` does
      # when there is none). Each carries its own gate, and none can sign
      # anyone up or spend AI:
      #   - /api/health, /api/health/live, /api/status: deploy health
      #     loops and external monitors;
      #   - /api/webhooks/stripe: Stripe's servers (signature-checked);
      #   - /scim/v2/, /mcp: identity providers / MCP clients sending their
      #     own `Authorization: Bearer` token, which a login would replace;
      #   - GET /api/docs/<id>/meta + /file-token: the editor sends the
      #     doc JWT as Bearer there (password-unlocked visitors);
      #   - /api/ai/dictate: WebSocket, short-lived JWT in its first message;
      #   - /auth/sso/<id>/metadata: SAML metadata the IdP fetches itself;
      #   - /vendor/, /markoto-logos/, /api/files/, /api/docs/<id>/brand/:
      #     what the sandboxed (opaque-origin) preview iframe loads, which
      #     never carries the page's login (server/utils/rendering/csp.ts).
      # The sync host has no login at all (see the sync router).
      - "traefik.http.routers.app-public.rule=Host(`${DOMAIN}`) && (Path(`/api/health`) || Path(`/api/health/live`) || Path(`/api/status`) || Path(`/api/webhooks/stripe`) || PathPrefix(`/scim/v2/`) || Path(`/mcp`) || PathPrefix(`/mcp/`) || (Method(`GET`) && PathRegexp(`^/api/docs/[^/]+/(meta|file-token)$$`)) || Path(`/api/ai/dictate`) || PathRegexp(`^/auth/sso/[^/]+/metadata$$`) || PathPrefix(`/vendor/`) || PathPrefix(`/markoto-logos/`) || PathPrefix(`/api/files/`) || PathRegexp(`^/api/docs/[^/]+/brand/[^/]+$$`))"
      - "traefik.http.routers.app-public.entrypoints=websecure"
      - "traefik.http.routers.app-public.tls.certresolver=le"
      - "traefik.http.routers.app-public.service=app"
      - "traefik.http.routers.app-public.middlewares=security-headers,app-compress"
      # Published pages on customers' own domains (routers from the
      # app's HTTP provider): HSTS for that host only, never its subdomains.
      - "traefik.http.middlewares.custom-domain-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.custom-domain-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.custom-domain-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.custom-domain-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      # Published pages on their own hostname (NUXT_PUBLISH_PAGES_HOST,
      # e.g. pages.markoto.app): only the paths of a published page reach
      # the app, no app route, no internal route, and the app answers
      # anything else there with 404 (server/middleware/00.custom-domain.ts).
      # Same path list as the self-host router in
      # server/utils/customDomains/traefikConfig.ts.
      - "traefik.http.routers.pages.rule=Host(`${NUXT_PUBLISH_PAGES_HOST:?NUXT_PUBLISH_PAGES_HOST required}`) && (PathPrefix(`/p/`) || PathPrefix(`/api/published/`) || PathPrefix(`/vendor/`) || Path(`/robots.txt`) || Path(`/favicon.ico`))"
      - "traefik.http.routers.pages.entrypoints=websecure"
      - "traefik.http.routers.pages.tls.certresolver=le"
      - "traefik.http.routers.pages.service=app"
      - "traefik.http.routers.pages.middlewares=custom-domain-headers,${EDGE_BASIC_AUTH_USERS:+edge-auth,}app-compress"
      # Compress dynamic responses (SSR HTML, API JSON, i18n messages).
      # Static assets already arrive precompressed from Nitro
      # (compressPublicAssets) and keep their Content-Encoding; media and
      # archives are excluded, and so is text/event-stream so the AI
      # session stream keeps flushing event by event. WebSocket upgrades
      # (the sync router) never pass this middleware.
      - "traefik.http.middlewares.app-compress.compress=true"
      - "traefik.http.middlewares.app-compress.compress.excludedcontenttypes=text/event-stream,image/png,image/jpeg,image/webp,image/avif,image/gif,video/mp4,video/webm,font/woff2,application/zip,application/pdf,application/octet-stream"
      # /api/import (anonymous document import, 50 MB file cap) gets its own
      # router with a request-body limit, so an oversized or endless upload
      # is cut off at the edge instead of streaming into the app. 51 MiB =
      # the app's MAX_BODY (file + multipart framing). It wins over the
      # catch-all `app` router, which has priority 1.
      - "traefik.http.routers.app-import.rule=Host(`${DOMAIN}`) && Path(`/api/import`)"
      - "traefik.http.routers.app-import.entrypoints=websecure"
      - "traefik.http.routers.app-import.tls.certresolver=le"
      - "traefik.http.routers.app-import.service=app"
      - "traefik.http.routers.app-import.middlewares=${EDGE_BASIC_AUTH_USERS:+edge-auth,}import-body-limit,security-headers"
      - "traefik.http.middlewares.import-body-limit.buffering.maxRequestBodyBytes=53477376"
    depends_on:
      # Not required: absent with a managed cluster (see the header).
      postgres:
        condition: service_healthy
        required: false
      valkey:
        condition: service_healthy
      # Every AI surface routes through LiteLLM. Gate app
      # startup on the proxy being healthy so a cold deploy doesn't
      # 502 user AI calls in the window between app-up and proxy-up.
      litellm:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    # Managed-Postgres CA (render-env points PGSSLROOTCERT here). The dir
    # is auto-created empty when unused: the mount is inert in in-stack
    # mode.
    volumes:
      - /opt/markoto/secrets:/opt/markoto/secrets:ro
    networks:
      web: {}
      data: {}
      import: {}
      render:
        # Chromium (renderer) can't use the service name `app`: it's an
        # HSTS-preloaded TLD, so http://app:3000 is upgraded to https and
        # fails with ERR_SSL_PROTOCOL_ERROR. The renderer uses this alias.
        aliases:
          - markoto-app

  # LiteLLM + the db-init one-shot come from deploy/compose/compose.base.yml via
  # `include:`. Base sets no `networks:` (they would be merged with these,
  # not replaced): every service is pinned to its purpose networks here.
  litellm:
    networks:
      - data
      - egress
    environment:
      # Managed-Postgres override of base's hardcoded @postgres:5432.
      # sslmode=require (encrypted, no CA pin) is enough for the proxy's
      # own bookkeeping DB: the primary data path (app + sync) pins the
      # CA via PGSSLROOTCERT. POSTGRES_LITELLM_* = LiteLLM's own role
      # (owner of the litellm database only); unset = the admin role.
      - DATABASE_URL=postgresql://${POSTGRES_LITELLM_USER:-${POSTGRES_USER}}:${POSTGRES_LITELLM_PASSWORD:-${POSTGRES_PASSWORD}}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/litellm?sslmode=${POSTGRES_SSLMODE:-disable}
  # Database + roles bootstrap (deploy/config/postgres/db-init.sh). On a managed
  # cluster POSTGRES_USER is the cluster's admin user: it needs CREATEDB and
  # CREATEROLE (OVH's default admin user has both): see
  # the operator runbook, kept outside this repository for switching the hosted DB to separate roles.
  db-init:
    networks:
      - data
      - egress
    environment:
      - PGHOST=${POSTGRES_HOST:-postgres}
      - PGPORT=${POSTGRES_PORT:-5432}
      # libpq TLS: require in managed mode, disable in-stack.
      - PGSSLMODE=${POSTGRES_SSLMODE:-disable}
      # Umami's database + role, only when analytics runs (UMAMI_APP_SECRET set).
      - UMAMI_DB=${UMAMI_APP_SECRET:+umami}
      - UMAMI_DB_USER=${POSTGRES_UMAMI_USER:-${POSTGRES_USER}}
      - UMAMI_DB_PASSWORD=${POSTGRES_UMAMI_PASSWORD:-}

  sync:
    image: ${REGISTRY}/markoto-sync:${IMAGE_TAG}
    environment:
      - JWT_SECRET=${NUXT_JWT_SECRET}
      - JWT_SECRET_PREVIOUS=${NUXT_JWT_SECRET_PREVIOUS}
      - INTERNAL_API_SECRET=${NUXT_INTERNAL_API_SECRET}
      - INTERNAL_API_SECRET_PREVIOUS=${NUXT_INTERNAL_API_SECRET_PREVIOUS}
      # Production signal for the shared test-mode guard (shared/utils/security/testMode.ts).
      - NUXT_SITE_URL=https://${DOMAIN:?DOMAIN required}
      - VALKEY_DB=${VALKEY_DB:?VALKEY_DB required}
      - SENTRY_DSN=${SENTRY_DSN}
      - APP_URL=http://app:3000
      # Must match the app's value, or the two key their rate limits on
      # different X-Forwarded-For entries.
      - TRUSTED_PROXY_HOPS=${NUXT_TRUSTED_PROXY_HOPS:-1}
      # Postgres TLS posture: same as the app container.
      - NODE_ENV=production
      - PGSSLROOTCERT=${PGSSLROOTCERT:-}
      - PGSSL=${PGSSL:-}
      # Managed-Postgres override of base's hardcoded service name.
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    volumes:
      - /opt/markoto/secrets:/opt/markoto/secrets:ro
    expose:
      - "4001"
    labels:
      - "traefik.enable=true"
      # Sticky sessions: route all WS connections for a given client
      # cookie to the same sync-server instance. This keeps a single
      # client's awareness/edit stream pinned, but doesn't fully
      # serialize cross-instance flushes for the same docId (two
      # different clients on the same doc CAN land on different
      # instances). The residual cross-instance race on
      # `sync:prev-text:{docId}`: worst case is one duplicate activity
      # row per cross-container concurrency event: not corrupting,
      # just noisy.
      - "traefik.http.services.sync.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.sync.loadbalancer.sticky.cookie.name=sync_sticky"
      - "traefik.http.services.sync.loadbalancer.sticky.cookie.httpOnly=true"
      - "traefik.http.services.sync.loadbalancer.sticky.cookie.secure=true"
      # /internal/** is the app → sync control plane (kick, flush,
      # delete); the app calls http://sync:4001 directly, never via here.
      # No edge login here, also not on staging: the sync host is another
      # origin, so browsers would not reuse the app host's login for the
      # WebSocket, and every connection already needs a doc-scoped JWT
      # that only the app (behind the login) issues.
      - "traefik.http.routers.sync.rule=Host(`sync.${DOMAIN}`) && !PathPrefix(`/internal/`)"
      - "traefik.http.routers.sync.entrypoints=websecure"
      - "traefik.http.routers.sync.tls.certresolver=le"
      - "traefik.http.services.sync.loadbalancer.server.port=4001"
      - "traefik.http.services.sync.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.sync.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.sync.loadbalancer.healthcheck.timeout=3s"
      # Security headers for the sync subdomain. CSP is intentionally
      # omitted: this endpoint serves the Hocuspocus WebSocket upgrade
      # handshake + a /health JSON probe, never HTML, so a CSP policy
      # has nothing to constrain. HSTS / nosniff / frame-deny / referrer
      # still apply: keep parity with the app domain.
      - "traefik.http.middlewares.sync-security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.sync-security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.sync-security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.sync-security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.sync-security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.sync-security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.sync-security-headers.headers.customResponseHeaders.Cross-Origin-Opener-Policy=same-origin"
      - "traefik.http.middlewares.sync-security-headers.headers.customResponseHeaders.Cross-Origin-Resource-Policy=same-site"
      - "traefik.http.routers.sync.middlewares=sync-security-headers"
    networks:
      - web
      - data

  markitdown:
    image: ${REGISTRY}/markoto-markitdown:${IMAGE_TAG}
    expose:
      - "8080"
    # No egress: markitdown converts uploaded bytes and needs nothing else.
    networks:
      - import

  # Backend PDF + PNG renderer: Playwright + Chromium navigates back to the
  # app's /_internal/render/:docId page (gated by INTERNAL_API_SECRET-signed
  # render tokens). Internal-network-only; never reachable from outside.
  renderer:
    image: ${REGISTRY}/markoto-renderer:${IMAGE_TAG}
    environment:
      # Not http://app:3000: see the `markoto-app` alias on the app service.
      - APP_URL=http://markoto-app:3000
      - S3_ENDPOINT=${NUXT_S3_ENDPOINT}
      # Network allowlist (renderer/src/allowlist.ts): app origin, the S3
      # endpoint above and the pinned CDNs. Anything else is aborted.
      - RENDERER_ALLOWED_ORIGINS=${RENDERER_ALLOWED_ORIGINS:-}
    expose:
      - "9000"
    networks:
      - render
      - renderer-egress

  # Cookieless page analytics (docs/SELF-HOSTING.md#analytics-optional). Runs only with
  # COMPOSE_PROFILES=analytics, which infra/render-env.sh sets when
  # UMAMI_APP_SECRET is set. Two routers:
  #   - `umami-collect`: ONLY POST /a/api/send on the main domain (the
  #     browser's events, first-party, no third-party host); /a is stripped.
  #     The tracker script is not served: the app sends its own events.
  #   - `umami`: the dashboard on its own host (UMAMI_HOST), behind an edge
  #     login (UMAMI_BASIC_AUTH_USERS) on top of Umami's own login.
  # Visitor IPs come from X-Real-Ip, which Traefik sets from the PROXY
  # header (a client cannot forge it); location headers from clients are
  # ignored. Umami stores no IP: it hashes IP + user agent with a salt that
  # rotates daily (SALT_ROTATION=day).
  umami:
    profiles:
      - analytics
    image: ghcr.io/umami-software/umami:3.5.0@sha256:b64f40400d77bcadd39cf5c62a1e368c99524ca442024f96e1133355a19a5dbc
    restart: unless-stopped
    # Next.js server + Prisma (migrations at start); ~250 MiB steady.
    mem_limit: 768m
    environment:
      # Its own role (owner of the umami database only) when
      # POSTGRES_UMAMI_USER is set: see db-init.
      #
      # TLS: the app's posture (shared/utils/runtime/postgresSsl.ts).
      # PGSSL=disable (render-env, bundled Postgres) = no TLS; otherwise
      # the certificate chain AND host name are verified, against the
      # managed cluster's CA when PGSSLROOTCERT is set (mounted below),
      # else the system bundle. Two URLs because two clients read them
      # differently: DATABASE_URL is node-postgres (@prisma/adapter-pg:
      # Umami's queries and its start-up check), which takes libpq's
      # `sslmode=verify-full&sslrootcert=<CA>`. DIRECT_DATABASE_URL is
      # `prisma migrate deploy` at start-up (scripts/check-db.js prefers
      # it): its Rust schema engine ignores verify-full / sslrootcert and
      # would connect unverified; it takes the CA as `sslcert` and
      # verifies only with `sslaccept=strict`. (To node-postgres `sslcert`
      # is a client certificate, so one URL cannot serve both.)
      - DATABASE_URL=postgresql://${POSTGRES_UMAMI_USER:-${POSTGRES_USER}}:${POSTGRES_UMAMI_PASSWORD:-${POSTGRES_PASSWORD}}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/umami?sslmode=${PGSSL:-verify-full}${PGSSLROOTCERT:+&sslrootcert=${PGSSLROOTCERT}}
      - DIRECT_DATABASE_URL=postgresql://${POSTGRES_UMAMI_USER:-${POSTGRES_USER}}:${POSTGRES_UMAMI_PASSWORD:-${POSTGRES_PASSWORD}}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/umami?sslmode=${PGSSL:-require&sslaccept=strict}${PGSSLROOTCERT:+&sslcert=${PGSSLROOTCERT}}
      - APP_SECRET=${UMAMI_APP_SECRET:-}
      - CLIENT_IP_HEADER=x-real-ip
      - SKIP_LOCATION_HEADERS=1
      - SALT_ROTATION=day
      - DISABLE_TELEMETRY=1
      - DISABLE_UPDATES=1
    # Image user `nextjs`; nothing in /app is written (no COLLECT_API_ENDPOINT,
    # so the start script leaves the tracker file alone). Next writes its cache.
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /app/.next/cache:size=64m,mode=1777
    # Managed-Postgres CA (PGSSLROOTCERT, read by both URLs above). Same
    # read-only mount as app, sync and backup; inert in-stack.
    volumes:
      - /opt/markoto/secrets:/opt/markoto/secrets:ro
    <<: *hardening
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:3000/api/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.umami.loadbalancer.server.port=3000"
      - "traefik.http.routers.umami-collect.rule=Host(`${DOMAIN}`) && Method(`POST`) && Path(`/a/api/send`)"
      - "traefik.http.routers.umami-collect.entrypoints=websecure"
      - "traefik.http.routers.umami-collect.tls.certresolver=le"
      - "traefik.http.routers.umami-collect.service=umami"
      - "traefik.http.routers.umami-collect.middlewares=security-headers,${EDGE_BASIC_AUTH_USERS:+edge-auth,}umami-strip"
      - "traefik.http.middlewares.umami-strip.stripprefix.prefixes=/a"
      - "traefik.http.routers.umami.rule=Host(`${UMAMI_HOST:-stats.invalid}`)"
      - "traefik.http.routers.umami.entrypoints=websecure"
      - "traefik.http.routers.umami.tls.certresolver=le"
      - "traefik.http.routers.umami.service=umami"
      - "traefik.http.routers.umami.middlewares=security-headers,umami-auth"
      - "traefik.http.middlewares.umami-auth.basicauth.users=${UMAMI_BASIC_AUTH_USERS:-}"
      - "traefik.http.middlewares.umami-auth.basicauth.realm=markoto stats"
      - "traefik.http.middlewares.umami-auth.basicauth.removeheader=true"
    # web: Traefik (and a managed Postgres cluster); data: the bundled one.
    networks:
      - web
      - data

  backup:
    image: ${REGISTRY}/markoto-backup:${IMAGE_TAG}
    volumes:
      - /opt/markoto/secrets:/opt/markoto/secrets:ro
    environment:
      # Managed-Postgres overrides (base hardcodes the in-stack host).
      # pg_dump is libpq: PGSSLMODE/PGSSLROOTCERT are honored natively.
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - PGSSLMODE=${POSTGRES_SSLMODE:-disable}
      - PGSSLROOTCERT=${PGSSLROOTCERT:-}
      - S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-${NUXT_S3_ENDPOINT}}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:?BACKUP_INTERVAL_SECONDS required}
      - BACKUP_RETENTION_COUNT=${BACKUP_RETENTION_COUNT:?BACKUP_RETENTION_COUNT required}
      # Symmetric AES-256 passphrase for client-side backup encryption.
      # Without this the sidecar refuses to start. Rotation invalidates
      # older backups for restore: schedule rotations against the
      # retention window. See the operator runbook, kept outside this repository.
      - BACKUP_GPG_PASSPHRASE=${BACKUP_GPG_PASSPHRASE:?BACKUP_GPG_PASSPHRASE required}
    networks:
      - data
      - egress
