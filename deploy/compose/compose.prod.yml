# Production stack (the hosted service: staging and prod).
# Traefik with Let's Encrypt TLS, all app images pulled from GHCR, external S3.
# The hosts run it on rootless Podman as the `markoto` user (infra/README.md):
# `markoto-compose pull && markoto-compose up -d`, a wrapper that points
# Docker Compose at the user's Podman socket and runs it in /opt/markoto,
# whose .env (infra/render-env.sh) sets COMPOSE_FILE to this file plus the
# Podman overlay (deploy/compose/compose.podman.yml) and COMPOSE_PROFILES.
#
# Postgres: the bundled container runs only with the `bundled-postgres`
# profile (staging); with a managed cluster (prod) there is no Postgres
# container and every dependency on it is `required: false`.
#
# DNS and TLS prerequisites: see the operator runbook, kept outside this repository.
#
# Policy: every `${VAR}` substitution below uses `:?` so a missing .env
# entry crashes `docker compose up` instead of silently booting with an
# empty value or a hidden default. The single source of truth is .env.
#
# Common service shape lives in deploy/compose/compose.base.yml (see header).
# This file overrides image tags (build → registry), hardens posture
# (expose-only, mem_limit), wires the purpose networks (below), adds
# Traefik with Let's Encrypt + the security-headers middleware, and
# attaches Postgres TLS env vars + the SENTRY/OAuth secret pass-through.

# Project name: fixed, so it does not follow this file's directory (the
# default) and keeps the container, network and volume names of the host.
name: markoto

include:
  - compose.base.yml

# Purpose networks (docs/SECURITY-HARDENING.md §C.3). `internal: true`
# = no route off the host. The renderer and markitdown, which parse
# untrusted input, reach the app and nothing else (+ the renderer's own
# egress for S3):
#   web              traefik, app, sync              (published entrypoint, app/sync egress)
#   docker-api       traefik, socket-proxy           (read-only Docker API)
#   data             postgres, valkey + app, sync, litellm, db-init, backup
#   render           app <-> renderer
#   import           app <-> markitdown
#   egress           litellm, db-init, backup        (AI providers, managed Postgres, S3)
#   renderer-egress  renderer alone                  (S3: presigned document images)
# With managed Postgres, app/sync reach the cluster through `web`, the
# others through `egress`.
#
# `web` and `docker-api` have fixed subnets: they are Traefik's networks,
# and Traefik trusts PROXY protocol headers from exactly these two ranges
# (see edge-proxy below).
networks:
  web:
    name: web
    ipam:
      config:
        - subnet: 10.213.80.0/24
  docker-api:
    internal: true
    ipam:
      config:
        - subnet: 10.213.81.0/24
  data:
    internal: true
  render:
    internal: true
  import:
    internal: true
  egress: {}
  renderer-egress: {}

# Container hardening every service gets (docs/SECURITY-HARDENING.md §C):
# no Linux capabilities, no privilege gain through setuid binaries. A service
# that needs more (a seccomp profile, a capability) spells its keys out.
x-hardening: &hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  # Read-only Docker API for Traefik (container list / inspect / events;
  # every write endpoint answers 403), so Traefik never holds the socket.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    mem_limit: 64m
    environment:
      - CONTAINERS=1
      - EVENTS=1
      - PING=1
      - VERSION=1
      - POST=0
    volumes:
      # The `markoto` user's Podman API socket
      # (/run/user/<uid>/podman/podman.sock), exported by markoto-compose.
      # Owned by that user, i.e. by root inside the rootless user namespace:
      # the proxy opens it without any capability.
      - ${CONTAINER_SOCKET:?CONTAINER_SOCKET required (run through markoto-compose)}:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m
      - /run:size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # SELinux hosts only (inert on Debian's AppArmor): a confined
      # container may not connect to the engine socket.
      - label=disable
    networks:
      - docker-api

  # The public edge. Rootless Podman publishes container ports through
  # rootlessport, a userspace proxy: the container sees the proxy's address,
  # not the client's (Podman 5.4, Debian 13). So the ports 80/443 are bound
  # by this TCP relay in the host's network namespace, which sees the real
  # client and hands its address to Traefik in a PROXY protocol v2 header;
  # Traefik is published on loopback only. TLS stays in Traefik (the relay
  # never sees plaintext). Needs net.ipv4.ip_unprivileged_port_start <= 80
  # on the host (infra/roles/podman_host). Logs no connections.
  edge-proxy:
    image: haproxy:3.4.7-alpine@sha256:b9fe316f718d5015c5cfebd8ca019591f3e44656f61d93cb8b59a1028961e530
    restart: unless-stopped
    # Sizing: deploy/config/edge/haproxy.cfg (`maxconn 8000`). `-m 320`
    # caps HAProxy's own memory (about 300 MiB at 8000 connections with
    # every buffer full; 120 MiB measured with 8000 open, busy connections): past
    # it, it refuses connections instead of growing. The kernel's socket
    # buffers of its connections count against mem_limit too, hence the
    # headroom above `-m`: clients that stop reading while a large response
    # is in flight pin tens to hundreds of KiB each.
    command: ["haproxy", "-f", "/usr/local/etc/haproxy/haproxy.cfg", "-m", "320"]
    mem_limit: 768m
    network_mode: host
    volumes:
      - ../config/edge/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro,z
    # Image user `haproxy`; no capabilities (the host sysctl makes 80/443
    # unprivileged ports), nothing writable.
    read_only: true
    <<: *hardening

  traefik:
    image: traefik:v3.7.19@sha256:aa942a00bce033c909bf1f7e861d93761be4b31a035f10d2410d33e38a8f41cf
    restart: unless-stopped
    # Every client connection passes through Traefik, and a proxied
    # WebSocket costs it about 320 KiB (TLS state, copy buffers of both
    # directions, goroutines; measured on staging, 40 MiB idle). The edge
    # admits at most 8000 connections (deploy/config/edge/haproxy.cfg):
    # 40 MiB + 8000 x 320 KiB is about 2.5 GiB. GOMEMLIMIT makes the Go
    # runtime collect harder and hand memory back to the host before the
    # hard limit; without a limit Traefik kept 1.2 GiB after a load test.
    # Raise both together with the edge's maxconn.
    mem_limit: 3g
    environment:
      - GOMEMLIMIT=2560MiB
    command:
      - "--api.dashboard=false"
      - "--global.sendAnonymousUsage=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.websecure.address=:443"
      # Client addresses arrive in PROXY protocol headers from edge-proxy,
      # through rootlessport, whose source address is Traefik's own IP on
      # one of its two networks (which one varies between starts). A header
      # from any other source is ignored, so the client address would
      # silently become that IP: keep this list equal to the two subnets.
      - "--entrypoints.web.proxyProtocol.trustedIPs=10.213.80.0/24,10.213.81.0/24"
      - "--entrypoints.websecure.proxyProtocol.trustedIPs=10.213.80.0/24,10.213.81.0/24"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=web"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL:?ACME_EMAIL required}"
      - "--certificatesresolvers.le.acme.storage=/acme.json"
      # ECDSA P-256 keys: a handshake signs with the certificate key, and an
      # RSA-4096 signature cost about 40 ms of host CPU per new connection
      # (Traefik's default key type). Renewals reuse the stored key, so a
      # store that still holds RSA keys is reset once by the deploy paths
      # (deploy/config/traefik/acme-ec-migrate.sh).
      - "--certificatesresolvers.le.acme.keytype=EC256"
      # Custom domains of published pages: the app lists the
      # verified ones as routers with a certificate from `le`. Answers an
      # empty config while NUXT_PUBLISH_TRAEFIK_TOKEN is unset.
      - "--providers.http.endpoint=http://app:3000/api/internal/traefik/custom-domains"
      - "--providers.http.pollInterval=15s"
      - "--providers.http.headers.X-Markoto-Provider-Token=${NUXT_PUBLISH_TRAEFIK_TOKEN:-}"
    # Loopback only: the public 80/443 belong to edge-proxy.
    ports:
      - "127.0.0.1:10080:80"
      - "127.0.0.1:10443:443"
    volumes:
      # Owned by the `markoto` user (0600), which is root inside the
      # rootless user namespace: readable without DAC_OVERRIDE.
      - ../../traefik/acme.json:/acme.json
    read_only: true
    # Podman (unlike Docker) leaves ip_unprivileged_port_start at 1024 in
    # the container's network namespace; Traefik has no capabilities.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    <<: *hardening
    depends_on:
      - socket-proxy
    networks:
      - web
      - docker-api

  # Bundled Postgres: only with COMPOSE_PROFILES=bundled-postgres, which
  # infra/render-env.sh sets when POSTGRES_HOST is the in-stack `postgres`.
  postgres:
    profiles:
      - bundled-postgres
    expose:
      - "5432"
    networks:
      - data

  valkey:
    # `expose:` keeps Valkey on the internal `data` network only: no
    # host port. The threat model in docs/SECURITY-HARDENING.md
    # explicitly treats the docker bridge as the trust boundary;
    # publishing 6379 to the VPS host would let any process on the box
    # hit Valkey even if firewalled at the network edge. Verify
    # post-deploy:
    #   ss -ltnp | grep :6379  # expect: nothing on the host
    expose:
      - "6379"
    networks:
      - data

  app:
    image: ${REGISTRY:?REGISTRY required}/markoto-app:${IMAGE_TAG:?IMAGE_TAG required}
    restart: unless-stopped
    # SIGTERM handler needs time to drain HTTP and close the pg pool.
    stop_grace_period: 30s
    # The Nuxt SSR + Nitro process is the busiest service. 2 GB covers SSR
    # render peaks + the pg pool + in-flight AI loops with headroom; a cap
    # means a leak or a pathological request restarts the app alone rather
    # than OOMing sync/postgres/renderer alongside it.
    mem_limit: 2g
    environment:
      # BEGIN env:gen app, plain passthrough of the registry variables (shared/env/); regenerate with `bun run env:gen`.
      - NUXT_CANONICAL_SITE_URL=${NUXT_CANONICAL_SITE_URL:-}
      - NUXT_ADMIN_USER_EMAILS=${NUXT_ADMIN_USER_EMAILS:-}
      - NUXT_SESSION_PASSWORD=${NUXT_SESSION_PASSWORD:?NUXT_SESSION_PASSWORD required}
      - NUXT_JWT_SECRET=${NUXT_JWT_SECRET:?NUXT_JWT_SECRET required}
      - NUXT_JWT_SECRET_PREVIOUS=${NUXT_JWT_SECRET_PREVIOUS:-}
      - NUXT_INTERNAL_API_SECRET=${NUXT_INTERNAL_API_SECRET:?NUXT_INTERNAL_API_SECRET required}
      - NUXT_INTERNAL_API_SECRET_PREVIOUS=${NUXT_INTERNAL_API_SECRET_PREVIOUS:-}
      - NUXT_ENCRYPTION_KEY=${NUXT_ENCRYPTION_KEY:?NUXT_ENCRYPTION_KEY required}
      - NUXT_ENCRYPTION_KEY_PREVIOUS=${NUXT_ENCRYPTION_KEY_PREVIOUS:-}
      - NUXT_AI_DICTATE_JWT_SECRET=${NUXT_AI_DICTATE_JWT_SECRET:-}
      - NUXT_OAUTH_GITHUB_CLIENT_ID=${NUXT_OAUTH_GITHUB_CLIENT_ID:-}
      - NUXT_OAUTH_GITHUB_CLIENT_SECRET=${NUXT_OAUTH_GITHUB_CLIENT_SECRET:-}
      - NUXT_OAUTH_GOOGLE_CLIENT_ID=${NUXT_OAUTH_GOOGLE_CLIENT_ID:-}
      - NUXT_OAUTH_GOOGLE_CLIENT_SECRET=${NUXT_OAUTH_GOOGLE_CLIENT_SECRET:-}
      - PGSSL=${PGSSL:-}
      - VALKEY_PASSWORD=${VALKEY_PASSWORD:-}
      - NUXT_S3_ENDPOINT=${NUXT_S3_ENDPOINT:?NUXT_S3_ENDPOINT required}
      - NUXT_S3_ACCESS_KEY=${NUXT_S3_ACCESS_KEY:?NUXT_S3_ACCESS_KEY required}
      - NUXT_S3_SECRET_KEY=${NUXT_S3_SECRET_KEY:?NUXT_S3_SECRET_KEY required}
      - NUXT_IMAGE_GC_RETENTION_DAYS=${NUXT_IMAGE_GC_RETENTION_DAYS:-}
      - NUXT_MARKITDOWN_API_SECRET=${NUXT_MARKITDOWN_API_SECRET:?NUXT_MARKITDOWN_API_SECRET required}
      - NUXT_PUBLIC_SYNC_HIDDEN_DISCONNECT_MS=${NUXT_PUBLIC_SYNC_HIDDEN_DISCONNECT_MS:-}
      - RENDERER_ALLOWED_ORIGINS=${RENDERER_ALLOWED_ORIGINS:-}
      - JINA_AI_API_KEY=${JINA_AI_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - STAAN_API_KEY=${STAAN_API_KEY:-}
      - NUXT_WEB_TOOLS_HOURLY_LIMIT=${NUXT_WEB_TOOLS_HOURLY_LIMIT:-}
      - NUXT_WEB_TOOLS_DAILY_LIMIT=${NUXT_WEB_TOOLS_DAILY_LIMIT:-}
      - NUXT_AI_DEFAULT_CHAT_MODEL=${NUXT_AI_DEFAULT_CHAT_MODEL:-}
