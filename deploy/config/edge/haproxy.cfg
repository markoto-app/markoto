# edge-proxy (deploy/compose/compose.prod.yml): the public 80/443 of the
# hosted stack on rootless Podman. A plain TCP relay in the host's network
# namespace: it sees the real client address and passes it to Traefik in a
# PROXY protocol v2 header. TLS, HTTP and routing stay in Traefik.
#
# IPv4 and IPv6 are separate sockets on purpose: a dual-stack socket would
# report IPv4 clients as ::ffff:a.b.c.d, and the app keys IPv6 rate limits
# on the /64, which would put every IPv4 client into one bucket.
# No `log` lines: client addresses are not written anywhere here.

global
  # Concurrent client connections (each also opens one to Traefik). At the
  # limit HAProxy stops accepting: further clients wait in the kernel's
  # listen queue and get in as connections close, instead of the relay
  # being OOM-killed with every connection on it. Sized with the memory
  # limits in deploy/compose/compose.prod.yml (edge-proxy and traefik):
  #   - HAProxy: about 40 MiB + 12 KiB per open connection (measured: staging
  #     and a local 8000-connection run), at most about 33 KiB per connection
  #     when both of its 16 KiB buffers are full; `-m 320` caps HAProxy's own
  #     allocations, so it refuses new connections rather than outgrow it.
  #   - Traefik holds every one of them: about 40 MiB + 320 KiB per
  #     WebSocket (staging), which is what bounds this number.
  # Raise maxconn only together with both limits. File descriptors: about
  # two per connection; the container inherits the user's limit (systemd
  # user manager, 524288 hard by default).
  maxconn 8000
  # A soft stop waits for open connections (WebSockets stay open for
  # hours); give them five seconds, then close.
  hard-stop-after 5s

defaults
  mode tcp
  timeout connect 5s
  # Idle limits. The sync WebSocket exchanges pings far more often.
  timeout client 1h
  timeout server 1h
  timeout client-fin 30s
  timeout server-fin 30s

frontend http
  bind 0.0.0.0:80
  bind [::]:80 v6only
  default_backend traefik_http

frontend https
  bind 0.0.0.0:443
  bind [::]:443 v6only
  default_backend traefik_https

# Traefik's entrypoints, published on the host's loopback only.
backend traefik_http
  server traefik 127.0.0.1:10080 send-proxy-v2

backend traefik_https
  server traefik 127.0.0.1:10443 send-proxy-v2
