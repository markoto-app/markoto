# SonarQube Cloud (formerly SonarCloud) analysis configuration.
#
# Run via .github/workflows/sonar.yml on PR + push to main. Local manual
# scans go through the Sonar MCP server. Project key +
# organization come from the SonarCloud project page; never commit a
# token here: SONAR_TOKEN is a GH Actions secret.

sonar.projectKey=markoto-app_markoto
sonar.organization=markoto-app
sonar.projectName=markoto

# UTF-8 everywhere. Without this Sonar guesses from the runner locale and
# misreports ä/ö/é-bearing files as `Unsupported encoding`.
sonar.sourceEncoding=UTF-8

# Pin Python target version for the markitdown-server slice. Without
# this, Sonar emits "compatible with all Python 3 versions" mode which
# silences version-specific rules. Track the markitdown-server
# Dockerfile FROM line.
sonar.python.version=3.13

# Source roots. Only first-party TS we own + the tiny Python markitdown
# wrapper. We deliberately omit:
#   - infra/ (Ansible YAML; Sonar has no value-add over yamllint+ansible-lint)
#   - i18n/locales (translation JSON; high duplication is the design)
#   - drizzle/ (generated migrations + meta snapshots)
#   - public/, content/ (assets + auth-content markdown)
#   - tests/ (declared separately under sonar.tests)
sonar.sources=app,server,shared,sync-server,scripts,renderer/src,markitdown-server

sonar.tests=tests

# Files to ignore entirely: neither analysed nor counted as covered.
# Mirror common build/cache outputs and anything generated.
sonar.exclusions=\
  **/*.d.ts,\
  **/node_modules/**,\
  **/.nuxt/**,\
  **/.output/**,\
  **/.cache/**,\
  **/dist/**,\
  **/coverage/**,\
  drizzle/**,\
  i18n/locales/**,\
  public/**,\
  test-results/**,\
  playwright-report/**,\
  tests/e2e/output/**,\
  infra/collections/**,\
  infra/.ansible/**,\
  **/*.min.js,\
  **/*.min.css

# Files scanned for issues but excluded from the coverage denominator.
# Mirror vitest.config.ts coverage.exclude: code that runs in a
# subprocess (server/api, server/middleware, server/plugins,
# server/routes) is exercised by the integration suite but invisible to
# c8 (see docs/contributing/testing.md, "Coverage"). Listing them here
# prevents Sonar from publishing false-zero rows.
sonar.coverage.exclusions=\
  **/*.config.{ts,mjs},\
  **/*.test.ts,\
  app/components/**,\
  app/pages/**,\
  app/layouts/**,\
  app/plugins/**,\
  app/middleware/**,\
  app/error.vue,\
  app/app.vue,\
  server/api/**,\
  server/routes/**,\
  server/middleware/**,\
  server/plugins/**,\
  server/db/schema.ts,\
  scripts/**,\
  renderer/src/**,\
  markitdown-server/**,\
  drizzle.config.ts,\
  nuxt.config.ts,\
  sentry.*.config.ts,\
  content.config.ts,\
  eslint.config.mjs,\
  vitest.config.ts,\
  playwright.config.ts

# Files where copy-paste detection produces noise rather than signal.
sonar.cpd.exclusions=\
  drizzle/**,\
  i18n/locales/**,\
  tests/**,\
  shared/templates/**

# Test scope. Vitest writes lcov to ./coverage/lcov.info via the v8
# provider (see vitest.config.ts).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.test.inclusions=tests/**/*.test.ts
