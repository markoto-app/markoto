# SonarQube Cloud (formerly SonarCloud) analysis configuration.
#
# Run via .github/workflows/sonar.yml on PR + push to main. Local manual
# scans go through the Sonar MCP server. Project key +
# organization come from the SonarCloud project page; never commit a
# token here: SONAR_TOKEN is a GH Actions secret.

sonar.projectKey=markoto-app_markoto
sonar.organization=markoto-app
sonar.projectName=markoto

# UTF-8 everywhere. Without this Sonar guesses from the runner locale and
# misreports ä/ö/é-bearing files as `Unsupported encoding`.
sonar.sourceEncoding=UTF-8

# Pin Python target version for the markitdown-server slice. Without
# this, Sonar emits "compatible with all Python 3 versions" mode which
# silences version-specific rules. Track the markitdown-server
# Dockerfile FROM line.
sonar.python.version=3.14

# Source roots. Only first-party TS we own + the tiny Python markitdown
# wrapper. We deliberately omit:
#   - infra/ (Ansible YAML; Sonar has no value-add over yamllint+ansible-lint)
#   - i18n/locales (translation JSON; high duplication is the design)
#   - drizzle/ (generated migrations + meta snapshots)
#   - public/, content/ (assets + auth-content markdown)
#   - tests/ (declared separately under sonar.tests)
sonar.sources=app,server,shared,sync-server,scripts,renderer/src,markitdown-server

sonar.tests=tests

# Files to ignore entirely: neither analysed nor counted as covered.
# Mirror common build/cache outputs and anything generated.
sonar.exclusions=\
  **/*.d.ts,\
  **/node_modules/**,\
  **/.nuxt/**,\
  **/.output/**,\
  **/.cache/**,\
  **/dist/**,\
  **/coverage/**,\
  drizzle/**,\
  i18n/locales/**,\
  public/**,\
  test-results/**,\
  playwright-report/**,\
  tests/e2e/output/**,\
  infra/collections/**,\
  infra/.ansible/**,\
  **/*.min.js,\
  **/*.min.css

# Files scanned for issues but excluded from the coverage denominator.
# Mirror vitest.config.ts coverage (include + exclude): code that runs in a
# subprocess (server/api, server/middleware, server/plugins,
# server/routes) is exercised by the integration suite but invisible to
# c8 (see docs/contributing/testing.md, "Coverage"). Listing them here
# prevents Sonar from publishing false-zero rows: Sonar counts a source
# file that is missing from the lcov as 0 % covered. Python (markitdown,
# the LiteLLM handler under deploy/) is tested in its own container, not
# under vitest. Shell, YAML, Dockerfiles and Ansible have no coverage
# metric at all, so they never count here.
sonar.coverage.exclusions=\
  **/*.config.{ts,mjs},\
  **/*.test.ts,\
  app/components/**,\
  app/pages/**,\
  app/layouts/**,\
  app/plugins/**,\
  app/middleware/**,\
  app/error.vue,\
  app/app.vue,\
  server/api/**,\
  server/routes/**,\
  server/middleware/**,\
  server/plugins/**,\
  server/db/schema/**,\
  scripts/**,\
  renderer/src/**,\
  markitdown-server/**,\
  deploy/**,\
  drizzle.config.ts,\
  nuxt.config.ts,\
  sentry.*.config.ts,\
  content.config.ts,\
  eslint.config.mjs,\
  vitest.config.ts,\
  playwright.config.ts

# Files where copy-paste detection produces noise rather than signal.
sonar.cpd.exclusions=\
  drizzle/**,\
  i18n/locales/**,\
  tests/**,\
  shared/templates/**

# Test scope. Vitest writes lcov to ./coverage/lcov.info via the v8
# provider (see vitest.config.ts).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.test.inclusions=tests/**/*.test.ts

# Findings reviewed and accepted by design. Each entry names the reason;
# everything else is fixed in code or suppressed inline with a NOSONAR
# comment that says why.
#   e1, e2  javascript + typescript:S4036 in scripts/: developer + CI tools that
#       run `git`, `bun`, `pdftoppm`, `python3` from the caller's own PATH.
#       Absolute paths would break on macOS / Homebrew / Nix, and whoever
#       controls that PATH already controls the shell running the script.
#       Server code (server/, sync-server/, renderer/) is not covered here.
#   e3  githubactions:S6505 (bun install without --ignore-scripts): Bun
#       runs no dependency lifecycle script except its built-in trusted
#       list; the ones that do run (better-sqlite3 prebuilt binary, esbuild)
#       and the root `postinstall` (`nuxt prepare`) are needed by the lint,
#       type check and test jobs. The lockfile is frozen. A job that needs
#       no scripts already passes --ignore-scripts (publish-flow-shots.yml,
#       every Dockerfile).
#   e4  shell:S5332 in install.sh: plain http is the documented no-domain
#       mode of the self-host installer (LAN or behind the operator's own
#       TLS proxy, with a warning that login needs HTTPS); the health probe
#       goes to 127.0.0.1.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.e1.resourceKey=scripts/**
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.e2.resourceKey=scripts/**
sonar.issue.ignore.multicriteria.e3.ruleKey=githubactions:S6505
sonar.issue.ignore.multicriteria.e3.resourceKey=.github/workflows/**
sonar.issue.ignore.multicriteria.e4.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.e4.resourceKey=install.sh
