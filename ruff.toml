# Python is small and lives in a few places: markitdown-server/ (FastAPI, 3.13),
# infra/litellm/custom_handlers.py (LiteLLM plugin, runs on the LiteLLM image's
# Python), tests/fixtures/fake-openai/ (stdlib test double) and a few scripts.
# Sonar pins 3.13; the markitdown Dockerfile is python:3.13-slim.
target-version = "py313"
line-length = 100
# Markdown fixtures hold sample code blocks that are test data; ruff 0.17
# would reformat them.
extend-exclude = ["node_modules", ".nuxt", ".output", "**/*.md"]

[lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  # Formatter owns line length.
  "E501",
  # Ambiguous unicode in comments/docstrings (arrows, dashes) is deliberate prose.
  "RUF001", "RUF002", "RUF003",
]

[lint.per-file-ignores]
# Tests and the test double legitimately use assert, fixed ports, 0.0.0.0 binds
# and http:// URLs.
"markitdown-server/test_*.py" = ["S101", "S105", "S106", "S108"]
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "S310"]

# Known findings in code that is not touched by the repo-health pass (changing
# `raise` chains or import order alters runtime behaviour, so each needs its own
# review). Shrink-only: fix a finding, then delete its entry.
"infra/litellm/custom_handlers.py" = [
  "F401", # ImageObject / ImageResponse / Any imported but unused
  "B904", # `raise` inside `except` without `from`
]
"markitdown-server/server.py" = [
  "E402", # import after the early env/limits setup
  "S105", # SECRET_HEADER is a header NAME, not a secret
  "S112", # try/except/continue in the archive pre-flight
  "B904", # `raise HTTPException` inside `except` without `from`
]
"markitdown-server/test_server.py" = ["SIM117"]
